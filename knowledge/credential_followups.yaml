# What a WORKING credential unlocks.
#
# knowledge/service_tools.yaml answers "how do I test this service" and every one
# of its credential entries is brute force — tools for OBTAINING a credential.
# Nothing anywhere answered the question that comes next: msfadmin:msfadmin works
# on ssh, now what? So a valid credential was recorded and the run stopped. A
# pentester had to notice it in the assets panel and drive the follow-on by hand.
#
# This file is the missing half, and it is DATA on purpose. The same operator who
# adds a tool to service_tools.yaml can add what that tool does with a password,
# without touching Python.
#
# HOW IT IS USED
#   etl/credential_followups.py reads this, matches on protocol (or port), and
#   queues each entry as a PENDING scan_recommendation. It never dispatches:
#   a human presses Run, and every proposal passes the scope gate first.
#
# THE SECRET IS NOT SUBSTITUTED HERE
#   `{password}` is left literal in the stored command. The recommendation
#   carries `credential_id` in its extra, and the runner resolves the secret from
#   credential_findings at execution time. A stored command string is shown in
#   the UI, written to reports and exported; a password baked into it would leak
#   through all three. `{username}` IS substituted — it is not secret, and the
#   command is unreadable without it.
#
# FIELDS
#   name      the tool, matching service_tools.yaml naming
#   purpose   what it gets you — shown to the operator in the queue
#   command   template; {target} {port} {username} {password} {credential_id}
#   priority  LOWER RUNS FIRST. This matches the rest of the stack — the
#             recommender uses `base_priority = 5 if msf else 10`, and every
#             ORDER BY priority in the codebase is ascending, including the one
#             in the recon agent's drain that decides dispatch order. The first
#             version of this file used "higher first" and got exactly the wrong
#             order: nxc at 90 sorted BEHIND an nmap script at 55, so the
#             follow-up that confirms command execution would have run last.
#             Anything that yields a shell or a file listing outranks anything
#             that only enumerates.
#   why       why this follows from a credential specifically. An entry that
#             would be just as valid without one belongs in service_tools.yaml.

version: 1

protocols:

  ssh:
    - name: netexec
      purpose: authenticated command execution and host enumeration
      command: "netexec ssh {target} --port {port} -u {username} -p '{password}' -x 'id; uname -a'"
      priority: 10
      why: >
        A working SSH credential is interactive access. Confirming command
        execution is the difference between "a password works" and "we have the
        host", and it is the first thing a report needs to state.
    - name: ssh-post-enum
      purpose: post-access enumeration — sudo rights, keys, config, identity
      # Covers the "Post-Exploitation / If Access Gained" checklist in
      # knowledge/playbooks/ssh_methodology.md, which until now existed only as
      # prose for RAG context: nothing executed it and nothing tracked whether
      # any of it had been done. Read-only; -n on sudo so it never prompts.
      # Run through netexec rather than ssh: `ssh` is NOT on the listener's
      # allowed-tool list and never was, so the first version of this entry
      # could not execute at all. netexec ssh -x does the same remote execution
      # and IS allowed.
      command: >-
        netexec ssh {target} --port {port} -u {username} -p '{password}'
        -x 'id; hostname; cat /etc/os-release 2>/dev/null | head -3;
         echo "--- sudo ---"; sudo -n -l 2>&1 | head -20;
         echo "--- keys ---"; ls -la ~/.ssh 2>/dev/null;
         cat ~/.ssh/authorized_keys 2>/dev/null;
         echo "--- known_hosts (lateral targets) ---"; cat ~/.ssh/known_hosts 2>/dev/null | head -20;
         echo "--- sshd_config ---"; grep -Ei "permitrootlogin|passwordauthentication|authorizedkeysfile" /etc/ssh/sshd_config 2>/dev/null'
      priority: 20
      why: >
        Whether the account can escalate decides whether this is one host or the
        network, and sudo -n -l answers it without prompting. known_hosts names
        the hosts this account already reaches, which is the input to every key-
        reuse decision — the playbook's "check for key reuse" step, which nothing
        could act on while the checklist was prose.
    - name: ssh-private-keys
      purpose: locate private keys usable against other hosts
      command: >-
        netexec ssh {target} --port {port} -u {username} -p '{password}'
        -x 'for f in ~/.ssh/id_* /home/*/.ssh/id_* /root/.ssh/id_*; do
           [ -f "$f" ] && echo "== $f ==" && head -1 "$f"; done 2>/dev/null'
      priority: 35
      why: >
        A readable private key is lateral movement without another password, and
        it is the one post-access finding that changes the scope of an
        engagement. Only the first line is printed — enough to identify a key
        and its type without pulling the key material into the database.

  ftp:
    - name: lftp
      purpose: list what the account can actually read
      command: "lftp -u {username},'{password}' -p {port} {target} -e 'ls -la; quit'"
      priority: 25
      why: >
        An FTP login that reaches nothing is a finding of a different severity
        from one that reaches the webroot. The listing is what settles it.
    - name: nmap
      purpose: check whether the account can write
      command: "nmap -p {port} --script ftp-anon,ftp-syst {target}"
      priority: 45
      why: >
        Write access on FTP over a path the web server serves is a route to code
        execution, and it is not visible from a successful login alone.

  telnet:
    - name: telnet-post-enum
      purpose: confirm the shell and identify the host
      command: "netexec ssh {target} --port 22 -u {username} -p '{password}' -x 'id; hostname'"
      priority: 15
      why: >
        Telnet credentials usually mean a legacy device where the same account
        recurs. Identifying the host is what makes reuse testable.

  mysql:
    - name: mysql
      purpose: enumerate databases and check FILE privilege
      command: "mysql -h {target} -P {port} -u {username} -p'{password}' -e 'select user(); show databases; show grants;'"
      priority: 20
      why: >
        FILE privilege turns a database login into arbitrary file read and
        potentially write. `show grants` is the one query that answers it.

  postgresql:
    - name: psql
      purpose: enumerate databases and check superuser
      # The allow-list checks the FIRST token, so an env-var prefix made this
      # read as a tool called "'{password}'". Connection string instead.
      command: "psql 'postgresql://{username}:{password}@{target}:{port}/postgres' -c '\\du' -c '\\l'"
      priority: 20
      why: >
        A superuser role on Postgres permits COPY FROM PROGRAM, which is command
        execution. Whether the role has it is the whole question.

  mssql:
    - name: netexec
      purpose: check xp_cmdshell and enumerate databases
      command: "netexec mssql {target} --port {port} -u {username} -p '{password}' --local-auth -q 'select name from sys.databases'"
      priority: 15
      why: >
        xp_cmdshell is command execution as the service account, and sysadmin can
        enable it even when it is off.

  smb:
    - name: netexec
      purpose: enumerate shares, sessions and local admin
      command: "netexec smb {target} -u {username} -p '{password}' --shares --sessions"
      priority: 10
      why: >
        Whether this credential is local admin anywhere decides whether it is a
        finding or a foothold, and --shares says what it can read today.
    - name: netexec-sam
      purpose: attempt credential material extraction where admin
      # impacket-secretsdump is NOT on the listener's allowed-tool list, so the
      # first version of this entry could never run. netexec does the same job
      # and is allowed.
      command: "netexec smb {target} -u {username} -p '{password}' --sam"
      priority: 30
      why: >
        Only meaningful once admin is confirmed above. Queued separately so an
        operator chooses it deliberately rather than having it follow on.

  rdp:
    - name: netexec
      purpose: confirm the credential grants an interactive session
      command: "netexec rdp {target} --port {port} -u {username} -p '{password}'"
      priority: 20
      why: >
        RDP accepting a password at the protocol level is not the same as the
        account being permitted to log on interactively.

  vnc:
    - name: vncviewer
      purpose: confirm the password opens a session
      # vncsnapshot is not on the allowed-tool list; vncviewer is. It cannot
      # screenshot headlessly, so this confirms access and the operator takes
      # the screenshot — which is the honest division of labour for a tool that
      # collects data for a human to act on.
      command: "vncviewer -passwd /dev/stdin {target}:{port} -ViewOnly"
      priority: 30
      why: >
        VNC usually lands on an already-logged-in desktop. What is on the screen
        is the finding, and a screenshot is the only way to report it.

  ldap:
    - name: netexec
      purpose: authenticated directory enumeration
      command: "netexec ldap {target} --port {port} -u {username} -p '{password}' --users --groups"
      priority: 25
      why: >
        An authenticated bind returns the user and group list that an anonymous
        bind will not, which is the input to every later spray decision.
