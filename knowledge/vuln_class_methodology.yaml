# Per-vulnerability-class exploitation methodology ("skills").
#
# Read DIRECTLY by common/vuln_skills.py (by canonical class), and ALSO embedded
# into rag_documents via etl/load_knowledge_documents.py so it is RAG-retrievable.
# Keyed by a canonical coarse class id; `aliases` absorb every other identifier the
# stack uses (human names, wstg_map ids, owasp_param_tests categories, CWE ids,
# nuclei tags prefixed "nuclei:") so all resolve to ONE skill.
#
# Two length-budgeted fields per class:
#   web_hint          <= 700 chars — terse, for the small exploit_gen web model.
#   synth_methodology <= 1500 chars — fuller "prove impact", for the synth model.
# Authored terse on purpose; do NOT let these grow past the caps (a test enforces
# it) — they compete with target context in a small model's window.
version: 1
classes:

  sqli:
    aliases: [sql injection, sql-injection, sqli_detect, sqli_dump, error-based sqli,
              blind sqli, boolean sqli, time-based sqli, "CWE-89", "nuclei:sqli",
              "nuclei:sql-injection"]
    web_hint: >-
      Order: error -> boolean -> UNION -> time. Break syntax with a single quote or
      a paren, then observe. Boolean: ' OR '1'='1 vs ' AND '1'='2 (page differs).
      UNION: ' UNION SELECT NULL-- , pad NULLs until column count matches. Time
      (blind): ' OR SLEEP(5)-- (MySQL), ' OR pg_sleep(5)-- (Postgres), '; WAITFOR
      DELAY '0:0:5'-- (MSSQL). Success = SQL error text, a response that flips with
      the boolean, or a delay that tracks the predicate. Bypass: /**/ comments,
      mixed case, URL/hex encoding, 0x literals, doubled quotes.
    synth_methodology: >-
      Prove impact, do not stop at detection. Fingerprint the DB from an error or a
      version marker (version(), @@version, current_database()). Confirm with a
      boolean pair that flips the response, then escalate to a UNION that reflects a
      UNIQUE marker, e.g. ' UNION SELECT 'CANARY7f3',NULL-- . If blind, gate a time
      delay on a true/false predicate and show the timing tracks it. Proof = the
      marker or version string echoed back, or the predicate-linked delay. Fastest
      confirmation: sqlmap --batch --technique=BEUST against the exact parameter;
      capture the retrieved banner / current_user as evidence. Do NOT dump tables or
      modify data — one version/marker row proves exploitability.

  xss:
    aliases: [cross-site scripting, cross site scripting, reflected xss, stored xss,
              dom xss, xss_detect, xss_reflected, xss_stored, xss_dom, "CWE-79",
              "nuclei:xss"]
    web_hint: >-
      Reflect a unique marker first (e.g. zz9pk) and find where it lands: HTML body,
      attribute, JS string, or URL. Choose the payload for the context. HTML:
      <svg onload=alert(1)>. Attribute: "><svg onload=alert(1)>. JS string:
      ';alert(1)// . Confirm the marker renders as an element/executes, not encoded
      text. Bypass: mixed case <ScRiPt>, no-space svg/onload, event handlers over
      <script>, HTML-entity/URL encoding, backtick template strings. Note stored vs
      reflected (does it persist across a reload?).
    synth_methodology: >-
      Show script execution in the response context, not just reflection. Inject a
      context-appropriate payload carrying a UNIQUE token and prove the token
      appears UNENCODED inside an executable position (a real tag/handler), e.g.
      <img src=x onerror=console.log('CANARY7f3')>. For DOM XSS, trace the source
      (location.hash/search) to a sink (innerHTML, eval, document.write). Proof =
      the payload present as live markup in the returned HTML (grep the raw
      response for the tag, not the encoded form). Detection-only fallback: the
      marker reflected without encoding. Benign payload only (console.log/alert),
      never a real credential-stealing or navigation payload against the target.

  command_injection:
    aliases: [command injection, os command injection, os-command-injection, rce,
              remote code execution, cmd_injection, code injection,
              "CWE-77", "CWE-78", "CWE-94", "nuclei:rce"]
    web_hint: >-
      Append a command with a shell separator: ; | & && || `cmd` $(cmd), and
      newline %0a. Echo a unique marker: ;echo CANARY7f3 . Blind? Use time: ;sleep 5
      or | ping -c 5 127.0.0.1, and confirm the delay. OOB: trigger a DNS/HTTP
      callback to a controlled host. Success = the marker in output or the timed
      delay/callback. Bypass: ${IFS} for spaces, quotes to split tokens (w'h'oami),
      $@ , base64|sh. For uploads: plant a benign script and request it back.
    synth_methodology: >-
      Prove code execution with a benign, unique marker — never a destructive or
      state-changing command. Inject a separator plus echo of a random token
      (e.g. ;echo CANARY7f3;) and show the token in the response. If output is not
      reflected (blind), use a deterministic time delay (sleep N) keyed so the
      response time proves execution, or an out-of-band DNS/HTTP callback to a host
      you control. For deserialization, craft a gadget whose only effect is the
      marker/delay. Proof = the echoed token, the predicate-linked delay, or the
      OOB callback log. Read a canary (id, hostname) at most; do NOT spawn a shell,
      write files, or run anything that changes the target.

  ssrf:
    aliases: [ssrf, server-side request forgery, server side request forgery,
              ssrf_detect, "CWE-918", "nuclei:ssrf"]
    web_hint: >-
      Point a URL/host/webhook/image/import parameter at something you observe.
      Best proof: an out-of-band callback to a host you control (unique subdomain)
      — confirms the server made the request. Then probe internal targets:
      http://127.0.0.1:PORT/ , http://169.254.169.254/ (cloud metadata),
      http://[::1]/ . Success = OOB hit, or an internal response body/latency/error
      that differs from an external one. Bypass filters: decimal/hex/octal IP,
      redirects, @-tricks, alternate schemes (gopher/file/dict), DNS rebinding.
    synth_methodology: >-
      Prove the server fetches an attacker-chosen destination. Strongest proof is an
      out-of-band callback: set the parameter to a unique host you control and show
      the inbound DNS/HTTP hit came from the target. Escalate carefully to internal
      reachability — request http://127.0.0.1 or a known-closed vs known-open
      internal port and show the response/latency/error distinguishes them. Cloud:
      169.254.169.254 metadata is high impact — demonstrate reachability but capture
      only a non-secret marker (e.g. the metadata index), not credentials. Proof =
      the OOB callback, or a differential internal response. Do not pivot further or
      exfiltrate secrets — reachability is the finding.

  lfi:
    aliases: [lfi, local file inclusion, local-file-inclusion, rfi,
              remote file inclusion, path traversal, path-traversal,
              directory traversal, directory-traversal, lfi_read, "CWE-22", "CWE-98",
              "nuclei:lfi", "nuclei:traversal"]
    web_hint: >-
      Point a file/path/template/download parameter at a canary. Traversal:
      ../../../../etc/passwd (and Windows ..\..\windows\win.ini). Success = the
      canary file's content in the response (root:x:0:0 for /etc/passwd). PHP: try
      php://filter/convert.base64-encode/resource=index.php to read source. Bypass:
      URL-encode (%2e%2e%2f), double-encode, nested ....//, absolute paths, null
      byte on legacy stacks, strip trailing extension with ? or #. RFI: if remote
      URLs load, host a benign marker file and read it back.
    synth_methodology: >-
      Prove arbitrary file read, not just an error. Retrieve a stable canary whose
      content is unmistakable: /etc/passwd (expect a root:x:0:0 line) or, on Windows,
      C:\windows\win.ini. Use the minimal traversal depth that works and record the
      exact payload. If the app wraps the path (prefix/suffix), defeat it with
      encoding or a PHP filter wrapper to base64-encode application source as proof.
      Proof = the canary content (or decoded source) present in the response. Read
      one canary only — do not enumerate the filesystem, pull secrets, or chain to
      code execution in the PoC.

  open_redirect:
    aliases: [open redirect, open-redirect, unvalidated redirect, url redirection,
              open_redirect_detect, "CWE-601", "nuclei:redirect"]
    web_hint: >-
      Set a redirect/next/return/url/dest parameter to an external host and follow
      it. Payloads: https://evil.example , //evil.example , /\evil.example ,
      https:evil.example , and %2f%2fevil.example (encoded). Success = a 3xx
      Location header (or JS/meta redirect) pointing OFF the target's domain.
      Bypass: whitelisted-host prefix tricks (evil.example#target.com,
      target.com.evil.example, target.com@evil.example), backslashes, double-encode.
      Use a benign external host you control, not a real phishing target.
    synth_methodology: >-
      Prove the app redirects to an attacker-controlled external origin. Set the
      parameter to a benign host you control and show the response redirects there:
      a 3xx with a Location header off-domain, or a client-side (meta/JS) redirect.
      Record the exact payload and the resulting Location. If a host allowlist is in
      place, demonstrate the specific bypass that defeats it (prefix/@/backslash).
      Proof = the off-domain Location/redirect in the response. Impact is
      phishing/token-leak potential — do not actually target a third party; use your
      own benign host as the redirect destination.

  csrf:
    aliases: [csrf, cross-site request forgery, cross site request forgery, xsrf,
              csrf_detect, "CWE-352", "nuclei:csrf"]
    web_hint: >-
      Find a state-changing request (POST/PUT/DELETE). Check for an anti-CSRF token
      and whether it is VALIDATED: remove it, reuse another session's token, or
      swap its value — if the action still succeeds, it is vulnerable. Check
      SameSite on the session cookie (None/absent = cross-site sendable) and whether
      the action accepts GET or a simple content-type (form/urlencoded) that skips
      preflight. Success = the action completes with a forged, cross-origin-style
      request and no valid token.
    synth_methodology: >-
      Prove a state-changing action succeeds without a valid, per-session CSRF
      token. Capture a legitimate request, then replay it with the token removed,
      emptied, or replaced by an unrelated value while keeping the victim's session
      cookie — success proves the token is not enforced. Note SameSite (None/absent
      lets the cookie ride cross-site) and whether GET or a simple content-type is
      accepted. Proof = the action's success response (state changed) with no valid
      token. Demonstrate on a benign, reversible action (e.g. a profile field), not
      a destructive one, and revert it.

  xxe:
    aliases: [xxe, xml external entity, xml-external-entity, xxe injection,
              xxe_detect, "CWE-611", "CWE-827", "nuclei:xxe"]
    web_hint: >-
      Any XML sink (SOAP, SAML, DOCX/SVG upload, REST with application/xml). Inject a
      DOCTYPE with an external entity: <!DOCTYPE r [<!ENTITY x SYSTEM
      "file:///etc/passwd">]> then reference &x; in a reflected element. Success =
      file content (root:x:0:0) in the response. Blind/no reflection: use an OOB
      parameter entity to fetch an external DTD and trigger a callback to a host you
      control. Also try SSRF via http:// SYSTEM URLs. Bypass: php://filter to
      base64-encode, UTF-16, parameter entities.
    synth_methodology: >-
      Prove external entity resolution. If the parsed value is reflected, define an
      external entity for file:///etc/passwd and show its content (root:x:0:0) in the
      response. If nothing reflects (blind), use an out-of-band parameter-entity
      chain: your external DTD triggers a DNS/HTTP callback (and can exfiltrate a
      file via a query string) to a host you control — the callback is the proof.
      XXE can also be an SSRF primitive via SYSTEM "http://internal". Proof = the
      canary file content in the response or the OOB callback. Read one canary only;
      do not exfiltrate secrets or pivot in the PoC.

  idor:
    aliases: [idor, insecure direct object reference, bola,
              broken object level authorization, broken_object_level_authorization,
              broken access control, forced browsing, "CWE-639", "CWE-284",
              "CWE-566", "nuclei:idor"]
    web_hint: >-
      Find requests carrying an object id (numeric, UUID, filename, account no.) in
      path/query/body/header. Change it to another tenant's id and see if you get
      their data or can act on it. Try id+/-1, adjacent UUIDs, guessable ids, and
      re-add a removed id parameter. Test with a LOW-priv (or second) account's
      session against a HIGHER-priv object. Success = you read/modify an object your
      session should not own. Also try method/param swaps that skip the auth check.
    synth_methodology: >-
      Prove cross-account/object access with authorization held constant. Establish
      two references you own or control, then, as account A (or unauthenticated),
      request or mutate account B's object by swapping only its identifier — the
      session/token stays A's. Proof = B's data returned to A, or B's object changed
      by A, shown by a field that unmistakably belongs to B (name, email, a marker
      you planted in B). Prefer a read, or a benign reversible write you then revert.
      This is authorization, not input parsing — the assertion is "A sees/does what
      only B should", captured from the response. Do not harvest other users' real
      data beyond the one proof record.

  business_logic:
    aliases: [business logic, business-logic, business logic flaw, logic flaw,
              value tampering, price manipulation, race condition, workflow bypass,
              insufficient workflow validation, "CWE-840", "CWE-841", "CWE-362"]
    web_hint: >-
      Abuse intended functionality, not a parser. Tamper values the client "owns":
      price, quantity (negative/zero/huge), currency, discount, role/flag, other
      users' ids. Skip or reorder steps in a multi-stage flow (jump straight to the
      confirm/fulfilment endpoint). Replay one-time actions (coupon, transfer,
      vote). Race: fire N concurrent requests to double-spend or bypass a limit.
      Success = an outcome the workflow should forbid (negative total accepted,
      step skipped, limit exceeded).
    synth_methodology: >-
      Prove the system reaches a state its rules should forbid, holding auth
      constant. Identify the invariant (price >= 0, one coupon per order, step B
      requires A, quota N) and construct the minimal request sequence that breaks
      it: tamper a trusted value, skip a workflow step, replay a single-use token,
      or fire concurrent requests to win a race. Proof = the server accepting the
      illegal state — a confirmation/receipt/balance showing the broken invariant,
      captured from the response. These rarely have a payload signature, so the
      assertion is outcome-based (a specific value or status in the response). Use a
      test account and reverse any state change you make.

  ssti:
    aliases: [ssti, server-side template injection, server side template injection,
              template injection, ssti_detect, "CWE-1336", "CWE-94", "nuclei:ssti"]
    web_hint: >-
      Inject a template expression into any field that is rendered server-side. Probe
      with arithmetic that must evaluate: {{7*7}} , ${7*7} , #{7*7} , <%= 7*7 %> ,
      *{7*7} — a response containing 49 proves evaluation and fingerprints the engine
      (Jinja2/Twig/Freemarker/ERB/Velocity). Escalate per engine to read data or
      exec, e.g. Jinja2 {{config}} or {{''.__class__...}}. Success = 49 (or the
      engine's evaluated output) reflected, not the literal expression.
    synth_methodology: >-
      Prove server-side evaluation, then fingerprint. Submit a benign arithmetic
      marker that only a template engine would compute (e.g. {{7*7}} expecting 49,
      or ${7*7}); the evaluated result in the response proves SSTI and narrows the
      engine. Escalate only as far as reading a benign engine object/config value to
      confirm impact (e.g. Jinja2 {{config.items()}} — capture a non-secret key), or
      an echo of a unique marker via the engine. Proof = the computed value (49) or
      the engine object content in the response, not the literal payload. Stop at
      proof-of-evaluation; do not run OS commands or read secrets in the PoC.

  security_misconfiguration:
    aliases: [security misconfiguration, security-misconfiguration, missing security header,
              missing security headers, header not set, header missing, header is missing,
              content security policy, csp header, strict-transport-security, hsts,
              x-content-type-options, x-frame-options, anti-clickjacking, clickjacking,
              permissions policy, permissions-policy, site isolation, spectre,
              "CWE-16", "CWE-693", "CWE-1021", "CWE-1275", "nuclei:misconfig",
              "nuclei:http-missing-security-headers"]
    web_hint: >-
      Low-severity but chainable header/config gaps. Enumerate response headers and
      flag absent/weak ones: Content-Security-Policy (XSS mitigation), Strict-
      Transport-Security (TLS downgrade), X-Content-Type-Options: nosniff (MIME
      sniffing), X-Frame-Options / CSP frame-ancestors (clickjacking),
      Permissions-Policy. Also check dangerous methods (PUT/DELETE/TRACE) and
      directory listing. Confirm by showing the header is missing/weak in the raw
      response and naming the concrete attack it enables (no X-Frame-Options ->
      framed clickjacking; no nosniff -> MIME confusion).
    synth_methodology: >-
      Do not report a missing header in isolation — tie it to the attack it permits.
      Missing/weak CSP: show a reflected value a CSP would have blocked. Missing
      X-Frame-Options/frame-ancestors: build a minimal <iframe> PoC page that frames
      the target and show the sensitive UI renders inside it (clickjacking). Missing
      HSTS: note the http:// downgrade path. Missing X-Content-Type-Options: show a
      response served with a sniffable content type. Proof = the raw response headers
      captured (grep for the absent header) PLUS the concrete demonstration (the
      framing PoC, the sniffed type). Keep it non-destructive. Bundle related header
      gaps on one host into ONE misconfiguration finding rather than one per header.

  information_disclosure:
    aliases: [information disclosure, info disclosure, information leak, sensitive data exposure,
              server leaks, version information, version disclosure, x-powered-by,
              suspicious comments, banner information leak, in page banner, banner leak,
              base64 disclosure, verbose error, stack trace, "CWE-200", "CWE-209",
              "CWE-497", "CWE-538", "nuclei:exposure", "nuclei:disclosure"]
    web_hint: >-
      Collect data the app should not reveal: server/framework versions (Server,
      X-Powered-By), verbose errors/stack traces, source in HTML comments,
      .git/.env/backup files, directory listings, internal IPs/paths, base64 blobs.
      Trigger errors (bad input, wrong method, malformed value) to surface stack
      traces. Confirm by capturing the exact leaked string and stating what it
      enables: a version -> targeted CVE lookup; a path -> traversal target; a
      comment -> hidden endpoint or credential.
    synth_methodology: >-
      Prove the disclosure AND its usefulness, not just presence. Capture the exact
      leaked artifact from the response — the Server/X-Powered-By value, the
      stack-trace lines, the HTML comment text, or a base64 blob decoded to something
      meaningful — and show how it advances an attack: a precise version enables a
      CVE match, a leaked absolute path seeds traversal, a comment reveals an
      endpoint or credential. Proof = the quoted leaked content plus a one-line note
      of the follow-on it enables. For exposed files (.git, backups, .env) fetch a
      small confirming slice only, not the whole file. Non-destructive; do not
      exfiltrate bulk data in the PoC.

  insecure_session_cookie:
    aliases: [insecure cookie, cookie without samesite, samesite attribute, cookie slack,
              session cookie, session management, cookie without secure, secure flag,
              httponly, http only, missing httponly, session fixation, "CWE-614",
              "CWE-1004", "CWE-384", "CWE-1275", "nuclei:cookies"]
    web_hint: >-
      Inspect Set-Cookie on session/auth cookies for three flags: Secure (else sent
      over http), HttpOnly (else readable by JS, so XSS steals it), SameSite (else
      cross-site requests carry it, enabling CSRF). Also test session fixation: does
      the session id change after login? Capture the raw Set-Cookie header. Confirm
      by naming the concrete risk each missing flag enables (no HttpOnly + an XSS =
      session theft; no SameSite = CSRF-able state change).
    synth_methodology: >-
      Tie the missing flag to an exploit, do not just note it. Capture the exact
      Set-Cookie line for the auth/session cookie. Missing HttpOnly: show
      document.cookie can read it (pair with any reflected XSS to demonstrate theft).
      Missing SameSite: show a cross-site request carries the cookie (a CSRF PoC).
      Missing Secure: note the cookie is transmitted on the http:// path. Session
      fixation: capture the session id before and after login and show it is
      unchanged, then that the pre-set id is now authenticated. Proof = the raw
      cookie header plus the demonstration (JS read, cross-site send, or unchanged
      id). Use a test account; never hijack a real user's live session.

  file_upload:
    aliases: [file upload, unrestricted file upload, arbitrary file upload, unrestricted upload,
              malicious file upload, webshell, web shell, "insecure http method - put",
              put method, webdav, "CWE-434", "nuclei:file-upload", "nuclei:fileupload"]
    web_hint: >-
      PRECONDITION: confirm a WRITE surface exists FIRST — an upload form, or
      PUT/WebDAV (OPTIONS Allow: PUT, or a benign PUT returns 200/201). None -> do
      NOT attempt an upload; it only floods.
      Find any upload path (multipart form, PUT/WebDAV, avatar/doc import). Test the
      control layers in order: extension allowlist (try .php/.jsp/.aspx, then bypasses
      .pHp, .php.jpg, double extension, .phtml), Content-Type spoof, and magic-byte
      prefix (GIF89a header then code). For WebDAV, PUT a file and GET it back.
      Success = the uploaded file is stored AND reachable at a path where the server
      executes or serves it. Locate the stored path from the response or via content
      discovery.
    synth_methodology: >-
      PRECONDITION: prove a write surface exists before uploading — an upload form
      (multipart) OR PUT/WebDAV (OPTIONS shows Allow: PUT, or a benign PUT then GET
      round-trips). If neither, STOP: there is nowhere to upload.
      Prove the upload leads to code execution or stored content, safely. Upload a
      BENIGN marker first (a .txt or image carrying a unique token) and retrieve it to
      confirm storage plus a reachable URL. Then test whether an executable extension
      is accepted: upload a harmless script that only echoes a unique token (e.g. PHP
      that prints CANARY7f3), request it, and show the token is EXECUTED (dynamic
      output), not served as text. For WebDAV, PUT the marker then GET it. Proof = the
      token returned as executed output (proves an RCE-capable upload) or the file
      retrievable at its URL (proves stored-file exposure). Do NOT upload a real
      webshell or payload; the echo marker suffices. Remove what you upload when
      possible.

  insecure_deserialization:
    aliases: [insecure deserialization, deserialization, deserialisation,
              object injection, php object injection, java deserialization,
              ".net deserialization", untrusted deserialization, unsafe deserialization,
              pickle, ysoserial, "CWE-502", "nuclei:deserialization"]
    web_hint: >-
      Untrusted data fed into a deserializer. Spot serialized blobs by their magic:
      Java rO0AB (base64) or AC ED 00 05 (raw), PHP O:8:"...": / a:2:{, .NET
      AAEAAAD///// , Python pickle \x80. Look in cookies, hidden fields, viewstate,
      params, headers, message queues. Confirm the sink deserializes attacker input,
      then escalate with ysoserial (Java: URLDNS, then CommonsCollections), phpggc
      (PHP gadget chains), or a pickle __reduce__. Prove reachability with a
      DNS/HTTP callback gadget BEFORE any RCE gadget.
    synth_methodology: >-
      Prove untrusted input reaches a deserializer, safely, before any RCE gadget.
      1) Fingerprint the format from the blob's magic bytes (Java AC ED / rO0, PHP
      O:/a:, .NET base64, pickle \x80) in a cookie/param/viewstate/header. 2) Prove
      reachability with a NON-destructive out-of-band gadget: Java ysoserial URLDNS
      or JRMPClient to a collaborator you control; PHP/pickle a payload that only
      fires a DNS/HTTP callback. A hit on your listener proves the object was
      deserialized. 3) Only if authorized, show control with a benign command gadget
      that echoes a unique marker (e.g. ysoserial CommonsCollections1 'echo
      CANARY7f3'), capturing the marker in the response or OOB. Proof = the DNS/HTTP
      callback from the deserialized gadget, or the marker echoed back. Identify the
      library + version to pick the right chain. Do NOT run destructive gadgets; the
      callback alone proves exploitability.

  jwt:
    aliases: [jwt, json web token, jwt token, jws, jwt_none, "jwt none",
              algorithm confusion, jwt signature, bearer token, "CWE-347", "CWE-345",
              "nuclei:jwt"]
    web_hint: >-
      Decode the token (header.payload.signature, base64url) and run these in order:
      (1) alg:none — set header alg to "none", drop the signature (keep the trailing
      dot), resend; accepted = auth bypass. (2) Signature not verified — tamper a
      payload claim (admin:true, sub) but keep the OLD signature; accepted = no
      verification. (3) HS256 — crack the secret offline: hashcat -m 16500, or
      jwt_tool -C. (4) kid/jku/jwk in the header — inject: kid path traversal/SQLi,
      jku/jwk pointing at a key you host. (5) RS256 with the public key available —
      algorithm confusion: re-sign as HS256 using the RSA public key as the HMAC
      secret. jwt_tool automates all five.
    synth_methodology: >-
      Test JWT trust in this order, capturing the exact token before and after.
      1) alg:none — rebuild the header as {"alg":"none","typ":"JWT"}, keep the
      payload, drop the signature (leave the trailing dot); if accepted, forge an
      elevated claim (role=admin / sub=another user) and prove it works on a
      protected endpoint. 2) Signature-not-verified — flip a claim (sub/role/admin)
      but keep the ORIGINAL signature; acceptance proves the signature is ignored.
      3) HS256 weak secret — crack offline: hashcat -m 16500 <token> <wordlist> or
      jwt_tool -C -d <wordlist>; a recovered secret lets you sign arbitrary tokens.
      4) kid/jku/jwk header injection — if kid is present try path traversal to a
      known file or SQLi; if jku/jwk is present host your own key and point the token
      at it. 5) RS256->HS256 confusion — if the server verifies RS256 and its PUBLIC
      key is available, sign a forged token with HS256 using the public key bytes as
      the HMAC secret; acceptance proves confusion. Proof = a forged/tampered token
      accepted at a protected endpoint (capture the 200 + the elevated action) or a
      cracked secret. Use a test account; forge only your own elevation.

  credential_access:
    aliases: [credential access, credential brute force, login brute force,
              brute force login, password spray, credential stuffing, default credentials,
              http_login, hydra, ncrack, medusa, patator, "auth attack",
              "authentication attack", "nuclei:default-login"]
    web_hint: >-
      Before ANY credential attack (http_login/hydra/ncrack/brute), CONFIRM an auth
      surface exists: (a) a login/password form (<input type=password>), (b) an HTTP
      401 with a WWW-Authenticate header (Basic/Digest/NTLM), or (c) a known login
      endpoint (/login,/signin,/admin,/auth). NO auth surface -> do NOT brute-force:
      there is no login to attack, it wastes the run and floods (can DoS) a
      single-process app. When auth IS present: match the tool to the auth TYPE
      (basic vs form vs token), enumerate valid usernames first, try default/known
      creds before a wordlist, and respect lockout + rate limits.
    synth_methodology: >-
      Gate credential brute-force on EVIDENCE, in order. 1) PROVE an auth surface
      first: fetch the target and look for (a) a form containing <input
      type="password">, (b) an HTTP 401 response carrying a WWW-Authenticate header
      (Basic/Digest/NTLM), or (c) a login endpoint (/login,/signin,/admin,/auth). If
      NONE are present, STOP — there is no login here; queuing http_login/hydra is
      wasted and can DoS a single-process server (e.g. uvicorn with no restart).
      2) If auth exists, identify its TYPE (HTTP Basic/Digest vs an HTML form vs a
      token/JSON endpoint) and pick the matching module/tool. 3) Enumerate valid
      usernames where possible (error-message or timing differences) to shrink the
      search space. 4) Try DEFAULT and product-known credentials BEFORE any wordlist.
      5) Respect account lockout and rate limits; throttle hard against fragile /
      single-process targets. 6) On a hit, store the credential in the Auth Profile
      and pivot to authenticated testing rather than continuing to brute.

  technology_match:
    aliases: [technology match, stack match, tech fingerprint, wrong stack,
              product match, applicability, fingerprint gate, "php on python",
              stack-specific exploit, "nuclei:tech"]
    web_hint: >-
      Before running any STACK-SPECIFIC exploit, confirm that stack is actually
      present. Fingerprint first: Server / X-Powered-By headers, URL file extensions
      (.php/.jsp/.aspx), session cookies (PHPSESSID/JSESSIONID/ASP.NET_SessionId),
      CMS markers (meta generator, wp-content, /administrator), /openapi.json,
      favicon hash. A PHP exploit needs PHP; a Tomcat/Struts/JBoss/WebLogic exploit
      needs the Java stack; a WordPress/Joomla/Drupal module needs that CMS. If the
      fingerprint does NOT match the exploit technology, DO NOT run it — it cannot
      work and only adds noise/DoS risk (e.g. a php_cgi RCE against a Python/uvicorn
      app is a no-op flood).
    synth_methodology: >-
      Match the exploit to the observed stack before dispatch. 1) FINGERPRINT: read
      Server and X-Powered-By headers, URL file extensions (.php/.jsp/.aspx/.do),
      session cookies (PHPSESSID/JSESSIONID/ASP.NET_SessionId), CMS markers (meta
      generator, wp-content, /administrator, Drupal.settings), /openapi.json and
      favicon hash. 2) DERIVE the stack: language (PHP/Java/.NET/Python/Node), server
      (Apache/nginx/IIS/Tomcat/uvicorn) and product/CMS. 3) GATE: only queue an
      exploit whose technology matches — a PHP exploit (php_cgi, LFI-to-RCE) requires
      PHP; a Tomcat/Struts/JBoss/WebLogic module requires the Java stack; a
      wp_/joomla/drupal module requires that CMS; an IIS/ASP.NET module requires
      .NET. 4) If the fingerprint does NOT match, STOP — the exploit cannot succeed
      on the wrong stack, wastes the run, and can DoS a fragile app. 5) When the
      stack is unknown, prefer stack-agnostic checks (generic nuclei, content
      discovery) and finish fingerprinting before committing to a stack-specific
      exploit.

  cve_applicability:
    aliases: [cve applicability, version match, exploit applicability, vulnerable
              version, patch level, backport, backported patch, banner reliability,
              "version check", spoofed banner, "nuclei:cve"]
    web_hint: >-
      Do NOT fire a version-specific CVE exploit on a version STRING alone — banners
      lie: they can be spoofed, hidden, or BACKPORT-patched (Debian/RHEL fix the bug
      while keeping the old version number). Treat the version as a HINT, then CONFIRM
      the flaw behaviorally with a SAFE check before the destructive exploit: a
      detection-only scanner (auxiliary/scanner/smb/smb_ms17_010 tests the flaw not
      the version; the bluekeep check action), a nuclei CVE template, or a benign PoC
      (a TLS heartbeat read for Heartbleed, a harmless Shellshock echo). Use version
      RANGES, not exact equality. No safe confirmation -> do not run the exploit.
    synth_methodology: >-
      Confirm applicability by BEHAVIOR, not by an exact version string. 1) Treat the
      reported product/version as a HINT only — banners can be spoofed, suppressed, or
      BACKPORT-patched (Debian/RHEL/Ubuntu fix a CVE while keeping the old version
      number), so exact-version matching both over- and under-fires. 2) Run a
      NON-DESTRUCTIVE detection FIRST: a check-only scanner
      (auxiliary/scanner/smb/smb_ms17_010 tests the actual MS17-010 flaw; the
      cve_2019_0708_bluekeep check; an SSL heartbleed scanner reads a benign
      heartbeat; a Shellshock probe echoes a unique token via CGI) or a nuclei CVE
      template. 3) Only when the safe check CONFIRMS the condition do you queue the
      destructive exploit (eternalblue, bluekeep RCE, payload). 4) Use version RANGES
      (>= a.b, < fixed) with the vendor advisory; distro backports make "version <
      fixed" necessary but NOT sufficient. 5) If no safe confirmation is possible and
      the version is the only signal, DO NOT fire a destructive or DoS-prone exploit
      on that alone — record it unconfirmed and move on. 6) The behavioral
      confirmation, not the banner, is what authorizes the exploit.
