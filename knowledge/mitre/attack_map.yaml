# Finding -> technique rules. First matching rules ALL apply (a finding can map
# to several techniques). Match keys (any present must match; omit to ignore):
#   cwe:        list of CWE ids (matches finding.cwe[])
#   cve_year_lte / cve: (reserved)
#   service:    list of service names (matches port/finding service substring)
#   source:     list of finding sources (nuclei, zap, gobuster, portscan, subfinder, brutus, ...)
#   finding_type/issue_type: list (web_findings.issue_type / recon_findings.finding_type)
#   keyword:    list of substrings matched against title/script/issue_type/output (case-insensitive)
# Each rule sets technique (+ optional confidence 0..1, default 0.6).
rules:
  - { keyword: ["sql injection", "sqli"], cwe: ["CWE-89"], technique: T1190, confidence: 0.9 }
  - { keyword: ["command injection", "rce", "remote code", "code execution", "deserial"], cwe: ["CWE-78","CWE-94","CWE-502"], technique: T1190, confidence: 0.95 }
  - { keyword: ["command injection", "rce", "webshell", "web shell"], technique: T1059, confidence: 0.7 }
  - { keyword: ["webshell", "web shell", "file upload", "upload"], cwe: ["CWE-434"], technique: T1505.003, confidence: 0.7 }
  - { keyword: ["xss", "cross-site scripting"], cwe: ["CWE-79"], technique: T1059, confidence: 0.6 }
  - { keyword: ["lfi", "rfi", "path traversal", "directory traversal", "file inclusion"], cwe: ["CWE-22","CWE-98"], technique: T1190, confidence: 0.8 }
  - { keyword: ["ssrf"], cwe: ["CWE-918"], technique: T1190, confidence: 0.7 }
  - { keyword: ["default login", "default credential", "default password", "weak password", "anonymous"], technique: T1078, confidence: 0.8 }
  - { keyword: ["default login", "default credential", "default password"], technique: "T1078.001", confidence: 0.85 }
  - { keyword: ["brute", "login", "credential"], source: ["brutus"], technique: T1110, confidence: 0.85 }
  - { keyword: ["hashdump", "dump hash", "kerberoast", "asrep", "ntds"], technique: T1003, confidence: 0.85 }
  - { service: ["ssh"], technique: "T1021.004", confidence: 0.5 }
  - { service: ["smb","netbios-ssn","microsoft-ds"], technique: "T1021.002", confidence: 0.5 }
  - { service: ["rdp","ms-wbt-server"], technique: "T1021.001", confidence: 0.55 }
  - { service: ["smb","netbios-ssn"], keyword: ["share","enum"], technique: T1135, confidence: 0.6 }
  - { source: ["subfinder","dnsx","crtsh","amass","asnmap","uncover","whois"], technique: T1590, confidence: 0.4 }
  - { source: ["portscan","nmap","masscan","naabu","httpx","whatweb"], technique: T1046, confidence: 0.4 }
  - { keyword: ["exploit public", "public-facing", "cve-"], technique: T1190, confidence: 0.6 }
  - { keyword: ["denial of service", "dos "], technique: T1499, confidence: 0.5 }

# INITIAL ACCESS COVERAGE (ATT&CK v20.0, TA0001) — one decision per technique and
# sub-technique, for the PoC workbench. Scoped to Initial Access on 2026-10-18:
# the workbench builds the FIRST foothold against a target endpoint, so this is
# the tactic it must answer for today; other tactics are not yet decided here.
#   covered      — `covered_by` names the class(es) / knowledge file(s) that test it
#   out_of_scope — `reason` says why a target-endpoint PoC cannot reach it
#   gap          — in scope, nothing tests it yet (the backlog)
# tests/test_attack_coverage.py fails if a v20 Initial Access id has no decision
# or a `covered_by` entry names nothing real.
initial_access_coverage:
  T1190:     { status: covered, covered_by: [vuln_classes.yaml#exploitable, craft_guidance.yaml] }
  T1078:     { status: covered, covered_by: [default_cred_check.yaml, service_access_methods.yaml, credential_spray_policy.yaml] }
  "T1078.001": { status: covered, covered_by: [default_cred_check.yaml, default_credentials.yaml] }
  "T1078.002": { status: covered, covered_by: [ad_attacks.yaml], reason: "domain accounts come from the AD playbook, not the web PoC workbench" }
  "T1078.003": { status: covered, covered_by: [service_access_methods.yaml, credential_spray_policy.yaml] }
  "T1078.004": { status: out_of_scope, reason: "cloud identity-provider accounts; posture is cloud_scan_rules.yaml's job, not an endpoint PoC" }
  T1133:     { status: covered, covered_by: [service_access_methods.yaml] }
  T1189:     { status: out_of_scope, reason: "needs a victim browser visiting attacker content; a graded target has none (same reason xss declares no graded goal)" }
  T1659:     { status: out_of_scope, reason: "content injection needs an on-path (adversary-in-the-middle) position, not a request to the target" }
  T1195:     { status: out_of_scope, reason: "supply chain compromise happens upstream of the target, outside the engagement scope" }
  "T1195.001": { status: out_of_scope, reason: "dependency / dev-tool compromise is upstream of the target" }
  "T1195.002": { status: out_of_scope, reason: "software supply chain compromise is upstream of the target" }
  "T1195.003": { status: out_of_scope, reason: "hardware supply chain; physical" }
  T1199:     { status: out_of_scope, reason: "abuses a third party's trusted access; that party is not in scope" }
  T1200:     { status: out_of_scope, reason: "physical hardware additions" }
  T1091:     { status: out_of_scope, reason: "physical removable media" }
  T1669:     { status: out_of_scope, reason: "wireless proximity access, not a network request to the target" }
  T1566:     { status: out_of_scope, reason: "social engineering is not automated by this platform" }
  "T1566.001": { status: out_of_scope, reason: "social engineering (attachment) is not automated" }
  "T1566.002": { status: out_of_scope, reason: "social engineering (link) is not automated" }
  "T1566.003": { status: out_of_scope, reason: "social engineering (via service) is not automated" }
  "T1566.004": { status: out_of_scope, reason: "social engineering (voice) is not automated" }

# Unified risk score weights (Phase B refines; baseline here). Final score is a
# 0..100 blend of these normalized terms.
risk:
  weights:
    severity:        0.30   # finding severity (critical=1.0 .. info=0.05)
    cvss:            0.20   # cvss/10
