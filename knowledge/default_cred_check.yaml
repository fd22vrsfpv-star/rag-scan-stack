# Default-credential check on discovered login forms (RAG-first).
#
# WHAT: when a login form is discovered (content_extractions.login_pages, or a
# login web_finding), a STANDARD followup tries a small set of DOCUMENTED default
# credentials against it and reports any that work. This closes the "Apache
# Tomcat default admin password" / "default creds on the app login" class of
# finding that a link-only crawl never tests. On success it records the working
# credential and auto-populates an Auth Profile (POST /auth-profiles/auto-populate)
# — the on-ramp to AUTHENTICATED scanning.
#
# THE SETTING (operator-configurable, bind-mounted — edit takes effect live):
#   max_auto_attempts — the threshold. If the number of candidate credential
#   pairs is AT OR BELOW this, the check auto-fires (bounded, lockout-aware,
#   scope-gated). ABOVE it, the check is NOT auto-run — it is queued for operator
#   APPROVAL first (so a large spray never fires unattended). Env override:
#   DEFAULT_CRED_MAX_AUTO_ATTEMPTS.
#
# Candidates come from knowledge/default_credentials.yaml (common + the service
# for the port + username_as_password) plus the app_login extras below. A hard
# `max_total_attempts` caps the set even when approved (never a full brute force).
default_cred_check:
  max_auto_attempts: 24          # <= this -> safe lane (auto). above -> approval.
  max_total_attempts: 120        # hard ceiling regardless of approval (not a brute force)
  # Web+LLM research of the app's OWN default creds (DuckDuckGo + LLM, keyed on the
  # login page <title> and the host's detected products) — so app-specific defaults
  # like jsmith:demo1234 for "Altoro Mutual" are DISCOVERED, not hardcoded, and
  # stored as unvalidated accounts. See app/rag-api /software/default-credentials.
  research_defaults: true
  # Generic web-app login fallbacks (kept product-agnostic; app-specific accounts
  # come from research_defaults above, not from this list).
  app_login:
    - {username: admin,  password: admin}
    - {username: admin,  password: password}
    - {username: administrator, password: administrator}
    - {username: guest,  password: guest}
    - {username: tomcat, password: tomcat}
  # Success detection: a working login differs from a known-bad baseline — it
  # redirects somewhere OTHER than a login/error page, or sets a new auth cookie.
  success:
    # a Location that does NOT match these = left the login page = success
    login_path_markers: ["login", "signin", "logon", "error", "denied", "invalid"]
  # Forms protected by a CSRF token are NOT auto-tested (a token must be fetched
  # per request); they are reported for manual review instead.
  skip_csrf: true
  # On a working credential, auto-populate an Auth Profile and trigger an
  # AUTHENTICATED re-scan (Playwright /scan resolves the profile -> ZAP spider +
  # active scan run logged-in, reaching the authenticated area a link-only crawl
  # can't). Toggle the stages here.
  authenticated_rescan:
    # Playwright WALKS the logged-in app first (real browser login, crawling
    # through the ZAP proxy so ZAP's site tree is seeded with the authenticated
    # /bank/* pages), THEN ZAP scans that seeded tree.
    crawl_first: true
    # Auth-crawl coverage. These are the DEFAULTS; the dashboard ZAP settings
    # (app_settings zap.auth_crawl.max_pages / .max_depth / .wait_seconds) override
    # them so an operator can widen the authenticated crawl to seed ZAP's whole
    # logged-in tree. Tuned up from 60/180 so /bank/* is fully walked.
    max_pages: 200
    max_depth: 5
    crawl_wait_seconds: 300
    zap_spider: true
    zap_active_scan: true
    # Broken access control / IDOR: after the authenticated crawl+spider seed the
    # tree, run ZAP's accessControl add-on. It compares who-can-reach-what across
    # the logged-in user (plus a SECOND registered user for the horizontal-IDOR
    # comparison, when one exists) and an unauthenticated baseline. Best paired
    # with the ajax spider ON (zap.ajax_spider) so dropdown/form object-ref params
    # are in the tree. Operator toggle: app_settings zap.access_control.
    zap_access_control: true
  priority: 26
  followup_tag: default_cred_check
