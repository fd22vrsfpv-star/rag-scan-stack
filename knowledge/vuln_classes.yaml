      - { id: CWE-352, name: "Cross-Site Request Forgery (CSRF)" }

  - name: ldap-injection
    kind: vulnerability
    title: LDAP Injection
    aliases: [ldapi]
    injects_via: [parameter, body]
    input_field_required: false
    file_read: false
    needs_oob_sink: false
    blind_capable: true
    proof: [echo, status_change]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-06]
    mitre: [T1190]
