  - name: rce
    kind: vulnerability
    title: Remote Code Execution
    # A generic outcome rather than a mechanism — kept because
    # _SCAN_EVIDENCE_CWE_FOR_CLASS already keys on it and findings arrive
    # labelled this way. Prefer the specific mechanism (cmdi / ssti /
    # deserialization) when the advisory names one.
    aliases: [remote-code-execution, code-execution, code-injection, arbitrary-code-execution]
    injects_via: [parameter, body]
    input_field_required: false
    file_read: false
    needs_oob_sink: true
    blind_capable: true
    proof: [oob, echo, timing]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-12]
    mitre: [T1190, T1059]
    cwes:
      - { id: CWE-94, name: "Improper Control of Generation of Code ('Code Injection')" }
      - { id: CWE-77, name: "Improper Neutralization of Special Elements used in a Command ('Command Injection')" }
      - { id: CWE-78, name: "Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')" }
      - { id: CWE-502, name: "Deserialization of Untrusted Data" }

  - name: unknown
    # NOT `vulnerability`: we do not know that it is one. Saying so keeps an
    # unclassified CVE out of `exploitable_classes()` instead of letting the
    # absence of an answer read as a mechanism.
    kind: unclassified
    title: Unclassified
    # The honest answer, and a real class: the classifier returns it rather than
    # guessing, and the gates must have a defined behaviour for it.
    aliases: []
    injects_via: []
    input_field_required: false
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: []
    owasp: null
    wstg: []
    mitre: []
    cwes: []

