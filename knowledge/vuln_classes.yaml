    aliases: [file-upload, arbitrary-file-upload, unrestricted-upload, webshell-upload]
    injects_via: [multipart]
    input_field_required: false
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: [echo, side_effect]
    owasp: "A04:2021 – Insecure Design"
    wstg: [WSTG-BUSL-09]
    mitre: [T1505.003]
    cwes:
      - { id: CWE-434, name: "Unrestricted Upload of File with Dangerous Type" }

  - name: auth-bypass
    kind: vulnerability
    title: Authentication / Authorization Bypass
    aliases: [authentication-bypass, authorization-bypass, missing-auth,
              improper-authentication, improper-authorization, privilege-escalation]
