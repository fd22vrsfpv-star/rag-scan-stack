  # ── misconfigurations and disclosures ────────────────────────────────────
  #
  # NOT exploit mechanisms: no injection point, no payload, nothing to assert,
  # so they never enter the build-PoC gates. They are here so both lanes share
  # ONE vocabulary — the scanner and the PoC builder stop having separate names
  # for the same finding — and so the ones that CHAIN can say what they enable.

  - name: webdav-put
    kind: misconfiguration
    title: Writable HTTP Methods (PUT / WebDAV)
    aliases: [webdav, webdav-enabled, put-method-enabled, dav-writable, dangerous-http-method]
    leads_to: [upload]
    input_field_required: false
    injects_via: []
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: []
    owasp: "A05:2021 – Security Misconfiguration"
    wstg: [WSTG-CONF-06]
    mitre: [T1505.003]
    cwes:
      - { id: CWE-650, name: "Trusting HTTP Permission Methods on the Server Side" }

  - name: default-credentials
    kind: misconfiguration
    title: Default or Weak Credentials
    aliases: [default-creds, default-password, weak-credentials]
    leads_to: [auth-bypass]
    input_field_required: false
    injects_via: []
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: []
    owasp: "A07:2021 – Identification and Authentication Failures"
    wstg: [WSTG-ATHN-02]
    mitre: [T1078, T1110]
    cwes:
      - { id: CWE-1392, name: "Use of Default Credentials" }

  - name: cors-misconfiguration
    kind: misconfiguration
    title: Permissive CORS Policy
    aliases: [cors, permissive-cors, cross-origin-misconfiguration]
    leads_to: []
    input_field_required: false
    injects_via: []
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: []
    owasp: "A05:2021 – Security Misconfiguration"
    wstg: [WSTG-CLNT-07]
    mitre: []
    cwes:
      - { id: CWE-942, name: "Permissive Cross-domain Policy with Untrusted Domains" }

  - name: directory-listing
    kind: disclosure
    title: Directory Listing Enabled
    aliases: [dir-listing, directory-browsing, directory-indexing]
    leads_to: []
    input_field_required: false
    injects_via: []
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: []
    owasp: "A05:2021 – Security Misconfiguration"
    wstg: [WSTG-CONF-04]
    mitre: []
    cwes:
      - { id: CWE-548, name: "Exposure of Information Through Directory Listing" }

  - name: exposed-files
    kind: disclosure
    title: Backup / Source / Config File Exposure
    aliases: [exposed-file, backup-file, source-disclosure, git-exposure, env-file]
    # Source or a .env is routinely where the credential comes from, which is a
    # chain worth recording even though the disclosure itself is not an exploit.
    leads_to: [auth-bypass]
    input_field_required: false
    injects_via: []
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: []
    owasp: "A05:2021 – Security Misconfiguration"
    wstg: [WSTG-CONF-04]
    mitre: []
    cwes:
      - { id: CWE-530, name: "Exposure of Backup File to an Unauthorized Control Sphere" }
      - { id: CWE-540, name: "Inclusion of Sensitive Information in Source Code" }

  - name: verbose-errors
    kind: disclosure
    title: Verbose Error Messages / Stack Traces
    aliases: [stack-trace, verbose-error, error-handling, information-disclosure]
    # A SQL error in a stack trace is how an injection point is found, so the
    # chain is real even though the disclosure alone proves nothing.
    leads_to: [sqli]
    input_field_required: false
    injects_via: []
    file_read: false
    needs_oob_sink: false
    blind_capable: false
    proof: []
    owasp: "A05:2021 – Security Misconfiguration"
    wstg: [WSTG-ERRH-01]
    mitre: []
    cwes:
      - { id: CWE-209, name: "Generation of Error Message Containing Sensitive Information" }
