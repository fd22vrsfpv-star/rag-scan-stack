# THE vulnerability-class table. One row per class; every other class list in
# the codebase is a PROJECTION of this file.
#
# Why this exists
# ---------------
# The same concept was spelled differently in eleven places. `_FILE_READ_CLASSES`
# alone listed `lfi`, `path-traversal` AND `path_traversal` — three names for one
# idea, in one set, because nothing normalised. Worse, each gate inlined its own
# partial alias list: 6 non-canonical spellings in one set, 6 in another, 5, 2,
# 0, 0. In a single run `path-traversal` therefore passed one gate and failed
# another. That is not eleven vocabularies; it is one vocabulary with eleven
# private, divergent spell-checkers.
#
# Two producers emit a class name — the deterministic classifier
# (`_vuln_class_from_cve`, 10 canonical names) and the LLM fallback (free text).
# `canonical()` in etl/vuln_classes.py is called ONCE at each producer's exit, so
# nothing downstream ever sees a non-canonical name and no consumer needs an
# alias list of its own.
#
# Properties are ORTHOGONAL, which is the thing a flat set cannot express and
# why the old sets drifted:
#   * XXE *is* a file read but does NOT inject through the path (it is a body).
#   * LFI *is* a file read and injects through a PARAMETER (`?page=../../etc/passwd`).
#   * Only a path traversal puts the payload in the URL path.
# Collapsing `path-traversal` into `lfi` (which `_CRAFT_CLASS_ALIASES` did, to
# give traversal some craft guidance) destroyed exactly the distinction the
# gather gate needs — and because `lfi` then sat in the path-is-the-field set,
# the gate stopped demanding a parameter for ANY file read. They share guidance;
# they are not the same class.
#
# Reference ids are carried so a finding can be reported in the vocabulary the
# reader already uses:
#   cwes   — CWE id + the official CWE name
#   owasp  — OWASP Top 10 **2021** category
#   wstg   — OWASP Web Security Testing Guide test ids (see knowledge/wstg_map.yaml)
#   mitre  — ATT&CK technique ids, which MUST exist in knowledge/mitre/attack_map.yaml
#
# Read deterministically by etl/vuln_classes.py (gates: an exact lookup, never a
# similarity score) and embedded into rag_documents by
# etl/load_knowledge_documents.py (planner: recall by similarity). CLAUDE.md
# requires both and they are not the same mechanism.

version: 1
owasp_top10_version: "2021"

# kind — what sort of finding this is, and THE GATE READS ONLY `vulnerability`.
#   vulnerability   an exploit mechanism: it has an injection point, a payload
#                   and a proof, so a PoC can be built for it.
#   misconfiguration  a setting that is wrong. There is no payload to craft and
#                   nothing to assert, so it never enters the build-PoC gates.
#   disclosure      information that leaked. Same: a finding, not a mechanism.
#
# `leads_to` is how a misconfiguration still earns its place: WebDAV PUT is not
# exploitable AS a misconfiguration, it is exploitable because it hands you an
# upload. The misconfiguration stays a finding; the class it enables is what
# goes through the gates. Both lanes share this vocabulary, so the scanner and
# the PoC builder stop having separate names for the same thing.

# injects_via vocabulary — where the payload goes. `path` means the URL path IS
# the injection point and there is no parameter to find.
injection_points: [path, parameter, body, header, cookie, multipart, none]

# A CWE maps to MANY classes, on purpose, and never decides one on its own.
#
# CWE-78 is OS command injection — it belongs to `cmdi` and to `rce`, because
# the second is the consequence of the first. CWE-98 belongs to `lfi` and to
# `rfi`, because the same weakness enables both. Forcing a single "primary"
# per CWE would make the lookup lie about one of them, and the earlier draft
# of this file did exactly that.
#
# The CLASS NAME is the primary key. A CWE is a narrowing SIGNAL. Resolution is
# the COMBINATION — `resolve(text, cwes)` in etl/vuln_classes.py:
#
#   1. a class name or alias appearing in the text wins outright;
#   2. otherwise the CWEs give a candidate set;
#   3. one candidate -> that class; several -> the ambiguity is REPORTED, not
#      silently resolved by whichever class the file happens to list first.
#
# A lookup whose answer changes when someone reorders this file is not a
# lookup, and a lookup that invents certainty it does not have is worse.

# input_field_required — must a parameter / key / field be FOUND before synth?
# NOT the same as "can inject through a parameter": auth-bypass can use one and
# does not need one, because requesting a protected path directly is the whole
# exploit. Inferring this from `injects_via` over-claimed and made the gather
# gate demand a parameter for auth-bypass.
#
# path-traversal IS required and IS satisfied by the endpoint — two different
# mechanisms. Dropping the requirement would let a traversal with no endpoint
# through the gate with nothing to attack.

# proof vocabulary — what counts as evidence the class actually fired.
proof_kinds: [echo, oob, timing, file_content, status_change, side_effect]

classes:

  - name: sqli
    kind: vulnerability
    title: SQL Injection
    aliases: [sql-injection, blind-sqli, sqli-blind, union-sqli, sql]
    injects_via: [parameter, body, header, cookie]
    input_field_required: true
    file_read: false
    needs_oob_sink: false
    blind_capable: true
    proof: [echo, timing, oob]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-05]
    mitre: [T1190]
    cwes:
      - { id: CWE-89, name: "Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')" }

  - name: xss
    kind: vulnerability
    title: Cross-Site Scripting
    aliases: [cross-site-scripting, xss-reflected, xss-stored, reflected-xss, stored-xss]
    injects_via: [parameter, body, header]
    input_field_required: true
    file_read: false
    needs_oob_sink: false
    blind_capable: true
    proof: [echo, oob]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-01, WSTG-INPV-02]
    mitre: [T1059]
    cwes:
      - { id: CWE-79, name: "Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')" }
      - { id: CWE-80, name: "Improper Neutralization of Script-Related HTML Tags in a Web Page (Basic XSS)" }

  - name: cmdi
    kind: vulnerability
    title: OS Command Injection
    aliases: [command-injection, os-command-injection, shell-injection, argument-injection]
    injects_via: [parameter, body, header]
    input_field_required: true
    file_read: false
    needs_oob_sink: true
    blind_capable: true
    proof: [echo, oob, timing]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-12]
    mitre: [T1190, T1059]
    cwes:
      - { id: CWE-77, name: "Improper Neutralization of Special Elements used in a Command ('Command Injection')" }
      - { id: CWE-78, name: "Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')" }
      - { id: CWE-88, name: "Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')" }
      # Generic code injection also lands here: the previous single-valued map
      # sent CWE-94 to cmdi, and under one-to-many it keeps that owner instead
      # of losing it. It is ALSO ssti and rce — the text decides which.
      - { id: CWE-94, name: "Improper Control of Generation of Code ('Code Injection')" }

  - name: ssti
    kind: vulnerability
    title: Server-Side Template Injection
    aliases: [template-injection, server-side-template-injection, jinja2-injection, velocity-injection]
    injects_via: [parameter, body]
    input_field_required: true
    file_read: false
    needs_oob_sink: false
    blind_capable: true
    proof: [echo, oob, timing]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-18]
    mitre: [T1190, T1059]
    cwes:
      - { id: CWE-1336, name: "Improper Neutralization of Special Elements Used in a Template Engine" }
      - { id: CWE-94, name: "Improper Control of Generation of Code ('Code Injection')" }

  - name: ssrf
    kind: vulnerability
    title: Server-Side Request Forgery
    aliases: [server-side-request-forgery, ssrf-blind, outbound-request]
    injects_via: [parameter, body]
    input_field_required: true
    file_read: false
    needs_oob_sink: true
    blind_capable: true
    proof: [oob, echo]
    owasp: "A10:2021 – Server-Side Request Forgery (SSRF)"
    wstg: [WSTG-INPV-19]
    mitre: [T1190]
    cwes:
      - { id: CWE-918, name: "Server-Side Request Forgery (SSRF)" }

  - name: xxe
    kind: vulnerability
    title: XML External Entity
    aliases: [xml-external-entity, xml-external-entities, xxe-oob]
    # A body injection. It CAN read files, which is why it belongs in a
    # file-read projection — and it is NOT a path injection, which is why a
    # single flat "file read" set could never serve both questions.
    injects_via: [body]
    input_field_required: true
    file_read: true
    needs_oob_sink: true
    blind_capable: true
    proof: [echo, oob, file_content]
    owasp: "A05:2021 – Security Misconfiguration"
    wstg: [WSTG-INPV-07]
    mitre: [T1190]
    cwes:
      - { id: CWE-611, name: "Improper Restriction of XML External Entity Reference" }

  - name: path-traversal
    kind: vulnerability
    title: Path Traversal
    # Its OWN class, not an alias of lfi. The payload is the URL path, so there
    # is no parameter to find and parameter discovery cannot help.
    aliases: [directory-traversal, dir-traversal]
    injects_via: [path]
    input_field_required: true
    file_read: true
    needs_oob_sink: false
    blind_capable: false
    proof: [file_content]
    owasp: "A01:2021 – Broken Access Control"
    wstg: [WSTG-ATHZ-01]
    mitre: [T1190]
    cwes:
      - { id: CWE-22, name: "Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')" }
      - { id: CWE-23, name: "Relative Path Traversal" }
      - { id: CWE-36, name: "Absolute Path Traversal" }

  - name: lfi
    kind: vulnerability
    title: Local File Inclusion
    # Injects through a PARAMETER (`?page=../../etc/passwd`). Listing lfi as a
    # path-injection class is what stopped the gather gate demanding a
    # parameter for every file read.
    aliases: [local-file-inclusion, file-read, arbitrary-file-read, file-disclosure, arbitrary-file-disclosure]
    injects_via: [parameter]
    input_field_required: true
    file_read: true
    needs_oob_sink: false
    blind_capable: false
    proof: [file_content, echo]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-11]
    mitre: [T1190]
    cwes:
      - { id: CWE-98, name: "Improper Control of Filename for Include/Require Statement in PHP Program ('PHP Remote File Inclusion')" }
      - { id: CWE-73, name: "External Control of File Name or Path" }

  - name: rfi
    kind: vulnerability
    title: Remote File Inclusion
    # Also a parameter, and it makes the server FETCH — so it needs an
    # out-of-band sink the way SSRF does. Aliasing it to lfi lost that.
    aliases: [remote-file-inclusion]
    injects_via: [parameter]
    input_field_required: true
    file_read: true
    needs_oob_sink: true
    blind_capable: true
    proof: [oob, echo]
    owasp: "A03:2021 – Injection"
    wstg: [WSTG-INPV-11]
    mitre: [T1190]
    cwes:
      - { id: CWE-98, name: "Improper Control of Filename for Include/Require Statement in PHP Program ('PHP Remote File Inclusion')" }

  - name: deserialization
    kind: vulnerability
    title: Insecure Deserialization
    aliases: [deser, insecure-deserialization, unsafe-deserialization, object-injection]
    injects_via: [body, parameter, cookie]
    input_field_required: false
    file_read: false
    needs_oob_sink: true
    blind_capable: true
