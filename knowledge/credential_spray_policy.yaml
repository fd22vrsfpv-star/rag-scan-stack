# When a password spray is ACCEPTABLE without the full impactful-spray approval.
#
# WHY THIS IS DATA
#   Credential spraying is impactful and approval-gated in general, because a
#   careless spray locks accounts out. But not every spray is the same risk. A
#   SMALL default-credential spray against accounts we already enumerated,
#   capped under the lockout threshold, cannot lock anyone out and is how the
#   highest-value first credentials get found (msfadmin:msfadmin, anonymous ftp,
#   username==password). Writing the acceptability rule down here — and loading
#   it into the RAG corpus — lets the planner RETRIEVE "a small default-cred
#   spray is fine here" instead of stopping at "spraying needs approval".
#
#   This is a POLICY, not a dispatcher. It tells the planner what is acceptable;
#   the scope gate and the per-account rate limit (etl/access.py, brutus) still
#   enforce it at dispatch. Loaded into rag_documents by
#   etl/load_knowledge_documents.py so search_knowledge_base can surface it.

version: 1

policies:

  - id: small-default-cred-spray
    name: "Small default-credential spray on enumerated accounts"
    verdict: acceptable
    # ALL of these must hold for the spray to count as the acceptable "small" one.
    acceptable_when:
      - "Targets accounts that are ALREADY ENUMERATED (usernames discovered by recon, e.g. enum4linux-ng, SMB/RID, LDAP) — not a generated user wordlist."
      - "Uses DEFAULT credentials only: the username as its own password, plus a short documented default set for the service (see knowledge/default_credentials.yaml)."
      - "Stays UNDER 4 password attempts per account within the lockout window (i.e. 3 or fewer), so no real account can be locked out."
    max_attempts_per_account: 3
    tools: [brutus, hydra]
    when_to_use: >
      A login service is open (ssh, ftp, telnet, smb, mysql, postgres, mssql,
      vnc, rdp, winrm), accounts are enumerated, and no valid password is held
      for the host yet. Run this FIRST, before any larger brute force.
    rationale: >
      Three or fewer default-credential attempts per already-known account is
      lockout-safe and high-value. Because it cannot lock an account, it is
      acceptable as a first credential step and does NOT need the full
      impactful-spray approval that a large spray or a credential-reuse spray
      requires. Finding ssh open, accounts enumerated, and never trying
      username==password is a miss, not caution.
    not_acceptable:
      - "4 or more attempts per account (lockout risk) — needs a discovered/authored password policy or explicit approval."
      - "A generated username list or a large password wordlist — that is brute force, not a small spray; keep it approval-gated."
      - "Credential REUSE of a found password across OTHER hosts — that is the impactful spray loop (require_approval), not this."
    enforced_by:
      - "etl/scope_gate.check_dispatch (target must be in scope, fail closed)"
      - "per-account rate limit / discovered password policy (threshold-1) at brutus"
