# Default credentials by service, and account-shaped defaults.
#
# WHY THIS FILE
# -------------
# The curated password shortlist is 25 generic passwords. It does not contain
# `msfadmin` — yet `msfadmin:msfadmin` is a credential this engagement ALREADY
# recovered on ftp and telnet. A username is very often its own password, and a
# service usually ships with a documented default pair. Neither was ever tried
# on purpose: the 48 hydra runs used a 14.3M generic list and timed out.
#
# So a target's candidate list is built from three sources, cheapest first:
#   1. service defaults below            — a handful, documented, high hit rate
#   2. usernames discovered on THIS host — enum4linux-ng found 35 of them
#   3. the generic curated shortlist     — 25 entries, the long tail
#
# `username_as_password: true` is the account-shaped default: for every username
# in the final list, try the username itself as the password.
#
# These are DEFAULTS, i.e. curated reference knowledge, not measurements from
# this engagement. Edit freely — this is a read-only bind mount, so changes take
# effect without a rebuild.

username_as_password: true

# Applied to every service, in addition to its own entries.
common:
  usernames: [root, admin, administrator, guest, test, user, operator, service]
  passwords: ["", root, admin, admin123, password, "123456", changeme, toor,
              letmein, "P@ssw0rd", default, test, guest]

services:
  ftp:
    ports: [21, 2121]
    usernames: [anonymous, ftp, admin, user]
    passwords: ["", anonymous, ftp, "ftp@example.com", admin]
    notes: anonymous/blank is the single highest-value ftp attempt.

  ssh:
    ports: [22, 2222]
    usernames: [root, admin, user, ubuntu, debian, pi, oracle, git, msfadmin]
    passwords: [root, toor, admin, raspberry, ubuntu, msfadmin, password]

  telnet:
    ports: [23, 2323]
    usernames: [root, admin, msfadmin, user, guest]
    passwords: [root, admin, msfadmin, "", password]

  smtp:
    ports: [25, 465, 587]
    usernames: [admin, postmaster, mail, root]
    passwords: [admin, mail, password]

  smb:
    ports: [139, 445]
    usernames: [guest, administrator, admin, root, msfadmin]
    passwords: ["", guest, administrator, admin, password, msfadmin]
    notes: >
      A blank guest password is common and is what a null session already
      proved reachable on this engagement.

  mysql:
    ports: [3306]
    usernames: [root, mysql, admin, dbadmin]
    passwords: ["", root, mysql, password, admin, toor]
    notes: MySQL's classic default is root with a blank password.

  postgres:
    ports: [5432]
    usernames: [postgres, admin, dbadmin]
    passwords: [postgres, password, admin, ""]

  mssql:
    ports: [1433]
    usernames: [sa, admin, sqladmin]
    passwords: ["", sa, password, "Password1", admin]

  vnc:
    ports: [5900, 5901]
    usernames: []
    passwords: [password, vnc, admin, "", secret, "123456"]
    notes: VNC authenticates on password alone; there is no username.

  rdp:
    ports: [3389]
    usernames: [administrator, admin, user, guest]
    passwords: [password, "Password1", admin, ""]

  tomcat:
    ports: [8080, 8180, 8443]
    usernames: [tomcat, admin, manager, role1, both, ADMIN]
    passwords: [tomcat, admin, manager, s3cret, changethis, ""]
    notes: >
      tomcat:tomcat and admin:admin on /manager/html are the documented
      defaults and remain very common on unpatched hosts.

  mongodb:
    ports: [27017]
    usernames: [admin, mongo, root]
    passwords: ["", admin, mongo, password]

  redis:
    ports: [6379]
    usernames: []
    passwords: ["", redis, password, foobared]
    notes: Redis historically has no auth at all; a blank attempt confirms it.

  snmp:
    ports: [161]
    usernames: []
    passwords: [public, private, community, manager]
    notes: These are community strings rather than passwords.
