- title: WSTG-CRYP-01 Testing for Weak Transport Layer Security
  service: http
  tech: crypto
  doc_kind: wstg
  content: |-
    ## WSTG-CRYP-01 — Testing for Weak Transport Layer Security

    Category: 09-Testing_for_Weak_Cryptography  
    Source: OWASP WSTG (WSTG-CRYP-01) — CC BY-SA 4.0

    When information is sent between the client and the server, it must be encrypted and protected in order to prevent an attacker from being able to read or modify it. This is most commonly done using HTTPS, which uses the [Transport Layer Security (TLS)](https://en.wikipedia.org/wiki/Transport_Layer_Security) protocol, a replacement for the older Secure Socket Layer (SSL) protocol. TLS also provides a way for the server to demonstrate to the client that they have connected to the correct server, by presenting a trusted digital certificate.

    ### Test Objectives

    - Validate the service configuration.
    - Review the digital certificate's cryptographic strength and validity.
    - Ensure that the TLS security is not bypassable and is properly implemented across the application.

    ### How to Test

    Transport layer security related issues can be broadly split into the following areas:

    ### Server Configuration

    There are a large number of protocol versions, ciphers, and extensions supported by TLS. Many of these are considered to be legacy, and have cryptographic weaknesses, such as those listed below. New weaknesses are likely to be identified over time, so this list may be incomplete.

    - [SSLv2 (DROWN)](https://drownattack.com/)
    - [SSLv3 (POODLE)](https://en.wikipedia.org/wiki/POODLE)
    - [TLSv1.0 (BEAST)](https://www.acunetix.com/blog/web-security-zone/what-is-beast-attack/)
    - [TLSv1.1 (Deprecated by RFC 8996)](https://tools.ietf.org/html/rfc8996)
    - [EXPORT ciphers suites (FREAK)](https://en.wikipedia.org/wiki/FREAK)
    - NULL ciphers ([they only provide authentication](https://tools.ietf.org/html/rfc4785)).
    - Anonymous ciphers (these may be supported on SMTP servers, as discussed in [RFC 7672](https://tools.ietf.org/html/rfc7672#section-8.2))
    - [RC4 ciphers (NOMORE)](https://www.rc4nomore.com/)
    - CBC mode ciphers (BEAST, [Lucky 13](https://en.wikipedia.org/wiki/Lucky_Thirteen_attack))
    - [TLS compression (CRIME)](https://en.wikipedia.org/wiki/CRIME)
    - [Weak DHE Keys (LOGJAM)](https://weakdh.org/)

    The [TLSRef project](https://tlsref.org/) (formerly run by Mozilla) provides recommendations for the protocols and ciphers that should be used.

    Because of its compatibility with post-quantum ciphers, TLS 1.3 should be preferred over TLS 1.2.

    #### Exploitability

    It should be emphasised that while many of these attacks have been demonstrated in a lab environment, they are not generally considered practical to exploit in the real world, as they require a (usually active) MitM attack, and significant resources. As such, they are unlikely to be exploited by anyone other than nation states.

    ### Digital Certificates

    #### Cryptographic Weaknesses

    From a cryptographic perspective, there are two main areas that need to be reviewed on a digital certificate: The signature of the certificate itself and the key-exchange algorithm used during the TLS handshake. The following points should be considered when using classical cryptography:

    - The used cipher strength should be at least 128 bits of security or higher.
    - For classical signatures you should at least use RSA-3072 or ECDSA with P-256 in combination with SHA-256 or stronger.
    - For a classical key exchange use ECDHE with P-256 or X25519 elliptic curves at minimum.

    Additionally, both the signature and key exchange algorithm should support post-quantum cryptography. The following points should be considered:

    - For post-quantum signatures you should use at least ML-DSA-44 (according to [FIPS-204](https://csrc.nist.gov/pubs/fips/204/final)) or higher.
    - For post-quantum key exchanges you should use at least ML-KEM-512 (according to [FIPS-203](https://csrc.nist.gov/pubs/fips/203/final)) or higher.
    - You may use hybrid ciphers such as X25519+ML-KEM-768 during the transition to post-quantum algorithms.

    #### Validity

    As well as being cryptographically secure, the certificate must also be considered valid (or trusted). This means that it must:

    - Be within the defined validity period.
        - Any certificates issued after 1st September 2020 must not have a maximum lifespan of more than [398 days](https://blog.mozilla.org/security/2020/07/09/reducing-tls-certificate-lifespans-to-398-days/).
        - The validity period of certificates will gradually be reduced to a maximum lifespan of [47 days in March 2029](https://github.com/cabforum/servercert/blob/main/docs/BR.md#11-overview).
    - Be signed by a trusted certificate authority (CA).
        - This should either be a trusted public CA for externally facing applications, or an internal CA for internal applications.
        - Don't flag internal applications as having untrusted certificates just because *your* system doesn't trust the CA.
    - Have a Subject Alternate Name (SAN) that matches the hostname of the system.
        - The Common Name (CN) field is ignored by modern browsers, which only look at the SAN.
        - Make sure that you're accessing the system with the correct name (for example, if you access the host by IP then any certificate will be appear untrusted).

    Some certificates may be issued for wildcard domains (such as `*.example.org`), meaning that they can be valid for multiple subdomains. Although convenient, there are a number of security concerns around this that should be considered. These are discussed in the [OWASP Transport Layer Security Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html#carefully-consider-the-use-of-wildcard-certificates).

    Certificates can also leak information about internal systems or domain names in the Issuer and SAN fields, which can be useful when trying to build up a picture of the internal network or conduct social engineering activities.

    ### Implementation Vulnerabilities

    Over the years there have been vulnerabilities in the various TLS implementations. There are too many to list here, but some of the key examples are:

    - [Debian OpenSSL Predictable Random Number Generator](https://www.debian.org/security/2008/dsa-1571) (CVE-2008-0166)
    - [OpenSSL Insecure Renegotiation](https://www.openssl.org/news/secadv/20091111.txt) (CVE-2009-3555)
    - [OpenSSL Heartbleed](https://heartbleed.com) (CVE-2014-0160)
    - [F5 TLS POODLE](https://support.f5.com/csp/article/K15882) (CVE-2014-8730)
    - [Microsoft Schannel Denial of Service](https://docs.microsoft.com/en-us/security-updates/securitybulletins/2014/ms14-066) (MS14-066 / CVE-2014-6321)

    ### Application Vulnerabilities

    As well as the underlying TLS configuration being securely configured, the application also needs to use it in a secure way. Some of these points are addressed elsewhere in this guide:

    - [Not sending sensitive data over unencrypted channels (WSTG-CRYP-03)](03-Testing_for_Sensitive_Information_Sent_via_Unencrypted_Channels.md)
    - [Setting the HTTP Strict-Transport-Sec

    _(truncated — see the full WSTG test)_
- title: WSTG-CRYP-02 Testing for Padding Oracle
  service: http
  tech: crypto
  doc_kind: wstg
  content: |-
    ## WSTG-CRYP-02 — Testing for Padding Oracle

    Category: 09-Testing_for_Weak_Cryptography  
    Source: OWASP WSTG (WSTG-CRYP-02) — CC BY-SA 4.0

    A padding oracle is a function of an application which decrypts encrypted data provided by the client, e.g. internal session state stored on the client, and leaks the state of the validity of the padding after decryption. The existence of a padding oracle allows an attacker to decrypt encrypted data and encrypt arbitrary data without knowledge of the key used for these cryptographic operations. This can lead to leakage of sensitive data or to privilege escalation vulnerabilities, if integrity of the encrypted data is assumed by the application.

    ### Test Objectives

    - Identify encrypted messages that rely on padding.
    - Attempt to break the padding of the encrypted messages and analyze the returned error messages for further analysis.

    ### How to Test

    ### Black-Box Testing

    First the possible input points for padding oracles must be identified. Generally the following conditions must be met:

    1. The data is encrypted. Good candidates are values which appear to be random.
    2. A block cipher is used. The length of the decoded (Base64 is used often) cipher text is a multiple of common cipher block sizes like 8 or 16 bytes. Different cipher texts (e.g. gathered by different sessions or manipulation of session state) share a common divisor in the length.

    #### Example 2

    `Dg6W8OiWMIdVokIDH15T/A==` results after base64 decoding in `0e 0e 96 f0 e8 96 30 87 55 a2 42 03 1f 5e 53 fc`. This seems to be random and 16 byte long.

    If such an input value candidate is identified, the behavior of the application to bit-wise tampering of the encrypted value should be verified. Normally this base64 encoded value will include the initialization vector (IV) prepended to the cipher text. Given a plaintext *`p`* and a cipher with a block size *`n`*, the number of blocks will be *`b = ceil( length(p) / n)`*. The length of the encrypted string will be *`y=(b+1)*n`* due to the initialization vector. To verify the presence of the oracle, decode the string, flip the last bit of the second-to-last block *`b-1`* (the least significant bit of the byte at *`y-n-1`*), re-encode and send. Next, decode the original string, flip the last bit of the block *`b-2`* (the least significant bit of the byte at *`y-2*n-1`*), re-encode and send.

    If it is known that the encrypted string is a single block (the IV is stored on the server or the application is using a bad practice hardcoded IV), several bit flips must be performed in turn. An alternative approach could be to prepend a random block, and flip bits in order to make the last byte of the added block take all possible values (0 to 255).

    The tests and the base value should at least cause three different states while and after decryption:

    - Cipher text gets decrypted, resulting data is correct.
    - Cipher text gets decrypted, resulting data is garbled and causes some exception or error handling in the application logic.
    - Cipher text decryption fails due to padding errors.

    Compare the responses carefully. Search especially for exceptions and messages which state that something is wrong with the padding. If such messages appear, the application contains a padding oracle. If the three different states described above are observable implicitly (different error messages, timing side-channels), there is a high probability that there is a padding oracle present at this point. Try to perform the padding oracle attack to ensure this.

    ##### Example 3

    - ASP.NET throws `System.Security.Cryptography.CryptographicException: Padding is invalid and cannot be removed.` if padding of a decrypted cipher text is broken.
    - In Java a `javax.crypto.BadPaddingException` is thrown in this case.
    - Decryption errors or similar can be possible padding oracles.

    > A secure implementation will check for integrity and cause only two responses: `ok` and `failed`. There are no side channels which can be used to determine internal error states.

    ### Gray-Box Testing

    Verify that all places where encrypted data from the client, that should only be known by the server, is decrypted. The following conditions should be met by such code:

    1. The integrity of the cipher text should be verified by a secure mechanism, like HMAC or authenticated cipher operation modes like GCM or CCM.
    2. All error states while decryption and further processing are handled uniformly.

    ### Example 4

    [Visualization of the decryption process](https://erlend.oftedal.no/blog/poet/)
- title: WSTG-CRYP-03 Testing for Sensitive Information Sent via Unencrypted Channels
  service: http
  tech: crypto
  doc_kind: wstg
  content: |-
    ## WSTG-CRYP-03 — Testing for Sensitive Information Sent via Unencrypted Channels

    Category: 09-Testing_for_Weak_Cryptography  
    Source: OWASP WSTG (WSTG-CRYP-03) — CC BY-SA 4.0

    Sensitive data must be protected when it is transmitted through the network. If data is transmitted over HTTPS or encrypted in another way the protection mechanism must not have limitations or vulnerabilities, as explained in the broader article [Testing for Weak Transport Layer Security](01-Testing_for_Weak_Transport_Layer_Security.md) and in other OWASP documentation:

    ### Test Objectives

    - Identify sensitive information transmitted through the various channels.
    - Assess the privacy and security of the channels used.

    ### How to Test

    Various types of information that must be protected, could be transmitted by the application in clear text. To check if this information is transmitted over HTTP instead of HTTPS, capture traffic between a client and web application server that needs credentials. For any message containing sensitive data, verify the exchange occurred using HTTPS. See more information about insecure transmission of credentials [A04:2025 Cryptographic Failures](https://owasp.org/Top10/2025/A04_2025-Cryptographic_Failures/) or [Transport Layer Protection Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html).

    ### Example 1: Basic Authentication over HTTP

    A typical example is the usage of Basic Authentication over HTTP. When using Basic Authentication, user credentials are encoded rather than encrypted, and are sent as HTTP headers. In the example below the tester uses [curl](https://curl.se/) to test for this issue. Note how the application uses Basic authentication, and HTTP rather than HTTPS.

    ```bash
    $ curl -kis http://example.com/restricted/
    HTTP/1.1 401 Authorization Required
    Date: Fri, 01 Aug 2013 00:00:00 GMT
    WWW-Authenticate: Basic realm="Restricted Area"
    Accept-Ranges: bytes Vary:
    Accept-Encoding Content-Length: 162
    Content-Type: text/html

    <html><head><title>401 Authorization Required</title></head>
    <body bgcolor=white> <h1>401 Authorization Required</h1>  Invalid login credentials!  </body></html>
    ```

    ### Example 2: Form-Based Authentication Performed over HTTP

    Another typical example is authentication forms which transmit user authentication credentials over HTTP. In the example below one can see HTTP being used in the `action` attribute of the form. It is also possible to see this issue by examining the HTTP traffic with an intercepting proxy.

    ```html
    <form action="http://example.com/login">
        <label for="username">User:</label> <input type="text" id="username" name="username" value=""/><br />
        <label for="password">Password:</label> <input type="password" id="password" name="password" value=""/>
        <input type="submit" value="Login"/>
    </form>
    ```

    ### Example 3: Cookie Containing Session ID Sent over HTTP

    The Session ID Cookie must be transmitted over protected channels. If the cookie does not have the [Secure flag](../06-Session_Management_Testing/02-Testing_for_Cookies_Attributes.md) set, it is permitted for the application to transmit it unencrypted. Note below the setting of the cookie is done without the Secure flag, and the entire login process is performed in HTTP and not HTTPS.

    ```http
    https://secure.example.com/login

    POST /login HTTP/1.1
    Host: secure.example.com
    [...]
    Referer: https://secure.example.com/
    Content-Type: application/x-www-form-urlencoded
    Content-Length: 188

    HTTP/1.1 302 Found
    Server: Apache
    Set-Cookie: JSESSIONID=BD99F321233AF69593EDF52B123B5BDA; expires=Fri, 01-Jan-2014 00:00:00 GMT; path=/; domain=example.com; httponly
    [...]
    ```

    ```http
    http://example.com/private

    GET /private HTTP/1.1
    Host: example.com
    [...]
    Referer: https://secure.example.com/login
    Cookie: JSESSIONID=BD99F321233AF69593EDF52B123B5BDA;

    HTTP/1.1 200 OK
    [...]
    ```

    ### Example 4: Password Reset, Change Password or Other Account Manipulation over HTTP

    If the web application has features that allow a user to change an account or call a different service with credentials, verify all of those interactions use HTTPS. The interactions to test include forms that:

    - Allow users to handle a forgotten password or other credentials.
    - Allow users to edit credentials.
    - Require the user to authenticate with another provider (for example, payment processing).

    ### Example 5: Testing Password Sensitive Information in Source Code or Logs

    Use one of the following techniques to search for sensitive information.

    Checking if password or encryption key is hardcoded in the source code or configuration files.

    `grep -r –E "Pass | password | pwd |user | guest| admin | encry | key | decrypt | sharekey " ./PathToSearch/`

    Checking if logs or source code may contain phone number, email address, ID or any other PII. Change the regular expression based on the format of the PII.

    `grep -r " {2\}[0-9]\{6\} "  ./PathToSearch/`
- title: WSTG-CRYP-04 Testing for Weak Cryptographic Primitives
  service: http
  tech: crypto
  doc_kind: wstg
  content: |-
    ## WSTG-CRYP-04 — Testing for Weak Cryptographic Primitives

    Category: 09-Testing_for_Weak_Cryptography  
    Source: OWASP WSTG (WSTG-CRYP-04) — CC BY-SA 4.0

    Incorrect uses of encryption algorithms may result in sensitive data exposure, key leakage, broken authentication, insecure session, and spoofing attacks. There are some encryption or hash algorithms known to be weak and are not suggested for use such as MD5 and RC4.

    ### Test Objectives

    - Provide a guideline for the identification weak encryption or hashing uses and implementations.

    ### How to Test

    ### Basic Security Checklist

    - When using AES128 or AES256, the IV (Initialization Vector) must be random and unpredictable. Refer to [FIPS 140-2, Security Requirements for Cryptographic Modules](https://csrc.nist.gov/publications/detail/fips/140/2/final), section 4.9.1. random number generator tests. For example, in Java, `java.util.Random` is considered a weak random number generator. `java.security.SecureRandom` should be used instead of `java.util.Random`.
    - For asymmetric encryption, use Elliptic Curve Cryptography (ECC) with a secure curve like `Curve25519` preferred.
        - If ECC can't be used then use RSA encryption with a minimum 2048bit key.
    - When uses of RSA in signature, PSS padding is recommended.
    - Weak hash/encryption algorithms should not be used such MD5, RC4, DES, Blowfish, SHA1. 1024-bit RSA or DSA, 160-bit ECDSA (elliptic curves), 80/112-bit 2TDEA (two key triple DES)
    - Minimum Key length requirements:

    ```text
    Key exchange: Diffie–Hellman key exchange with minimum 2048 bits
    Message Integrity: HMAC-SHA2
    Message Hash: SHA2 256 bits
    Asymmetric encryption: RSA 2048 bits
    Symmetric-key algorithm: AES 128 bits
    Password Hashing: PBKDF2, Scrypt, Bcrypt
    ECDH, ECDSA: 256 bits
    ```

    - Uses of SSH, CBC mode should not be used.
    - When symmetric encryption algorithm is used, ECB (Electronic Code Book) mode should not be used.
    - When PBKDF2 is used to hash password, the parameter of iteration is recommended to be over 10000. [NIST](https://pages.nist.gov/800-63-3/sp800-63b.html#sec5) also suggests at least 10,000 iterations of the hash function. In addition, MD5 hash function is forbidden to be used with PBKDF2 such as PBKDF2WithHmacMD5.

    ### Source Code Review

    - Search for the following keywords to identify use of weak algorithms: `MD4, MD5, RC4, RC2, DES, Blowfish, SHA-1, ECB`

    - For Java implementations, the following API is related to encryption. Review the parameters of the encryption implementation. For example,

    ```java
    SecretKeyFactory(SecretKeyFactorySpi keyFacSpi, Provider provider, String algorithm)
    SecretKeySpec(byte[] key, int offset, int len, String algorithm)
    Cipher c = Cipher.getInstance("DES/CBC/PKCS5Padding");
    ```

    - For RSA encryption, the following padding modes are suggested.

    ```text
    RSA/ECB/OAEPWithSHA-1AndMGF1Padding (2048)
    RSA/ECB/OAEPWithSHA-256AndMGF1Padding (2048)
    ```

    - Search for `ECB`, it's not allowed to be used in padding.
    - Review if different IV (initial Vector) is used.

    ```java
    // Use a different IV value for every encryption
    byte[] newIv = ...;
    s = new GCMParameterSpec(s.getTLen(), newIv);
    cipher.init(..., s);
    ...
    ```

    - Search for `IvParameterSpec`, check if the IV value is generated differently and randomly.

    ```java
     IvParameterSpec iv = new IvParameterSpec(randBytes);
     SecretKeySpec skey = new SecretKeySpec(key.getBytes(), "AES");
     Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
     cipher.init(Cipher.ENCRYPT_MODE, skey, iv);
    ```

    - In Java, search for MessageDigest to check if weak hash algorithm (MD5 or CRC) is used. For example:

    `MessageDigest md5 = MessageDigest.getInstance("MD5");`

    - For signature, SHA1 and MD5 should not be used. For example:

    `Signature sig = Signature.getInstance("SHA1withRSA");`

    - Search for `PBKDF2`. To generate the hash value of password, `PBKDF2` is suggested to be used. Review the parameters to generate the `PBKDF2` has value.

    The iterations should be over **10000**, and the **salt** value should be generated as **random value**.

    ```java
    private static byte[] pbkdf2(char[] password, byte[] salt, int iterations, int bytes)
        throws NoSuchAlgorithmException, InvalidKeySpecException
      {
           PBEKeySpec spec = new PBEKeySpec(password, salt, iterations, bytes * 8);
           SecretKeyFactory skf = SecretKeyFactory.getInstance(PBKDF2_ALGORITHM);
           return skf.generateSecret(spec).getEncoded();
       }
    ```

    - Hard-coded sensitive information:

    ```text
    User related keywords: name, root, su, sudo, admin, superuser, login, username, uid
    Key related keywords: public key, AK, SK, secret key, private key, passwd, password, pwd, share key, shared key, cryto, base64
    Other common sensitive keywords: sysadmin, root, privilege, pass, key, code, master, admin, uname, session, token, Oauth, privatekey, shared secret
    ```
- title: WSTG-BUSL-01 Test Business Logic Data Validation
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-01 — Test Business Logic Data Validation

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-01) — CC BY-SA 4.0

    The application must ensure that only logically valid data can be entered at the frontend as well as directly to the server-side of an application or system. Only verifying data on the client/frontend may leave applications vulnerable to server injections through proxies or at handoffs with other systems. This is different from simply performing Boundary Value Analysis (BVA) in that it is more difficult and in most cases cannot be simply verified at the entry point, but usually requires checking some other system.

    ### Test Objectives

    - Identify data injection points.
    - Validate that all checks are occurring on the backend and can't be bypassed.
    - Attempt to break the format of the expected data and analyze how the application is handling it.

    ### How to Test

    ### Generic Test Method

    - Review the project documentation and use exploratory testing looking for data entry points or hand off points between systems or software.
    - Once found try to insert logically invalid data into the application/system.

    Specific Testing Method:

    - Perform frontend GUI Functional Valid testing on the application to ensure that the only "valid" values are accepted.
    - Using an intercepting proxy observe the HTTP POST/GET looking for places that variables such as cost and quantity are passed. Specifically, look for "hand-offs" between application/systems that may be possible injection or tamper points.
    - Once variables are found start interrogating the field with logically "invalid" data, such as social security numbers or unique identifiers that do not exist or that do not fit the business logic. This testing verifies that the server functions properly and does not accept logically invalid data.
- title: WSTG-BUSL-02 Test Ability to Forge Requests
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-02 — Test Ability to Forge Requests

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-02) — CC BY-SA 4.0

    Forging requests is a method that attackers use to circumvent the frontend GUI application to directly submit information for backend processing. The goal of the attacker is to send HTTP POST/GET requests through an intercepting proxy with data values that are not supported, guarded against, or expected by the application's business logic. Some examples of forged requests include exploiting guessable or predictable parameters or exposing "hidden" features and functionality such as enabling debugging or presenting special screens or windows that are very useful during development but may leak information or bypass the business logic.

    ### Test Objectives

    - Review the project documentation looking for guessable, predictable, or hidden functionality of fields.
    - Insert logically valid data in order to bypass normal business logic workflow.

    ### How to Test

    ### Through Identifying Guessable Values

    - Using an intercepting proxy observe the HTTP POST/GET looking for some indication that values are incrementing at a regular interval or are easily guessable.
    - If it is found that some value is guessable this value may be changed and one may gain unexpected visibility.

    ### Through Identifying Hidden Options

    - Using an intercepting proxy observe the HTTP POST/GET looking for some indication of hidden features such as debug that can be switched on or activated.
    - If any are found try to guess and change these values to get a different application response or behavior.
- title: WSTG-BUSL-03 Test Integrity Checks
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-03 — Test Integrity Checks

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-03) — CC BY-SA 4.0

    Many applications are designed to display different fields depending on the user or situation by leaving some inputs hidden. However, in many cases it is possible to submit hidden field values to the server using a proxy. In these cases the server-side controls must be smart enough to perform relational or server-side edits to ensure that the proper data is allowed to the server based on user and application specific business logic.

    ### Test Objectives

    - Review the project documentation for components of the system that move, store, or handle data.
    - Determine what type of data is logically acceptable by the component and what types the system should guard against.
    - Determine who should be allowed to modify or read that data in each component.
    - Attempt to insert, update, or delete data values used by each component that should not be allowed per the business logic workflow.

    ### How to Test

    ### Specific Testing Method 1

    - Using a proxy capture HTTP traffic looking for hidden fields.
    - If a hidden field is found, see how these fields compare with the GUI application and start interrogating this value through the proxy by submitting different data values trying to circumvent the business process and manipulate values you were not intended to have access to.

    ### Specific Testing Method 2

    - Using a proxy capture HTTP traffic looking for a place to insert information into areas of the application that are non-editable.
    - If it is found, see how these fields compare with the GUI application and start interrogating this value through the proxy by submitting different data values trying to circumvent the business process and manipulate values you were not intended to have access to.

    ### Specific Testing Method 3

    - List components of the application or system that could be impacted, for example logs or databases.
    - For each component identified, try to read, edit or remove its information. For example log files should be identified and Testers should try to manipulate the data/information being collected.
- title: WSTG-BUSL-04 Test for Process Timing
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-04 — Test for Process Timing

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-04) — CC BY-SA 4.0

    It is possible that attackers can gather information on an application by monitoring the time it takes to complete a task or give a response. Additionally, attackers may be able to manipulate and break designed business process flows by simply keeping active sessions open and not submitting their transactions in the "expected" time frame.

    ### Test Objectives

    - Review the project documentation for system functionality that may be impacted by time.
    - Develop and execute misuse cases.

    ### How to Test

    The tester should identify which processes are dependent on time, whether it was a window for a task to be completed, or if it was execution time between two processes that could allow the bypass of certain controls.

    Following that, it is best to automate the requests that will abuse the above discovered processes, as tools are better fit to analyze the timing and are more precise than manual testing. If this is not possible, manual testing could still be used.

    The tester should draw a diagram of how the process flows, the injection points, and prepare the requests before hand to launch them at the vulnerable processes. Once done, close analysis should be done to identify differences in the process execution, and if the process is misbehaving against the agreed upon business logic.
- title: WSTG-BUSL-05 Test Number of Times a Function Can Be Used Limits
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-05 — Test Number of Times a Function Can Be Used Limits

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-05) — CC BY-SA 4.0

    Many of the problems that applications are solving require limits to the number of times a function can be used or action can be executed. Applications must be "smart enough" to not allow the user to exceed their limit on the use of these functions since in many cases each time the function is used the user may gain some type of benefit that must be accounted for to properly compensate the owner. For example: an eCommerce site may only allow a users apply a discount once per transaction, or some applications may be on a subscription plan and only allow users to download three complete documents monthly.

    ### Test Objectives

    - Identify functions that must set limits to the times they can be called.
    - Assess if there is a logical limit set on the functions and if it is properly validated.

    ### How to Test

    - Review the project documentation and use exploratory testing looking for functions or features in the application or system that should not be executed more that a single time or specified number of times during the business logic workflow.
    - For each of the functions and features found that should only be executed a single time or specified number of times during the business logic workflow, develop abuse/misuse cases that may allow a user to execute more than the allowable number of times. For example, can a user navigate back and forth through the pages multiple times executing a function that should only execute once? or can a user load and unload shopping carts allowing for additional discounts.
- title: WSTG-BUSL-06 Testing for the Circumvention of Work Flows
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-06 — Testing for the Circumvention of Work Flows

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-06) — CC BY-SA 4.0

    Workflow vulnerabilities involve any type of vulnerability that allows the attacker to misuse an application/system in a way that will allow them to circumvent (not follow) the designed/intended workflow.

    ### Test Objectives

    - Review the project documentation for methods to skip or go through steps in the application process in a different order from the intended business logic flow.
    - Develop a misuse case and try to circumvent every logic flow identified.

    ### How to Test

    ### Testing Method 1

    - Start a transaction going through the application past the points that triggers credits/points to the users account.
    - Cancel out of the transaction or reduce the final tender so that the point values should be decreased and check the points/credit system to ensure that the proper points/credits were recorded.

    ### Testing Method 2

    - On a content management or bulletin board system enter and save valid initial text or values.
    - Then try to append, edit and remove data that would leave the existing data in an invalid state or with invalid values to ensure that the user is not allowed to save the incorrect information. Some "invalid" data or information may be specific words (profanity) or specific topics (such as political issues).

    ### Testing Method 3: Multi-Step Workflow and State Transition Abuse

    Modern applications often implement workflows that span multiple requests, APIs, or backend services.
    In such cases, workflow state may be inferred from client-controlled parameters or distributed system state rather than being strictly enforced server-side.

    Attackers may attempt to abuse these workflows by skipping required steps, reordering requests, or manipulating state transitions to reach unauthorized or unintended application states.

    Common workflow and state transition abuse patterns include:

    - Skipping required workflow steps by directly invoking later-stage functionality
    - Reordering requests to bypass enforced sequence controls
    - Replaying or reusing state identifiers across workflow steps
    - Manipulating status, phase, or step parameters supplied by the client
    - Executing dependent actions in parallel to bypass sequence validation

    Test Steps:

    - Identify multi-step workflows and the functionality involved at each stage.
    - Capture requests associated with each workflow step and note any state or status parameters.
    - Attempt to invoke later-stage functionality without completing prerequisite steps.
    - Replay or reorder requests to determine whether sequence enforcement exists.
    - Modify state or status parameters to invalid, future, or unauthorized values.
    - Verify whether the application enforces workflow state validation server-side.

    Examples include:

    - Triggering order shipment or fulfillment actions without a confirmed payment step.
    - Accessing restricted or premium features by directly invoking activation or enablement endpoints.
- title: WSTG-BUSL-07 Test Defenses Against Application Misuse
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-07 — Test Defenses Against Application Misuse

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-07) — CC BY-SA 4.0

    The misuse and invalid use of valid functionality can identify attacks attempting to enumerate the web application, identify weaknesses, and exploit vulnerabilities. Tests should be undertaken to determine whether there are application-layer defensive mechanisms in place to protect the application.

    ### Test Objectives

    - Generate notes from all tests conducted against the system.
    - Review which tests had a different functionality based on aggressive input.
    - Understand the defenses in place and verify if they are enough to protect the system against bypassing techniques.

    ### How to Test

    This test is unusual in that the result can be drawn from all the other tests performed against the web application. While performing all the other tests, take note of measures that might indicate the application has in-built self-defense:

    - Changed responses
    - Blocked requests
    - Actions that log a user out or lock their account

    These may only be localized. Common localized (per function) defenses are:

    - Rejecting input containing certain characters
    - Locking out an account temporarily after a number of authentication failures

    Localized security controls are not sufficient. There are often no defenses against general mis-use such as:

    - Forced browsing
    - Bypassing presentation layer input validation
    - Multiple access control errors
    - Additional, duplicated or missing parameter names
    - Multiple input validation or business logic verification failures with values that cannot be the result of user mistakes or typos
    - Structured data (e.g. JSON, XML) of an invalid format is received
    - Blatant cross-site scripting or SQL injection payloads are received
    - Utilizing the application faster than would be possible without automation tools
    - Change in continental geo-location of a user
    - Change of user agent
    - Accessing a multi-stage business process in the wrong order
    - Large number of, or high rate of use of, application-specific functionality (e.g. voucher code submission, failed credit card payments, file uploads, file downloads, log outs, etc).

    ### UI Misrepresentation / Content Spoofing

    UI misrepresentation occurs when user-controlled input is rendered in trusted UI elements in a way that can mislead users or administrators, without requiring script execution. Unlike cross-site scripting, these issues rely on visual or contextual deception and can enable workflow abuse or social engineering within the application.

    These issues represent application misuse because they abuse legitimate UI workflows and trust boundaries rather than exploiting a technical vulnerability.

    Common examples include:

    - User-controlled filenames, titles, or labels displayed as system-generated messages
    - Renamed file uploads that appear as trusted documents or system artifacts
    - User-supplied text rendered as approval states, sender names, or workflow indicators

    For example: an application allows users to name uploaded files. An attacker uploads a file named
    "Payment Approved – Finance System". When this filename is displayed in an administrative
    review workflow without clear indication that it is user-supplied, reviewers may be misled
    into approving a fraudulent process.

    During testing, assess whether:

    - User-controlled data is reflected in privileged or authoritative UI contexts
    - Injected text can mimic system messages, workflow states, or trusted labels
    - UI presentation could influence user decisions or business processes despite no technical exploit occurring

    These defenses work best in authenticated parts of the application, although rate of creation of new accounts or accessing content (e.g. to scrape information) can be of use in public areas.

    Not all the above need to be monitored by the application, but there is a problem if none of them are. By testing the web application, doing the above type of actions, was any response taken against the tester? If not, the tester should report that the application appears to have no application-wide active defenses against misuse. Note it is sometimes possible that all responses to attack detection are silent to the user (e.g. logging changes, increased monitoring, alerts to administrators and request proxying), so confidence in this finding cannot be guaranteed. In practice, very few applications (or related infrastructure such as a web application firewall) are detecting these types of misuse.
- title: WSTG-BUSL-08 Test Upload of Unexpected File Types
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-08 — Test Upload of Unexpected File Types

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-08) — CC BY-SA 4.0

    Many applications' business processes allow for the upload and manipulation of data that is submitted via files. But the business process must check the files and only allow certain "approved" file types. Deciding what files are "approved" is determined by the business logic and is application/system specific. The risk is that by allowing users to upload files, attackers may submit an unexpected file type that could be executed and adversely impact the application or system through attacks that may deface the site, perform remote commands, browse the system files, browse the local resources, attack other servers, or exploit the local vulnerabilities, just to name a few.

    ### Test Objectives

    - Review the project documentation for file types that are rejected by the system.
    - Verify that the unwelcomed file types are rejected and handled safely.
    - Verify that file batch uploads are secure and do not allow any bypass against the set security measures.

    ### How to Test

    ### Specific Testing Method

    - Study the applications logical requirements.
    - Prepare a library of files that are "not approved" for upload that may contain files such as: jsp, exe, or HTML files containing script.
    - In the application navigate to the file submission or upload mechanism.
    - Submit the "not approved" file for upload and verify that they are properly prevented from uploading
    - Check if the site only does file type checks in client-side JavaScript
    - Check if the site only checks the file type by "Content-Type" in HTTP request.
    - Check if the site only checks the file type by the file extension.
    - Check if other uploaded files can be accessed directly by specified URL.
    - Check if the uploaded file can include code or script injection.
    - Check if there is any file path checking for uploaded files. Especially, hackers may compress files with specified path in ZIP so that the extracted files can be uploaded to intended path after uploading and unzipping.
- title: WSTG-BUSL-09 Test Upload of Malicious Files
  service: http
  tech: buslogic
  doc_kind: wstg
  content: |-
    ## WSTG-BUSL-09 — Test Upload of Malicious Files

    Category: 10-Business_Logic_Testing  
    Source: OWASP WSTG (WSTG-BUSL-09) — CC BY-SA 4.0

    Many application’s business processes allow users to upload data to them. Although input validation is widely understood for text-based input fields, it is more complicated to implement when files are accepted. Although many sites implement simple restrictions based on a list of permitted (or blocked) extensions, this is not sufficient to prevent attackers from uploading legitimate file types that have malicious contents.

    ### Test Objectives

    - Identify the file upload functionality.
    - Review the project documentation to identify what file types are considered acceptable, and what types would be considered dangerous or malicious.
        - If documentation is not available then consider what would be appropriate based on the purpose of the application.
    - Determine how the uploaded files are processed.
    - Obtain or create a set of malicious files for testing.
    - Try to upload the malicious files to the application and determine whether it is accepted and processed.

    ### How to Test

    ### Malicious File Types

    The simplest checks that an application can do are to determine that only trusted types of files can be uploaded.

    #### Web Shells

    If the server is configured to execute code, then it may be possible to obtain command execution on the server by uploading a file known as a web shell, which allows you to execute arbitrary code or operating system commands. In order for this attack to be successful, the file needs to be uploaded inside the webroot, and the server must be configured to execute the code.

    Uploading this kind of shell onto an internet facing server is dangerous, because it allows anyone who knows (or guesses) the location of the shell to execute code on the server. A number of techniques can be used to protect the shell from unauthorised access, such as:

    - Uploading the shell with a randomly generated name.
    - Password protecting the shell.
    - Implementing IP based restrictions on the shell.

    **Remember to remove the shell when you are done.**

    The example below shows a simple PHP based shell, that executes operating system commands passed to it in a GET parameter, and can only be accessed from a specific IP address:

    ```php
    <?php
        if ($_SERVER['REMOTE_HOST'] === "FIXME") { // Set your IP address here
            if(isset($_REQUEST['cmd'])){
                $cmd = ($_REQUEST['cmd']);
                echo "<pre>\n";
                system($cmd);
                echo "</pre>";
            }
        }
    ?>
    ```

    Once the shell is uploaded (with a random name), you can execute operating system commands by passing them in the `cmd` GET parameter:

    `https://example.org/7sna8uuorvcx3x4fx.php?cmd=cat+/etc/passwd`

    #### Filter Evasion

    The first step is to determine what the filters are allowing or blocking, and where they are implemented. If the restrictions are performed on the client-side using JavaScript, then they can be trivially bypassed with an intercepting proxy.

    If the filtering is performed on the server-side, then various techniques can be attempted to bypass it, including:

    - Change the value of `Content-Type` as `image/jpeg` in HTTP request.
    - Change the extensions to a less common extension, such as `file.php5`, `file.shtml`, `file.asa`, `file.jsp`, `file.jspx`, `file.aspx`, `file.asp`, `file.phtml`, `file.cshtml`
    - Use double extensions such as `file.jpg.php` or `file.png.php`. For this to work properly, you must first understand how the web server handles files with multiple extensions. For instance, in certain scenario, the web server may only check if `.jpg` or `.png` is part of the file's extension which may allow attackers to bypass file extension filter.
    - Change the [file signature](https://en.wikipedia.org/wiki/List_of_file_signatures) or magic byte of the uploaded file.
    - Change the capitalisation of the extension, such as `file.PhP` or `file.AspX`
    - If the request includes multiple filenames, change them to different values.
    - Using special trailing characters such as spaces, dots or null characters such as `file.asp...`, `file.php;jpg`, `file.asp%00.jpg`, `1.jpg%00.php`
    - In badly configured versions of Nginx, uploading a file as `test.jpg/x.php` may allow it to be executed as `x.php`.
    - Upload an `.htaccess` file with the following content: `AddType application/x-httpd-php .png`. This will cause the Apache server to execute `.png` images as if they were `.php` resources.

    In some situations, you may need to combine the different filter evasion techniques discussed above in order to successfully bypass server-side filters.**

    ### Malicious File Contents

    Once the file type has been validated, it is important to also ensure that the contents of the file are safe. This is significantly harder to do, as the steps required will vary depending on the types of file that are permitted.

    #### Malware

    Applications should generally scan uploaded files with anti-malware software to ensure that they do not contain anything malicious. The easiest way to test for this is using the [EICAR test file](https://www.eicar.org/download-anti-malware-testfile/), which is an safe file that is flagged as malicious by all anti-malware software.

    Depending on the type of application, it may be necessary to test for other dangerous file types, such as Office documents containing malicious macros. Tools such as the [Metasploit Framework](https://github.com/rapid7/metasploit-framework) and the [Social Engineer Toolkit (SET)](https://github.com/trustedsec/social-engineer-toolkit) can be used to generate malicious files for various formats.

    When this file is uploaded, it should be detected and quarantined or deleted by the application. Depending on how the application processes the file, it may not be obvious whether this has taken place.

    #### Archive Directory Traversal

    If the application extracts archives (such as ZIP files), then it may be possible to write to unintended locations using directory traversal. This can be exploited by uploading a malicious ZIP file that contains paths that traverse the file system using sequences such as `..\..\..\..\shell.php`. This technique is discussed further in the [snyk advisory](https://snyk.io/research/zip-slip-vulnerability).

    A test against Archive Directory Traversal should include two parts:

    1. A malicious archive that breaks out of the target directory when extracted. This malicious archive should contain two files: a `base` file, extracted into the target directory, and a `traversed` file that attempts to navigate up the directory tree to hit the root folder - adding a file into the `tmp` directory. A malicious path will contain many levels of `../` (*i.e.* `../../../../../../../../tmp/traversed`) to stand a better chance of reaching the root directory. Once the attack is successful, the tester can find `/tmp/traversed` to be created on the webserver through the ZIP slip attack.
    2. Logic that extracts compressed files either using custom code or a library. Archive Directory Traversal vulnerabilities exist when the extraction functionality

