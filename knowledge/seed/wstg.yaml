- title: WSTG-CONF-09 Test File Permission
  service: http
  tech: config
  doc_kind: wstg
  content: |-
    ## WSTG-CONF-09 — Test File Permission

    Category: 02-Configuration_and_Deployment_Management_Testing  
    Source: OWASP WSTG (WSTG-CONF-09) — CC BY-SA 4.0

    When a resource is given a permissions setting that provides access to a wider range of actors than required, it could lead to the exposure of sensitive information, or the modification of that resource by unintended parties. This is especially dangerous when the resource is related to program configuration, execution, or sensitive user data.

    ### Test Objectives

    - Review and identify any rogue file permissions.

    ### How to Test

    In Linux, use `ls` command to check the file permissions. Alternatively, `namei` can also be used to recursively list file permissions.

    `$ namei -l /PathToCheck/`

    The files and directories that require file permission testing can include, but are not limited to, the following:

    - Web files/directory
    - Configuration files/directory
    - Sensitive files(encrypted data, password, key)/directory
    - Log files(security logs, operation logs, admin logs)/directory
    - Executables(scripts, EXE, JAR, class, PHP, ASP)/directory
    - Database files/directory
    - Temp files/directory
    - Upload files/directory
- title: WSTG-CONF-10 Test for Subdomain Takeover
  service: http
  tech: config
  doc_kind: wstg
  content: |-
    ## WSTG-CONF-10 — Test for Subdomain Takeover

    Category: 02-Configuration_and_Deployment_Management_Testing  
    Source: OWASP WSTG (WSTG-CONF-10) — CC BY-SA 4.0

    A successful exploitation of this kind of vulnerability allows an adversary to claim and take control of the victim's subdomain. This attack relies on the following:

    ### Test Objectives

    - Enumerate all possible domains (previous and current).
    - Identify any forgotten or misconfigured domains.

    ### How to Test

    ### Black-Box Testing

    Testing for subdomain takeover follows three phases: subdomain enumeration, automated fingerprint-based detection, and manual validation.

    A dangling DNS record occurs when a DNS entry points to an external resource that no longer exists or has been deprovisioned. For example, a CNAME record pointing to a GitHub Pages site that the owner deleted still resolves, but the underlying resource is unclaimed. An attacker can register that resource and take control of the subdomain.

    #### Subdomain Enumeration

    Use [subfinder](https://github.com/projectdiscovery/subfinder) to discover subdomains for the target domain: `subfinder -d victim.com -o subdomains.txt`

    This produces a list of subdomains to use in the detection phase.

    #### Fingerprint-Based Detection

    Fingerprint-based detection works by comparing each subdomain's HTTP response against a database of known vulnerable service responses. The [can-i-take-over-xyz](https://github.com/EdOverflow/can-i-take-over-xyz) project maintains this database, cataloging the specific response strings returned by service providers such as GitHub Pages, AWS S3, Heroku, and Fastly when a resource is unclaimed.

    Use [subzy](https://github.com/LukaSikic/subzy) for a quick initial scan: `subzy run --targets subdomains.txt`

    Follow up with [nuclei](https://github.com/projectdiscovery/nuclei) using the dedicated takeover templates for a more accurate result: `nuclei -l subdomains.txt -t takeovers/`

    A positive result from either tool indicates that a subdomain's response matched a known vulnerable fingerprint, suggesting a dangling DNS record pointing to an unclaimed resource on a third-party service.

    For example, a subdomain pointing to an unclaimed GitHub Pages site returns the following response:

    ```http
    HTTP/1.1 404 Not Found
    ...
    <p>There isn't a GitHub Pages site here.</p>
    ```

    This specific string is listed in can-i-take-over-xyz as the GitHub Pages fingerprint. When subzy or nuclei matches this response, it flags the subdomain as potentially vulnerable.

    #### Manual Validation

    Automated tools produce false positives. Validate each finding manually before reporting it.

    1. Confirm the DNS record and where it points: `dig CNAME subdomain.victim.com`

    1. Confirm the response matches the expected fingerprint for that service provider as listed in [can-i-take-over-xyz](https://github.com/EdOverflow/can-i-take-over-xyz): `curl -i http://subdomain.victim.com`

    1. Confirm the resource is unclaimed on the service provider's platform. Do not claim it.

    #### Cloud-Specific Takeovers

    Major cloud providers have distinct takeover patterns worth specific attention:

    - AWS S3: A CNAME pointing to an S3 bucket URL (for example, `bucket.s3.amazonaws.com`) where the bucket no longer exists returns a `NoSuchBucket` response. Anyone who creates a bucket with the same name in any AWS account can claim the subdomain.
    - Azure: Dangling CNAMEs pointing to deprovisioned Azure resources such as App Services or Traffic Manager endpoints can be claimed by registering the same resource name in a different Azure subscription.
    - GCP: Similar patterns exist for Cloud Storage buckets and Firebase Hosting endpoints.

    ### Gray-Box Testing

    The tester has the DNS zone file available, which means DNS enumeration is not necessary. The testing methodology is the same.
- title: WSTG-CONF-11 Test Cloud Storage
  service: http
  tech: config
  doc_kind: wstg
  content: |-
    ## WSTG-CONF-11 — Test Cloud Storage

    Category: 02-Configuration_and_Deployment_Management_Testing  
    Source: OWASP WSTG (WSTG-CONF-11) — CC BY-SA 4.0

    Cloud storage services allow web applications and services to store and access objects in the storage service. Improper access control configuration, however, may lead to the exposure of sensitive information, data tampering, or unauthorized access.

    ### Test Objectives

    - Assess that the access control configuration for the storage services is properly in place.

    ### How to Test

    First, identify the URL to access the data in the storage service, and then consider the following tests:

    - Read unauthorized data
    - Upload a new arbitrary file

    You may use curl for the tests with the following commands and see if unauthorized actions can be performed successfully.

    To test the ability to read an object:

    ```bash
    curl -X GET https://<cloud-storage-service>/<object>
    ```

    To test the ability to upload a file:

    ```bash
    curl -X PUT -d 'test' 'https://<cloud-storage-service>/test.txt'
    ```

    In the above command, it is recommended to replace the single quotes (') with double quotes (") when running the command on a Windows machine.

    ### Testing for Amazon S3 Bucket Misconfiguration

    The Amazon S3 bucket URLs follow one of two formats, either virtual host style or path-style.

    - Virtual Hosted Style Access

    ```text
    https://bucket-name.s3.Region.amazonaws.com/key-name
    ```

    In the following example, `my-bucket` is the bucket name, `us-west-2` is the region, and `puppy.png` is the key-name:

    ```text
    https://my-bucket.s3.us-west-2.amazonaws.com/puppy.png
    ```

    - Path-Style Access

    ```text
    https://s3.Region.amazonaws.com/bucket-name/key-name
    ```

    As above, in the following example, `my-bucket` is the bucket name, `us-west-2` is the region, and `puppy.png` is the key-name:

    ```text
    https://s3.us-west-2.amazonaws.com/my-bucket/puppy.png
    ```

    For some regions, the legacy global endpoint that does not specify a region-specific endpoint can be used. Its format is also either virtual hosted style or path-style.

    - Virtual Hosted Style Access

    ```text
    https://bucket-name.s3.amazonaws.com
    ```

    - Path-Style Access

    ```text
    https://s3.amazonaws.com/bucket-name
    ```

    #### Identify Bucket URL

    For black-box testing, S3 URLs can be found in the HTTP messages. The following example shows a bucket URL is sent in the `img` tag in an HTTP response.

    ```html
    ...
    <img src="https://my-bucket.s3.us-west-2.amazonaws.com/puppy.png">
    ...
    ```

    For gray-box testing, you can obtain bucket URLs from Amazon's web interface, documents, source code, and any other available sources.

    #### Testing with AWS-CLI

    In addition to testing with curl, you can also test with the AWS command-line tool. In this case `s3://` URI scheme is used.

    ##### List

    The following command lists all the objects of the bucket when it is configured public:

    ```bash
    aws s3 ls s3://<bucket-name>
    ```

    ##### Upload

    The following is the command to upload a file:

    ```bash
    aws s3 cp arbitrary-file s3://bucket-name/path-to-save
    ```

    This example shows the result when the upload has been successful.

    ```bash
    $ aws s3 cp test.txt s3://bucket-name/test.txt
    upload: ./test.txt to s3://bucket-name/test.txt
    ```

    This example shows the result when the upload has failed.

    ```bash
    $ aws s3 cp test.txt s3://bucket-name/test.txt
    upload failed: ./test2.txt to s3://bucket-name/test2.txt An error occurred (AccessDenied) when calling the PutObject operation: Access Denied
    ```

    ##### Remove

    The following is the command to remove an object:

    ```bash
    aws s3 rm s3://bucket-name/object-to-remove
    ```
- title: WSTG-CONF-12 Testing for Content Security Policy
  service: http
  tech: config
  doc_kind: wstg
  content: |-
    ## WSTG-CONF-12 — Testing for Content Security Policy

    Category: 02-Configuration_and_Deployment_Management_Testing  
    Source: OWASP WSTG (WSTG-CONF-12) — CC BY-SA 4.0

    Content Security Policy (CSP) is a declarative allow-list policy enforced through `Content-Security-Policy` response header or equivalent `<meta>` element. It allows developers to restrict the sources from which resources such as JavaScript, CSS, images, files etc. are loaded. CSP is an effective defense in depth technique to mitigate the risk of vulnerabilities such as Cross Site Scripting (XSS) and Clickjacking.

    ### Test Objectives

    - Review the Content-Security-Policy header or meta element to identify misconfigurations.

    ### How to Test

    Testing for Content Security Policy (CSP) weaknesses requires more than verifying the presence of the header. The tester should evaluate whether the policy meaningfully reduces the attack surface and is properly enforced.

    ### Identify and Confirm CSP Enforcement

    - Inspect HTTP responses for the presence of the `Content-Security-Policy` header.
    - Check for `Content-Security-Policy-Report-Only`. If only Report-Only is present, the policy is not enforced.
    - Verify whether CSP is delivered via HTTP header or `<meta>` tag (HTTP headers are preferred).
    - Consider that CSP delivered via `<meta>` tags does not support certain directives such as `frame-ancestors`, `report-uri`, `report-to`, or `sandbox`.
    - Confirm that the policy is consistently applied across sensitive endpoints.

    ### Review High-Risk Directives

    Inspect the policy for insecure or overly permissive directives:

    - `unsafe-inline` allows inline scripts or styles and significantly weakens XSS protections.
    - `unsafe-eval` permits dynamic code evaluation (`eval()`), increasing bypass risk.
    - `unsafe-hashes` may allow inline execution if hashes are predictable or improperly scoped.
    - Wildcard (`*`) sources may allow loading resources from any origin.
        - Partial wildcards such as `https://*` or `*.cdn.com` should be carefully evaluated.
        - Determine whether allowlisted domains host JSONP endpoints or user-controlled content.
    - Absence or misuse of `frame-ancestors` may expose the application to clickjacking.
    - Missing `object-src`, `base-uri`, or restrictive `default-src` directives may weaken policy effectiveness.
    - Review usage of `require-trusted-types-for` and `trusted-types`. In high-risk applications, absence of Trusted Types may leave DOM-based injection sinks exposed. If `trusted-types` policies are defined, ensure they are not overly permissive.
    - Check for duplicate directives or conflicting policy definitions that may result in unintended enforcement behavior.

    ### Validate Nonce and strict-dynamic Usage

    If the policy uses nonces:

    - Confirm that nonces are cryptographically random.
    - Verify that nonces are regenerated per response and not reused.
    - Ensure that legacy inline script patterns are not inadvertently trusted.

    If `strict-dynamic` is used:

    - Understand that trust propagates from nonce- or hash-based scripts.
    - Confirm that no unsafe trust chain allows attacker-controlled script loading.

    ### Evaluate CSP Reporting Mechanisms

    If `report-uri` or `report-to` is configured:

    - Verify that reporting endpoints are reachable and functional.
    - Determine whether sensitive information is exposed in reports.
    - Confirm that reporting does not create new injection or denial-of-service vectors.

    ### Attempt Controlled Bypass Techniques

    Where appropriate and authorized, attempt to validate enforcement by testing controlled payloads:

    - Inline script injection attempts.
    - Data URL–based payloads.
    - JSONP callback manipulation from allowlisted domains.
    - DOM-based gadget chaining using trusted script sources.

    Successful execution of injected JavaScript indicates CSP misconfiguration or ineffective enforcement.

    ### Assess Policy Strength

    Business-critical applications should aim to implement a strict policy. A robust CSP typically:

    - Avoids `unsafe-inline` and `unsafe-eval`.
    - Uses nonce- or hash-based script controls.
    - Restricts object embedding (`object-src 'none'`).
    - Restricts base tag manipulation (`base-uri 'none'`).
    - Restricts framing using `frame-ancestors`.

    ### Common CSP Bypass Patterns

    Even when CSP is present, misconfigurations or design weaknesses may allow bypass. Testers should consider the following common patterns:

    #### JSONP and Trusted Third-Party Endpoints

    If a CSP allowlists third-party domains (e.g., CDNs), determine whether those domains expose JSONP endpoints or user-controlled content. Attackers may leverage callback injection to execute arbitrary JavaScript while still complying with the policy.

    #### Wildcard and Broad Source Policies

    Policies that rely on wildcards (`*`, `https://*`, `*.example.com`) significantly expand the trust boundary. Subdomain takeovers or compromised third-party services may enable bypass within the allowed scope.

    #### Nonce Reuse or Predictable Nonces

    If nonces are reused across requests or generated predictably, attackers may reuse or guess them to execute injected scripts. Each response should generate a fresh, cryptographically strong nonce.

    #### Over-Reliance on strict-dynamic

    While `strict-dynamic` improves nonce-based policies, trust propagates from trusted scripts. If a trusted script loads attacker-controlled resources, the protection may be weakened.

    #### Missing Defense-in-Depth Directives

    Absence of directives such as:

    - `object-src 'none'`
    - `base-uri 'none'`
    - `frame-ancestors`

    may leave the application exposed to object injection, base tag manipulation, or clickjacking, even if script execution is partially restricted.

    #### CSP in Report-Only Mode

    Applications sometimes deploy CSP in `Report-Only` mode indefinitely. In such cases, violations are logged but not blocked, providing no real protection.
