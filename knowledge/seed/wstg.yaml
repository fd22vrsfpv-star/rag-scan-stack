- title: WSTG-CONF-14 Test Other HTTP Security Header Misconfigurations
  service: http
  tech: config
  doc_kind: wstg
  content: |-
    ## WSTG-CONF-14 — Test Other HTTP Security Header Misconfigurations

    Category: 02-Configuration_and_Deployment_Management_Testing  
    Source: OWASP WSTG (WSTG-CONF-14) — CC BY-SA 4.0

    Security headers play a vital role in protecting web applications from a wide range of attacks, including Cross-Site Scripting (XSS), Clickjacking, and data injection attacks. These headers instruct the browser on how to handle security-related aspects of a website’s communication, reducing exposure to known attack vectors. However, misconfigurations can lead to vulnerabilities, weakening the intended security protections or rendering them ineffective. This section outlines common security header misconfigurations, their risks, and how to properly test for them.

    ### Test Objectives

    - Identify improperly configured security headers.
    - Assess the impact of misconfigured security headers.
    - Validate the correct implementation of required security headers.

    ### How to Test

    ### Fetch and Review HTTP Security Headers

    To inspect the security headers used by an application, employ the following methods:

    - **Intercepting Proxies:** Use tools such as **Burp Suite** to analyze server responses.
    - **Command-line Tools:** Execute a curl command to retrieve HTTP response headers: `curl -I https://example.com`
        - Sometimes the web application will redirect to a new page, in order to follow redirect use the following command:`curl -L -I https://example.com`
        - Some Firewalls may block curl's default User-Agent and some TLS/SSL errors will also prevent it from returning the correct information, in this case you could try to use the following command:
        `curl -I -L -k --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/94.0.4606.81 Safari/537.36" https://example.com`
    - **Browser Developer Tools:** Open developer tools (F12), navigate to the **Network** tab, select a request, and view the **Headers** section.

    ### Check for Overly Permissive Security Headers

    - **Identify Risky Headers:** Look for headers that could allow excessive access, such as:
    - **Evaluate Directives:** Verify whether strict directives are enforced. For example, an overpermissive setup might appear as:

        ```http
        Access-Control-Allow-Origin: *
        Access-Control-Allow-Credentials: true
        X-Permitted-Cross-Domain-Policies: all
        Referrer-Policy: unsafe-url
        ```

        A safe configuration would look like:

        ```http
        Access-Control-Allow-Origin: {theallowedoriginurl}
        X-Permitted-Cross-Domain-Policies: none
        Referrer-Policy: no-referrer
        ```

    - **Cross-Reference Documentation:** Use resources such as the [Mozilla Developer Network: Security Headers](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers) to review secure and insecure directives.

    ### Check for Duplicate, Deprecated / Obsolete Headers

    - **Duplicate Headers:** Ensure that the same header is not defined multiple times with conflicting values.
    - **Obsolete Headers:** Identify and remove deprecated headers (e.g., HPKP) and outdated directives (e.g., `ALLOW-FROM` in X-Frame-Options). Refer to sources like [Mozilla Developer Network: X-Frame-Options](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options) for current standards.

    ### Confirm Proper Placement of Security Headers

    - **Protocol-Specific Requirements:** Validate that headers intended for secure contexts (e.g., HSTS) are delivered only under appropriate conditions (i.e., over HTTPS).
    - **Conditional Delivery:** Some headers may only be effective under specific circumstances. Verify that these conditions are met for the header to function as intended.

    ### Evaluate META Tag Handling

    - **Dual Enforcement Checks:** When a security policy like CSP is applied through both an HTTP header and a META tag using `http-equiv`, confirm that the HTTP header (which is generally considered more authoritative) is not inadvertently overridden by the META tag.
    - **Review Browser Behavior:** Test the application in various browsers to see if any differences occur due to the presence of conflicting directives. Where possible, avoid using dual definitions to prevent unintended security lapses.

    ### Test for Header Stripping (Hop-by-Hop Injection)

    Attackers can exploit this by listing sensitive security headers inside the `Connection` header. The proxy, following the standard, strips these headers before forwarding the request to the backend. This can lead to:

    - Bypassing IP-based Access Control Lists (ACLs).
    - Bypassing Identity/Authentication checks performed at the edge.
    - Disabling security features enforced by intermediary headers.

    #### Identification of Internal/Sensitive Headers (Reconnaissance)

    To perform this test, you first need to identify which headers are used by the internal infrastructure. You can identify them by:

    - **Triggering Error Pages:** Send malformed requests to trigger error pages (404, 500), which might leak internal headers in the response.
    - **Reflection Endpoints:** Search for debugging or "Echo" pages (e.g., `/phpinfo`, `/debug`, `/env`) that display all headers received by the backend.
    - **Header Guessing:** Common targets include `X-Forwarded-For`, `X-Real-IP`, `X-Forwarded-Proto`, and `X-Authenticated-User`.

    #### Execution of the Injection

    Attempt to "strip" a target header by adding it as a value to the `Connection` header.

    ##### Scenario A: Bypassing IP-based Restrictions

    ```http
    GET /admin HTTP/1.1
    Host: example.com
    X-Forwarded-For: 203.0.113.10
    Connection: close, X-Forwarded-For
    ```

    ##### Scenario B: Stripping Authentication Context

    ```http
    GET /api/user/profile HTTP/1.1
    Host: example.com
    X-Authenticated-User: victim_user
    Connection: close, X-Authenticated-User
    ```

    #### Analyzing the Response

    - **Vulnerable:** The application behavior changes (e.g., access is granted, or a reflected IP disappears).
    - **Secure:** The application behavior remains unchanged, or the proxy returns a `400 Bad Request`.
- title: WSTG-IDNT-01 Test Role Definitions
  service: http
  tech: identity
  doc_kind: wstg
  content: |-
    ## WSTG-IDNT-01 — Test Role Definitions

    Category: 03-Identity_Management_Testing  
    Source: OWASP WSTG (WSTG-IDNT-01) — CC BY-SA 4.0

    Applications have several types of functionalities and services, and those require access permissions based on the needs of the user. That user could be:

    ### Test Objectives

    - Identify and document roles used by the application.
    - Attempt to switch, change, or access another role.
    - Review the granularity of the roles and the needs behind the permissions given.

    ### How to Test

    ### Roles Identification

    The tester should start by identifying the application roles being tested through any of the following methods:

    - Application documentation.
    - Guidance by the developers or administrators of the application.
    - Application comments.
    - Fuzz possible roles:
        - Cookie variable (*e.g.* `role=admin`, `isAdmin=True`)
        - Account variable (*e.g.* `Role: manager`)
        - Hidden directories or files (*e.g.* `/admin`, `/mod`, `/backups`)
        - Switching to well known users (*e.g.* `admin`, `backups`, etc.)

    ### Switching to Available Roles

    After identifying possible attack vectors, the tester needs to test and validate that they can access the available roles.

    > Note: Some applications define the roles of the user on creation, through rigorous checks and policies, or by ensuring that the user's role is properly protected through a signature created by the backend. Finding that roles exist doesn't mean that they're a vulnerability.

    ### Review Roles Permissions

    After gaining access to the roles on the system, the tester must understand the permissions provided to each role.

    For example, a support engineer generally shouldn't be able to conduct administrative functionalities, manage the backups, or conduct any transactions in the place of a user.

    Users should also not be able to perform actions that increase their own privileges (such as adding themselves to a more privileged role) outside of very specific circumstances.

    An administrator shouldn't have full powers on the system. Sensitive admin functionality should leverage a maker-checker principle, or use MFA to ensure that the administrator is conducting the transaction. A clear example on this was the [Twitter incident in 2020](https://blog.twitter.com/en_us/topics/company/2020/an-update-on-our-security-incident.html).
- title: WSTG-IDNT-02 Test User Registration Process
  service: http
  tech: identity
  doc_kind: wstg
  content: |-
    ## WSTG-IDNT-02 — Test User Registration Process

    Category: 03-Identity_Management_Testing  
    Source: OWASP WSTG (WSTG-IDNT-02) — CC BY-SA 4.0

    Some websites offer a user registration process that automates (or semi-automates) the provisioning of system access to users. The identity requirements for access vary from positive identification to none at all, depending on the security requirements of the system. Many public applications completely automate the registration and provisioning process because the size of the user base makes it impossible to manage manually. However, many corporate applications will provision users manually, so this test case may not apply.

    ### Test Objectives

    - Verify that the identity requirements for user registration are aligned with business and security requirements.
    - Validate the registration process.

    ### How to Test

    Verify that the identity requirements for user registration are aligned with business and security requirements:

    1. Can anyone register for access?
    2. Are registrations vetted by a human prior to provisioning, or are they automatically granted if the criteria are met?
    3. Can the same person or identity register multiple times?
    4. Can users register for different roles or permissions?
    5. What proof of identity is required for a registration to be successful?
    6. Are registered identities verified?

    Validate the registration process:

    1. Can identity information be easily forged or faked?
    2. Can the exchange of identity information be manipulated during registration?

    ### Example

    In the WordPress example below, the only identification requirement is an email address that is accessible to the registrant.

    ![WordPress Registration Page](images/Wordpress_registration_page.jpg)\
    *Figure 4.3.2-1: WordPress Registration Page*

    In contrast, in the Google example below the identification requirements include name, date of birth, country, mobile phone number, email address and CAPTCHA response. While only two of these can be verified (email address and mobile number), the identification requirements are stricter than WordPress.

    ![Google Registration Page](images/Google_registration_page.jpg)\
    *Figure 4.3.2-2: Google Registration Page*

    Some applications may also automatically grant privileged roles to users when they register an account with an email address from a trusted domain. If ownership of the email address is not validated as part of the registration process, this could allow an attacker to gain access to a privileged account by registering a new user on that domain.

    Alternatively, if they only perform partial matching of the domain then it may be possible to register a privileged account using other similar domains. For example, if the application checks for email addresses ending in `example.org` then it may be possible to use the `notexample.org` domain; or if it checks for `@example.org` in the email address then it may be possible to use `@example.org.attacker.com`.
- title: WSTG-IDNT-03 Test Account Provisioning Process
  service: http
  tech: identity
  doc_kind: wstg
  content: |-
    ## WSTG-IDNT-03 — Test Account Provisioning Process

    Category: 03-Identity_Management_Testing  
    Source: OWASP WSTG (WSTG-IDNT-03) — CC BY-SA 4.0

    The provisioning of accounts presents an opportunity for an attacker to create a valid account without application of the proper identification and authorization process.

    ### Test Objectives

    - Verify which accounts may provision other accounts and of what type.

    ### How to Test

    Determine which roles are able to provision users and what sort of accounts they can provision.

    - Is there any verification, vetting and authorization of provisioning requests?
    - Is there any verification, vetting and authorization of de-provisioning requests?
    - Can an administrator provision other administrators or just users?
    - Can an administrator or other user provision accounts with privileges greater than their own?
    - Can an administrator or user de-provision themselves?
    - How are the files or resources owned by the de-provisioned user managed? Are they deleted? Is access transferred?

    ### Example

    In WordPress, only a user's name and email address are required to provision the user, as shown below:

    ![WordPress User Add](images/Wordpress_useradd.png)\
    *Figure 4.3.3-1: WordPress User Add*

    De-provisioning of users requires the administrator to select the users to be de-provisioned, select Delete from the dropdown menu (circled) and then applying this action. The administrator is then presented with a dialog box asking what to do with the user's posts (delete or transfer them).

    ![WordPress Auth and Users](images/Wordpress_authandusers.png)\
    *Figure 4.3.3-2: WordPress Auth and Users*
- title: WSTG-IDNT-04 Testing for Account Enumeration and Guessable User Account
  service: http
  tech: identity
  doc_kind: wstg
  content: |-
    ## WSTG-IDNT-04 — Testing for Account Enumeration and Guessable User Account

    Category: 03-Identity_Management_Testing  
    Source: OWASP WSTG (WSTG-IDNT-04) — CC BY-SA 4.0

    The scope of this test is to verify if it is possible to collect a set of valid usernames by interacting with the authentication mechanism of the application. This test will be useful for brute force testing, in which the tester verifies if, given a valid username, it is possible to find the corresponding password.

    ### Test Objectives

    - Review processes that pertain to user identification (*e.g.* registration, login, etc.).
    - Enumerate users where possible through response analysis.

    ### How to Test

    In black-box testing, the tester knows nothing about the specific application, username, application logic, error messages on log in page, or password recovery facilities. If the application is vulnerable, the tester receives a response message that reveals, directly or indirectly, some information useful for enumerating users.

    ### HTTP Response Message

    #### Testing for Valid Credentials

    Record the server answer when you submit a valid user ID and valid password.

    > Using a web proxy, notice the information retrieved from this successful authentication (HTTP 200 Response, length of the response).

    #### Testing for Valid User with Wrong Password

    Now, the tester should try to insert a valid user ID and a wrong password and record the error message generated by the application.

    > The browser should display a message similar to the following one:
    >
    > ![Authentication Failed](images/AuthenticationFailed.png)\
    > *Figure 4.3.4-1: Authentication Failed*
    >
    > Unlike any message that reveals the existence of the user like the following:
    >
    > `Login for User foo: invalid password`
    >
    > Using a web proxy, notice the information retrieved from this unsuccessful authentication attempt (HTTP 200 Response, length of the response).

    #### Testing for a Nonexistent Username

    Now, the tester should try to insert an invalid user ID and a wrong password and record the server answer (the tester should be confident that the username is not valid in the application). Record the error message and the server answer.

    > If the tester enters a nonexistent user ID, they can receive a message similar to:
    >
    > ![This User is Not Active](images/Userisnotactive.png)\
    > *Figure 4.3.4-3: This User is Not Active*
    >
    > or a message like the following one:
    >
    > `Login failed for User foo: invalid Account`
    >
    > Generally the application should respond with the same error message and length to the different incorrect requests. If the responses are not the same, the tester should investigate and find out the key that creates a difference between the two responses. For example:
    >
    > 1. Client request: Valid user/wrong password
    > 2. Server response: The password is not correct
    > 3. Client request: Wrong user/wrong password
    > 4. Server response: User not recognized
    >
    > The above responses let the client understand that for the first request they have a valid username. So they can interact with the application requesting a set of possible user IDs and observing the answer.
    >
    > Looking at the second server response, the tester understand in the same way that they don't hold a valid username. So they can interact in the same manner and create a list of valid user ID looking at the server answers.

    ### Other Ways to Enumerate Users

    Testers can enumerate users in several ways, such as:

    #### Analyzing the Error Code Received on Login Pages

    Some web application release a specific error code or message that we can analyze.

    #### Analyzing URLs and URL Redirections

    For example:

    - `https://www.foo.com/err.jsp?User=baduser&Error=0`
    - `https://www.foo.com/err.jsp?User=gooduser&Error=2`

    As is seen above, when a tester provides a user ID and password to the web application, they see a message indication that an error has occurred in the URL. In the first case they have provided a bad user ID and bad password. In the second, a good user ID and a bad password, so they can identify a valid user ID.

    #### URI Probing

    Sometimes a web server responds differently if it receives a request for an existing directory or not. For instance in some portals every user is associated with a directory. If testers try to access an existing directory they could receive a web server error.

    Some of the common errors received from web servers are:

    - 403 Forbidden error code
    - 404 Not found error code

    Example:

    - `https://www.foo.com/account1` - we receive from web server: 403 Forbidden
    - `https://www.foo.com/account2` - we receive from web server: 404 file Not Found

    In the first case the user exists, but the tester cannot view the web page, in second case instead the user "account2" does not exist. By collecting this information testers can enumerate the users.

    #### Analyzing Web Page Titles

    Testers can receive useful information on Title of web page, where they can obtain a specific error code or messages that reveal if the problems are with the username or password.

    For instance, if a user cannot authenticate to an application and receives a web page whose title is similar to:

    - `Invalid user`
    - `Invalid authentication`

    #### Analyzing a Message Received from a Recovery Facility

    When we use a recovery facility (i.e. a forgotten password function) a vulnerable application might return a message that reveals if a username exists or not.

    For example, messages similar to the following:

    - `Invalid username: email address is not valid or the specified user was not found.`
    - `Valid username: Your password has been successfully sent to the email address you registered with.`

    #### Friendly 404 Error Message

    When we request a user within the directory that does not exist, we don't always receive 404 error code. Instead, we may receive "200 OK" with an image, in this case we can assume that when we receive the specific image the user does not exist. This logic can be applied to other web server response; the trick is a good analysis of web server and web application messages.

    #### Analyzing Response Times

    As well as looking at the content of the responses, the time that the response takes should also be considered. Particularly where the request causes an interaction with an external service (such as sending a forgotten password email), this can add several hundred milliseconds to the response, which can be used to determine whether the requested user is valid.

    ### Guessing Users

    #### Predictable Username Structures

    In many organizations, usernames follow consistent patterns (e.g., first initial + last name such as jbloggs, or structured identifiers such

    _(truncated — see the full WSTG test)_
