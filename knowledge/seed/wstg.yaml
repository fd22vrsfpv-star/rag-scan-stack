- title: WSTG-CLNT-09 Testing for Clickjacking
  service: http
  tech: clientside
  doc_kind: wstg
  content: |-
    ## WSTG-CLNT-09 — Testing for Clickjacking

    Category: 11-Client-side_Testing  
    Source: OWASP WSTG (WSTG-CLNT-09) — CC BY-SA 4.0

    Clickjacking, a subset of UI redressing, is a malicious technique whereby a web user is deceived into interacting (in most cases by clicking) with something other than what the user believes they are interacting with. This type of attack, either alone or in conjunction with other attacks, could potentially send unauthorized commands or reveal confidential information while the victim is interacting with seemingly-harmless web pages. The term clickjacking was coined by Jeremiah Grossman and Robert Hansen in 2008.

    ### Test Objectives

    - Assess application vulnerability to clickjacking attacks.

    ### How to Test

    As mentioned above, this type of attack is often designed to allow an attacker to induce users’ actions on the target site, even if anti-CSRF tokens are being used.

    ### Load Target Web Page on a HTML Interpreter Using HTML iframe Tag

    Sites that do not protected against frame busting are vulnerable to clickjacking attack. If the `https://www.target.site` web page is successfully loaded into a frame, then the site is vulnerable to Clickjacking. An example of HTML code to create this testing web page is displayed in the following snippet:

    ```htmls
        <html>
            <head>
                <title>Clickjack test web page</title>
            </head>
            <body>
                <iframe src="https://www.target.site" width="400" height="400"></iframe>
            </body>
        </html>
    ```

    ### Test Application against Disabled JavaScript

    Since these types of client-side protections relies on JavaScript frame busting code, if the victim has JavaScript disabled or it is possible for an attacker to disable JavaScript code, the web page will not have any protection mechanism against clickjacking.

    There are few deactivation techniques that can be used with frames. More in depth techniques can be found on the [Clickjacking Defense Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html).

    ### Sandbox Attribute

    With HTML5 a new attribute called "sandbox" is available. It enables a set of restrictions on content loaded into the iframe.

    Example:

    ```html
    <iframe src="https://example.org" sandbox></iframe>
    ```

    ### Test Application on Compatibility and Accessibility Mode

    Mobile versions of the web page are usually smaller and faster than the desktop ones, and they have to be less complex than the main application. Mobile variants often have less protection. However, an attacker can fake the real origin given by a web browser, and a non-mobile victim may be able to visit an application made for mobile users. This scenario could allow the attacker to exploit a mobile version of the web page.
    Applications running on acessibility mode should also be tested against clickjacking, because site framming could be affected.

    ### Server-Side Protection: Using Frame-Ancestors Directive of Content Security Policy

    The HTTP Content-Security-Policy (CSP) response header allows web page administrators to control resources the user agent is allowed to load for a given web page. The `frame-ancestors` directive in the HTTP CSP specifies the acceptable parents that may embed a web page using the `<frame>`, `<iframe>`, `<object>`, `<embed>`, or `<applet>` tags.

    #### Testing Content Security Policy Response Header

    - Using a browser, open developer tools and access the target web page. Navigate to the Network tab.
    - Look for the request that loads the web page. It should have the same domain as the web page - usually be the first item on the Network tab.
    - Once you click on the file, more information will come up. Look for a 200 OK response code.
    - Scroll down to the Response Header Section. Content-Security-Policy section indicates level of protecting adopted.

    Alternatively view the web page source to find Content-Security-Policy in a meta tag. WSTG has a detailed information on [Test for Content Security Policy](../02-Configuration_and_Deployment_Management_Testing/12-Test_for_Content_Security_Policy.md).

    ##### Proxies

    Web proxies are known for adding and stripping headers. In the case in which a web proxy strips the `X-FRAME-OPTIONS` header then the site loses its framing protection.

    ##### Mobile Version of the Application

    In this case, because the `X-FRAME-OPTIONS` HTTP header has to be implemented in every page of the application, developers may have not protected every single page on the mobile version.

    ### Remediation

    - For measures to prevent Clickjacking, see the [Clickjacking Defense Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html).
    - For interactive labs on Clickjacking visit [Port Swigger Web Page](https://portswigger.net/web-security/clickjacking)
    - For additional resources on ClickJacking visit the [OWASP community](https://owasp.org/www-community/attacks/Clickjacking)
- title: WSTG-CLNT-10 Testing WebSockets
  service: http
  tech: clientside
  doc_kind: wstg
  content: |-
    ## WSTG-CLNT-10 — Testing WebSockets

    Category: 11-Client-side_Testing  
    Source: OWASP WSTG (WSTG-CLNT-10) — CC BY-SA 4.0

    Traditionally, the HTTP protocol only allows one request/response per TCP connection. Asynchronous JavaScript and XML (AJAX) allows clients to send and receive data asynchronously (in the background without a page refresh) to the server, however, AJAX requires the client to initiate the requests and wait for the server responses (half-duplex).

    ### Test Objectives

    - Identify the usage of WebSockets.
    - Assess its implementation by using the same tests on normal HTTP channels.

    ### How to Test

    ### Black-Box Testing

    1. Identify that the application is using WebSockets.
       - Inspect the client-side source code for the `ws://` or `wss://` URI scheme.
       - Use Google Chrome's Developer Tools to view the Network WebSocket communication.
       - Use [ZAP's](https://www.zaproxy.org) WebSocket tab.
    2. Origin.
       - Using a WebSocket client (one can be found in the Tools section below) attempt to connect to the remote WebSocket server. If a connection is established the server may not be checking the origin header of the WebSocket handshake.
    3. Confidentiality and Integrity.
       - Check that the WebSocket connection is using TLS to transport sensitive information `wss://`.
       - Check the HTTPS Implementation for security issues (Valid Certificate, BEAST, CRIME, RC4, etc). Refer to the [Testing for Weak Transport Layer Security](../09-Testing_for_Weak_Cryptography/01-Testing_for_Weak_Transport_Layer_Security.md) section of this guide.
    4. Authentication.
       - WebSockets do not handle authentication, normal black-box authentication tests should be carried out. Refer to the [Authentication Testing](../04-Authentication_Testing/README.md) sections of this guide.
    5. Authorization.
       - WebSockets do not handle authorization, normal black-box authorization tests should be carried out. Refer to the [Authorization Testing](../05-Authorization_Testing/README.md) sections of this guide.
    6. Input Sanitization.
       - Use [ZAP's](https://www.zaproxy.org) WebSocket tab to replay and fuzz WebSocket request and responses. Refer to the [Testing for Data Validation](../07-Input_Validation_Testing/README.md) sections of this guide.

    #### Example 1

    Once we have identified that the application is using WebSockets (as described above) we can use the [Zed Attack Proxy (ZAP)](https://www.zaproxy.org) to intercept the WebSocket request and responses. ZAP can then be used to replay and fuzz the WebSocket request/responses.

    ![ZAP WebSockets](images/OWASP_ZAP_WebSockets.png)\
    *Figure 4.11.10-1: ZAP WebSockets*

    #### Example 2

    Using a WebSocket client (one can be found in the Tools section below) attempt to connect to the remote WebSocket server. If the connection is allowed the WebSocket server may not be checking the WebSocket handshake's origin header. Attempt to replay requests previously intercepted to verify that cross-domain WebSocket communication is possible.

    ![WebSocket Client](images/WebSocket_Client.png)\
    *Figure 4.11.10-2: WebSocket Client*

    ### Gray-Box Testing

    Gray-box testing is similar to black-box testing. In gray-box testing, the pentester has partial knowledge of the application. The only difference here is that you may have API documentation for the application being tested which includes the expected WebSocket request and responses.
- title: WSTG-CLNT-11 Testing Web Messaging
  service: http
  tech: clientside
  doc_kind: wstg
  content: |-
    ## WSTG-CLNT-11 — Testing Web Messaging

    Category: 11-Client-side_Testing  
    Source: OWASP WSTG (WSTG-CLNT-11) — CC BY-SA 4.0

    Web Messaging (also known as [Cross Document Messaging](https://html.spec.whatwg.org/multipage/web-messaging.html#web-messaging)) allows applications running on different domains to communicate in a secure manner. Before the introduction of web messaging, the communication of different origins (between iframes, tabs and windows) was restricted by the same origin policy and enforced by the browser. Developers used multiple hacks in order to accomplish these tasks, and most of them were mainly insecure.

    ### Test Objectives

    - Assess the security of the message's origin.
    - Validate that it's using safe methods and validating its input.

    ### How to Test

    ### Examine Origin Security

    Testers should check whether the application code is filtering and processing messages from trusted domains. Within the sending domain, also ensure that the receiving domain is explicitly stated, and that `*` is not used as the second argument of `postMessage()`. This practice could introduce security concerns and could lead to, in the case of a redirection or if the origin changes by other means, the website sending data to unknown hosts, and therefore, leaking confidential data to malicious servers.

    If the website fails to add security controls to restrict the domains or origins that are allowed to send messages to a website, it is likely to introduce a security risk. Testers should examine the code for message event listeners and get the callback function from the `addEventListener` method for further analysis. Domains must always be verified prior to data manipulation.

    ### Examine Input Validation

    Although the website is theoretically accepting messages from trusted domains only, data must still be treated as externally-sourced, untrusted data, and processed with the appropriate security controls. Testers should analyze the code and look for insecure methods, in particular where data is being evaluated via `eval()` or inserted into the DOM via the `innerHTML` property, which may create DOM-based XSS vulnerabilities.

    ### Static Code Analysis

    JavaScript code should be analyzed to determine how web messaging is implemented. In particular, testers should be interested in how the website is restricting messages from untrusted domains, and how the data is handled even for trusted domains.

    In this example, access is needed for every subdomain (www, chat, forums, ...) within the owasp.org domain. The code is trying to accept any domain with `.owasp.org`:

    ```js
    window.addEventListener("message", callback, true);

    function callback(e) {
        if(e.origin.indexOf(".owasp.org")!=-1) {
            /* process message (e.data) */
        }
    }
    ```

    The intention is to allow subdomains such as:

    - `www.owasp.org`
    - `chat.owasp.org`
    - `forums.owasp.org`

    Unfortunately, this introduces vulnerabilities. An attacker can easily bypass the filter since a domain such as `www.owasp.org.attacker.com` will match.

    Here is an example of code that lacks an origin check. This is very insecure, as it will accept input from any domain:

    ```js
    window.addEventListener("message", callback, true);

    function callback(e) {
            /* process message (e.data) */
    }
    ```

    Here is an example with input validation vulnerabilities that may lead to XSS attack:

    ```js
    window.addEventListener("message", callback, true);

    function callback(e) {
            if(e.origin === "trusted.domain.com") {
                element.innerHTML= e.data;
            }
    }
    ```

    A more secure approach would be to use the property `innerText` instead of `innerHTML`.

    For further OWASP resources regarding web messaging, see [OWASP HTML5 Security Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html)
- title: WSTG-CLNT-12 Testing Browser Storage
  service: http
  tech: clientside
  doc_kind: wstg
  content: |-
    ## WSTG-CLNT-12 — Testing Browser Storage

    Category: 11-Client-side_Testing  
    Source: OWASP WSTG (WSTG-CLNT-12) — CC BY-SA 4.0

    Browsers provide the following client-side storage mechanisms for developers to store and retrieve data:

    ### Test Objectives

    - Determine whether the site is storing sensitive data in client-side storage.
    - The code handling of the storage objects should be examined for possibilities of injection attacks, such as utilizing unvalidated input or vulnerable libraries.

    ### How to Test

    ### LocalStorage

    `window.localStorage` is a global property that implements the [Web Storage API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API) and provides **persistent** key-value storage in the browser.

    Both the keys and values can only be strings, so any non-string values must be converted to strings first before storing them, usually done via [JSON.stringify](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify).

    Entries to `localStorage` persist even when the browser window closes, with the exception of windows in Private/Incognito mode.

    The maximum storage capacity of `localStorage` varies between browsers.

    #### List All Key-Value Entries

    ```javascript
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const value = localStorage.getItem(key);
      console.log(`${key}: ${value}`);
    }
    ```

    ### SessionStorage

    `window.sessionStorage` is a global property that implements the [Web Storage API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API) and provides **ephemeral** key-value storage in the browser.

    Both the keys and values can only be strings, so any non-string values must be converted to strings first before storing them, usually done via [JSON.stringify](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify).

    Entries to `sessionStorage` are ephemeral because they are cleared when the browser tab/window is closed.

    The maximum storage capacity of `sessionStorage` varies between browsers.

    #### List All Key-Value Entries

    ```javascript
    for (let i = 0; i < sessionStorage.length; i++) {
      const key = sessionStorage.key(i);
      const value = sessionStorage.getItem(key);
      console.log(`${key}: ${value}`);
    }
    ```

    ### IndexedDB

    IndexedDB is a transactional, object-oriented database intended for structured data. An IndexedDB database can have multiple object stores and each object store can have multiple objects.

    In contrast to localStorage and sessionStorage, IndexedDB can store more than just strings. Any objects supported by the [structured clone algorithm](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm) can be stored in IndexedDB.

    An example of a complex JavaScript object that can be stored in IndexedDB, but not in localStorage/sessionStorage are [CryptoKeys](https://developer.mozilla.org/en-US/docs/Web/API/CryptoKey).

    W3C recommendation on [Web Crypto API](https://www.w3.org/TR/WebCryptoAPI/) [recommends](https://www.w3.org/TR/WebCryptoAPI/#concepts-key-storage) that CryptoKeys that need to be persisted in the browser, to be stored in IndexedDB. When testing a web page, look for any CryptoKeys in IndexedDB and check if they are set as `extractable: true` when they should have been set to `extractable: false` (i.e. ensure the underlying private key material is never exposed during cryptographic operations.)

    #### Print All the Contents of IndexedDB

    ```javascript
    const dumpIndexedDB = dbName => {
      const DB_VERSION = 1;
      const req = indexedDB.open(dbName, DB_VERSION);
      req.onsuccess = function() {
        const db = req.result;
        const objectStoreNames = db.objectStoreNames || [];

        console.log(`[*] Database: ${dbName}`);

        Array.from(objectStoreNames).forEach(storeName => {
          const txn = db.transaction(storeName, 'readonly');
          const objectStore = txn.objectStore(storeName);

          console.log(`\t[+] ObjectStore: ${storeName}`);

          // Print all entries in objectStore with name `storeName`
          objectStore.getAll().onsuccess = event => {
            const items = event.target.result || [];
            items.forEach(item => console.log(`\t\t[-] `, item));
          };
        });
      };
    };

    indexedDB.databases().then(dbs => dbs.forEach(db => dumpIndexedDB(db.name)));
    ```

    ### Cookies

    Cookies are a key-value storage mechanism that is primarily used for session management but web developers can still use it to store arbitrary string data.

    Cookies are covered extensively in the [testing for Cookies attributes](../06-Session_Management_Testing/02-Testing_for_Cookies_Attributes.md) scenario.

    #### List All Cookies

    ```javascript
    console.log(window.document.cookie);
    ```

    ### Global Window Object

    Sometimes web developers initialize and maintain global state that is available only during the runtime life of the page by assigning custom attributes to the global `window` object. For example:

    ```javascript
    window.MY_STATE = {
      counter: 0,
      flag: false,
    };
    ```

    Any data attached on the `window` object will be lost when the page is refreshed or closed.

    #### List All Entries on the Window Object

    ```javascript
    (() => {
      // create an iframe and append to body to load a clean window object
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      // get the current list of properties on window
      const currentWindow = Object.getOwnPropertyNames(window);

      // filter the list against the properties that exist in the clean window
      const results = currentWindow.filter(
        prop => !iframe.contentWindow.hasOwnProperty(prop)
      );

      // remove iframe
      document.body.removeChild(iframe);

      // log key-value entries that are different
      results.forEach(key => console.log(`${key}: ${window[key]}`));
    })();
    ```

    _(Modified version of this [snippet](https://stackoverflow.com/a/17246535/3099132))_

    ### Security Implications

    When reviewing browser storage mechanisms, testers should evaluate whether sensitive data is unnecessarily exposed on the client-side. Modern applications, especially SPAs, frequently store authentication tokens or application state in browser storage, which may introduce security risks.

    Common concerns include:

    - Authentication tokens (e.g., JWTs) stored in `localStorage` or `sessionStorage`, which are accessible via JavaScript and may be exposed through XSS.
    - Tokens or session identifiers persisting after logout.

    _(truncated — see the full WSTG test)_
- title: WSTG-CLNT-13 Testing for Cross Site Script Inclusion
  service: http
  tech: clientside
  doc_kind: wstg
  content: |-
    ## WSTG-CLNT-13 — Testing for Cross Site Script Inclusion

    Category: 11-Client-side_Testing  
    Source: OWASP WSTG (WSTG-CLNT-13) — CC BY-SA 4.0

    Cross Site Script Inclusion (XSSI) vulnerability allows sensitive data leakage across-origin or cross-domain boundaries. Sensitive data could include authentication-related data (login states, cookies, auth tokens, session IDs, etc.) or user's personal or sensitive personal data (email addresses, phone numbers, credit card details, social security numbers, etc.). XSSI is a client-side attack similar to Cross Site Request Forgery (CSRF) but has a different purpose. Where CSRF uses the authenticated user context to execute certain state-changing actions inside a victim’s page (e.g. transfer money to the attacker's account, modify privileges, reset password, etc.), XSSI instead uses JavaScript on the client-side to leak sensitive data from authenticated sessions.

    ### Test Objectives

    - Locate sensitive data across the system.
    - Assess the leakage of sensitive data through various techniques.

    ### How to Test

    ### SameSite Cookie Considerations

    The examples below rely on the browser attaching the victim's authentication cookie to a cross-site `<script src="...">` request - a subresource load, not a top-level navigation. Per the [`SameSite`](../06-Session_Management_Testing/02-Testing_for_Cookies_Attributes.md#samesite-attribute) behavior described in the Cookie Attributes section, `Lax` cookies are not sent on subresource requests, so by default these PoCs won't leak data in a browser that defaults to `Lax` (Chromium-based, since Chrome 80) unless the session cookie explicitly sets `SameSite=None; Secure`.

    This doesn't mean the underlying vulnerability is fixed - only that reproducing it now depends on the cookie's `SameSite` configuration and the browser under test. Check the `Set-Cookie` header directly, and retest in a browser that doesn't default to `Lax` (e.g. Firefox) if a PoC doesn't fire.

    ### Collect Data Using Authenticated and Unauthenticated User Sessions

    Identify which endpoints are responsible for sending sensitive data, what parameters are required, and identify all relevant dynamically and statically generated JavaScript responses using authenticated user sessions. Pay special attention to sensitive data sent using [JSONP](https://en.wikipedia.org/wiki/JSONP). To find dynamically generated JavaScript responses, generate authenticated and unauthenticated requests, then compare them. If they're different, it means the response is dynamic; otherwise it's static. To simplify this task, a tool such as [Veit Hailperin's Burp proxy plugin](https://github.com/luh2/DetectDynamicJS) can be used. Make sure to check other file types in addition to JavaScript; XSSI is not limited to JavaScript files alone.

    ### Determine Whether the Sensitive Data Can Be Leaked Using JavaScript

    Testers should analyze code for the following vehicles for data leakage via XSSI vulnerabilities:

    1. Global variables
    2. Global function parameters
    3. CSV (Comma Separated Values) with quotations theft
    4. JavaScript runtime errors
    5. Prototype chaining using `this`

    ### 1. Sensitive Data Leakage via Global Variables

    An API key is stored in a JavaScript file with the URI `https://victim.com/internal/api.js` on the victim's website, `victim.com`, which is only accessible to authenticated users. An attacker configures a website, `attackingwebsite.com`, and uses the `<script>` tag to refer to the JavaScript file.

    Here are the contents of `https://victim.com/internal/api.js`:

    ```javascript
    (function() {
      window.secret = "supersecretUserAPIkey";
    })();
    ```

    The attack site, `attackingwebsite.com`, has an `index.html` with the following code:

    ```html
    <!DOCTYPE html>
    <html>
      <head>
        <title>Leaking data via global variables</title>
      </head>
      <body>
        <h1>Leaking data via global variables</h1>
        <script src="https://victim.com/internal/api.js"></script>
        <div id="result">
        </div>
        <script>
          var div = document.getElementById("result");
          div.innerHTML = "Your secret data <b>" + window.secret + "</b>";
        </script>
      </body>
    </html>
    ```

    In this example, a victim is authenticated with `victim.com`. An attacker lures the victim to `attackingwebsite.com` via social engineering, phishing emails, etc. The victim's browser then fetches `api.js`, resulting in the sensitive data being leaked via the global JavaScript variable and displayed using `innerHTML`.

    ### 2. Sensitive Data Leakage via Global Function Parameters

    This example is similar to the previous one, except in this case `attackingwebsite.com` uses a global JavaScript function to extract the sensitive data by overwriting the victim's global JavaScript function.

    Here are the contents of `https://victim.com/internal/api.js`:

    ```javascript
    (function() {
      var secret = "supersecretAPIkey";
      window.globalFunction(secret);
    })();
    ```

    The attack site, `attackingwebsite.com`, has an `index.html` with the following code:

    ```html
    <!DOCTYPE html>
    <html>
      <head>
        <title>Leaking data via global function parameters</title>
      </head>
      <body>
        <div id="result">
        </div>
        <script>
          function globalFunction(param) {
            var div = document.getElementById("result");
            div.innerHTML = "Your secret data: <b>" + param + "</b>";
          }
        </script>
        <script src="https://victim.com/internal/api.js"></script>
      </body>
    </html>
    ```

    There are other XSSI vulnerabilities that can result in sensitive data leakage either via JavaScript prototype chains or global function calls. For more on these attacks, see [The Unexpected Dangers of Dynamic JavaScript](https://www.usenix.org/system/files/conference/usenixsecurity15/sec15-paper-lekies.pdf).

    ### 3. Sensitive Data Leakage via CSV with Quotations Theft

    To leak data the attacker/tester has to be able to inject JavaScript code into the CSV data. The following example code is an excerpt from Takeshi Terada's [Identifier based XSSI attacks](https://www.mbsd.jp/Whitepaper/xssi.pdf) whitepaper.

    ```text
    HTTP/1.1 200 OK
    Content-Type: text/csv
    Content-Disposition: attachment; filename="a.csv"
    Content-Length: xxxx

    1,"___","aaa@a.example","03-0000-0001"
    2,"foo","bbb@b.example","03-0000-0002"
    ...
    98,"bar","yyy@example.net","03-0000-0088"
    99,"___","zzz@example.com","03-0000-0099"
    ```

    In this example, using the `___` columns as injection points and inserting JavaScript strings in their place has the following result.

    ```text
    1,"\"",$$$=function(){/*","aaa@a.example","03-0000-0001"
    2,"foo","bbb@b.example","03-0000-0002"
    ...
    98,"bar","yyy@example.net","03-0000-0088"
    99,"*/}//","zzz@example.com","03-0000-0099"
    ```

    [Jeremiah Grossman wrote about a similar vulnerability in Gmail](https://blog.jeremiahgrossman.com/2006/01/advanced-web-attack-techniques-using.html) in 2006 that allowed the extraction of user contacts in JSON. In this case, the data was received from Gmail and parsed by the browser JavaScript engine using an unreferenced Array constructor to leak the data. An attacker could access

    _(truncated — see the full WSTG test)_
- title: WSTG-CLNT-14 Testing for Reverse Tabnabbing
  service: http
  tech: clientside
  doc_kind: wstg
  content: |-
    ## WSTG-CLNT-14 — Testing for Reverse Tabnabbing

    Category: 11-Client-side_Testing  
    Source: OWASP WSTG (WSTG-CLNT-14) — CC BY-SA 4.0

    [Reverse Tabnabbing](https://owasp.org/www-community/attacks/Reverse_Tabnabbing) is an attack which can be used to redirect users to phishing pages. This usually becomes possible due to the `target` attribute of the `<a>` tag being set to `_blank` which causes the link to be opened in a new tab. When the attribute `rel='noopener noreferrer'` is not used in the same `<a>` tag, the newly opened page can influence the original page and redirect it to a domain controlled by the attacker.

    ### How to Test

    - Check the HTML source of the application to see if links with `target="_blank"` are using the `noopener` and `noreferrer` keywords in the `rel` attribute. If not, it is likely that the application is vulnerable to reverse tabnabbing. Such a link becomes exploitable if it either points to a third-party site that has been compromised by the attacker, or if it is user-controlled.
    - Check for areas where an attacker can insert links, i.e. control the `href` argument of an `<a>` tag. Try to insert a link to a page which has the source code given in the above example, and see if the original domain redirects. This test can be done in IE if other browsers don't work.
- title: WSTG-CLNT-15 Testing for Client-side Template Injection
  service: http
  tech: clientside
  doc_kind: wstg
  content: |-
    ## WSTG-CLNT-15 — Testing for Client-side Template Injection

    Category: 11-Client-side_Testing  
    Source: OWASP WSTG (WSTG-CLNT-15) — CC BY-SA 4.0

    Client-Side Template Injection (CSTI), also known as DOM-based Template Injection, arises when applications using client-side frameworks (such as Angular, Vue.js, or Alpine.js) dynamically embed user input into the web page's DOM. If this input is embedded into a template expression or interpreted by the framework's template engine, an attacker can inject malicious directives.

    ### Test Objectives

    - Identify the client-side framework and its version used by the application.
    - Detect injection points where user input is reflected into the DOM and processed by the template engine.
    - Assess if the injection allows for arbitrary JavaScript execution (XSS) via the template syntax.

    ### How to Test

    ### Black-Box Testing

    #### Framework Identification

    The first step is to identify if a client-side framework is in use. Testers should look for specific attributes in the HTML source code or specific HTTP response headers.

    - **Angular:** Look for attributes like `ng-app`, `ng-model`, or `ng-bind`.
    - **Vue.js:** Look for attributes starting with `v-`, such as `v-if`, `v-for`, or the presence of the Vue global object in the console.
    - **Alpine.js:** Look for `x-data`, `x-html`.

    #### Injection Detection

    To detect CSTI, testers should inject characters that are syntactically significant to the template engine. The most common syntax for interpolation in many frameworks is double curly braces {% raw %}`{{ }}`{% endraw %}.

    A simple arithmetic operation is the standard probe. If the application evaluates the math, it is vulnerable.

    **Generic Probe:**

    {% raw %}

    ```txt
    Inject the string: {{ 7*7 }}
    ```

    {% endraw %}

    - If the application renders `49`, CSTI is present.
    - If the application renders {% raw %}`{{ 7*7 }}`{% endraw %}, it is likely not vulnerable or strict contextual escaping is in place.

    #### Angular

    Angular acts on the DOM. If an attacker can inject a string containing Angular expressions into the DOM before Angular bootstraps or compiles it, the expression will be executed.

    **Payloads for Detection:**

    {% raw %}

    - `{{ 7*7 }}`
    - `{{ constructor.constructor('alert(1)')() }}`

    {% endraw %}

    In older versions of Angular (1.x), the template engine works in a sandbox. Exploitation requires breaking out of this sandbox. The complexity of the payload depends heavily on the specific version.

    **Example Payload (Angular 1.5.x sandbox bypass):**

    {% raw %}

    ```javascript
    {{x={'y':''.constructor.prototype};x['y'].charAt=[].join;$eval('x=alert(1)');}}
    ```

    {% endraw %}

    #### Vue.js

    Vue.js is also susceptible if developers use the `v-html` directive with user input or if they mount a Vue instance on a DOM element that already contains user-controlled HTML.

    **Payloads for Detection:**

    {% raw %}

    - `{{ 7*7 }}`

    {% endraw %}

    **Example Payload (Vue.js 2.x):**

    {% raw %}

    ```javascript
    {{_v.constructor('alert(1)')()}}
    ```

    {% endraw %}

    #### Alpine.js

    Alpine.js relies heavily on DOM attributes. If an attacker can control an attribute name or inject into a directive, they can execute code.

    **Example Payload:**

    ```html
    <div x-data="" x-html="'<img src=x onerror=alert(1)>'"></div>
    ```

    ### Gray-Box Testing

    #### Code Review

    In a gray-box scenario, testers verify how user input is handled in the frontend code. The key is to identify where "sinks" that interpret HTML or Template Syntax are used with "tainted" sources (user input).

    **Angular Sinks:**
    Search for usages of `$compile` or `ng-bind-html`.
    If `ng-bind-html` is used, check if `$sce` (Strict Contextual Escaping) is properly configured or if `$sce.trustAsHtml()` is used on untrusted data.

    ```javascript
    // Vulnerable example in Angular
    $scope.htmlSnippet = $sce.trustAsHtml(userInput);
    ```

    **Vue.js Sinks:**
    Search for the `v-html` directive. Using `v-html` on user-provided content is a primary cause of CSTI/XSS in Vue.

    ```html
    <div v-html="userProvidedComment"></div>
    ```

    **React Sinks:**
    While React is generally safer regarding template injection because it does not scan the DOM for templates (JSX is compiled), improper use of `dangerouslySetInnerHTML` allows for DOM-based XSS, which is the React equivalent of the risk profile discussed here.

    {% raw %}

    ```javascript
    // Vulnerable example in React
    <div dangerouslySetInnerHTML={{__html: userContent}} />
    ```

    {% endraw %}

    #### Configuration Review

    Check specifically for Content Security Policy (CSP) headers. A strong CSP can mitigate the impact of CSTI by restricting where scripts can be loaded from or preventing the execution of inline scripts (including those generated by template engines).

    Look for `unsafe-eval` in the CSP. Many template engines (especially older ones) require `unsafe-eval` to compile templates dynamically. If `unsafe-eval` is present, CSTI attacks are significantly easier to exploit.
- title: WSTG-APIT-01 API Reconnaissance
  service: http
  tech: api
  doc_kind: wstg
  content: |-
    ## WSTG-APIT-01 — API Reconnaissance

    Category: 12-API_Testing  
    Source: OWASP WSTG (WSTG-APIT-01) — CC BY-SA 4.0

    Reconnaissance is an important step in any pentesting engagement. This includes API pentesting. Reconnaissance significantly enhances the effectiveness of the testing process by gathering information about the API and developing an understanding of the target. This phase not only increases the likelihood of discovering critical security issues but also ensures a comprehensive evaluation of the APIs' security posture.

    ### Test Objectives

    - Find all API endpoints supported by the backend server code, documented or undocumented.
    - Find all parameters for each endpoint supported by the backend server, documented or undocumented.
    - Discover interesting data related to APIs in HTML and JavaScript sent to clients.

    ### How to Test

    ### Find the Documentation

    In both public and private cases, the API documentation will be useful based on its level of the quality and accuracy. Public API documentation is typically shared with everyone whereas private API documentation is only shared with the intended client. However, in both cases finding documentation, accidentally leaked or otherwise will be helpfull in your investigation.

    Regardless of the visibility of the API, searching for API documentation can find older, not-yet-published, or accidentally leaked API documentation. This documentation will be very helpfull in understanding what the attack surface the API exposes.

    ### API Directories

    Alternatives sources of API documentation can incluide API Directories, such as:

    - GitHub in general
    - [GitHub Public APIs Repository](https://github.com/public-apis/public-apis)
    - [APIs.guru](https://apis.guru)
    - [RapidAPI](https://rapidapi.com/)
    - [PublicAPIs](https://publicapis.dev/) and [PublicAPIs](https://publicapis.io/)
    - [Postman API Network](https://www.postman.com/explore)

    ### Looking in Well Known Places

    If documentation is not readily apparent, then you can actively search the target for documentation based on a few obvious names or paths. These include:

    - /api-docs
    - /doc
    - /swagger
    - /swagger.json
    - /openapi.json
    - /.well-known/schema-discovery

    ### Robots.txt

    `robots.txt` is a text file that site owners create to instruct web crawlers (such as search engine bots) on how to crawl and index their site. It is part of the Robots Exclusion Protocol (REP), which regulates how bots interact with sites.

    This file may provide additional clues to path structure or API endpoints.

    The [Information Gathering](../01-Information_Gathering/README.md) section refers to robots.txt in several cases including WSTG-INFO-01, WSTG-INFO-03, WSTG-INFO-05, and WSTG-INFO-08.

    ### GitDorking

    If the application uses GitHub, GitLab, or other public facing Git based repositories then we can also search for any clues or sensitive content (also known as `GitDorking`). This information can include passwords, API keys, configuration files, and other confidential data that developers may accidentally or inadvertently commit to their repositories. Organizations can accidentally share sensitive code, sample, or test code that may provide clues to implementation details. The personal GitHub accounts of the target's employees may also accidentally release information that can provide clues.

    ### Browsing and Spidering the Application

    Even if you have the API documentation browsing the application is a good idea. Documentation can be outdated, inaccurate, or incomplete.

    Browsing the application with an intercepting proxy such as ZAP or Burp Suite records endpoints for later inspection. In addition, using their built-in spidering functionality, intercepting proxies can help generate a comprehensive list of endpoints. From the spidered URLs look for links with obvious API URL naming schemes. These include:

    - `https://example.com/api/v1` (or v2 etc)  
    - `https://example.com/graphql`

    Or subdomains the applications may consume or depend upon:

    - `https://api.example.com/api/v1`

    It is important that the pentester attempts to exercise as much functionality in the application as possible. This is not only to generate a comprehensive list of endpoints but also to avoid issues with lazy loading and code splitting. In addition, your pentest engagement should include sample accounts at different privilege levels so that your browser and spidering can access and expose endpoints for as much functionality as possible.

    Once completed, the endpoint information obtained from browsing and spidering of the application can help the pentester compose API documentation of the target using other tools such as Postman.

    ### Analyze Intercepted Requests

    When auditing REST APIs, use an interception proxy to collect full HTTP requests. REST services utilize more than just URL parameters, so capturing the complete request body and headers is critical.

    Analyze the collected requests to identify non-standard or hidden parameters:

    - Identify HTTP headers that influence application behavior or resource selection.
    - Determine if a URL segment has a repeating pattern across multiple URLs. Patterns containing dates, numbers, or identifier values may indicate a URL-embedded parameter. For example, in the URL `https://api.example.com/user/2026-10-03/profile`, the date segment may represent a parameter value.
    - Identify structured parameter values formatted in JSON, XML, or other custom structures.
    - Examine the final element of a URL. If it lacks a file extension, it may be a parameter.
    - Look for highly varying URL segments. If a single segment changes frequently across hundreds of requests, it is more likely to represent a parameter value than a static path component.

    ### Google Dorking

    Using passive reconnaissance techniques such as Google Dorking with directives such as `site` and `inurl` allows us to tailor a search for common API keywords that the Google indexer may have found. Review [Conduct Search Engine Discovery Reconnaissance for Information Leakage](../01-Information_Gathering/01-Conduct_Search_Engine_Discovery_Reconnaissance_for_Information_Leakage.md) for additional information.

    Here are a few API specific examples:

    `site:"mytargetsite.com" inurl:"/api"`

    `inurl:apikey filetype:env`

    Other keywords can include `"v1"`, `"api"`, `"graphql"`.

    We can extend the Google Dorking to include subdomains of the target.

    Wordlists are helpful here for a comprehensive list of common words used in APIs.

    ### Look Back, Way Back

    In general APIs change over time. But deprecated or older version may still be operational either on purpose or by misconfiguration. These should also be tested as there is a good chance that they will contain vulnerabilities that newer versions have fixed. In addition, changes to APIs show newer features which may be less robust and therefore

    _(truncated — see the full WSTG test)_
- title: WSTG-APIT-02 API Broken Object Level Authorization
  service: http
  tech: api
  doc_kind: wstg
  content: |-
    ## WSTG-APIT-02 — API Broken Object Level Authorization

    Category: 12-API_Testing  
    Source: OWASP WSTG (WSTG-APIT-02) — CC BY-SA 4.0

    Broken Object Level Authorization (BOLA) occurs when an API does not properly enforce authorization checks for each object accessed by the client. Attackers can manipulate object identifiers in API requests (such as IDs, GUIDs, or tokens) to access or modify resources they are not authorized to. This vulnerability is critical in APIs due to their direct access to underlying objects and the prevalence of APIs in modern applications.

    ### Test Objectives

    - The objective of this test is to identify whether the API enforces proper **object-level authorization** checks, ensuring that users can only access and manipulate objects they are authorized to interact with.

    ### How to Test

    ### Understand API Endpoints and Object References

    Review API documentation (e.g. OpenAPI specification), traffic, or use an interception proxy (e.g., **Burp Suite**, **ZAP**) to identify endpoints that accept object identifiers of interest. These could be in the form of **IDs**, **UUIDs**, or other references.

    Examples:

    - `GET /api/users/{user_id}`
    - `GET /api/orders/{order_id}`
    - `POST /graphql`\
            `query: {user(id: "123") }`

    With the knowledge gained in the previous step, review and collect third-party object identifiers (e.g. user IDs, orders IDs etc) that can be used subsequently in the object identifiers manipulation.

    Additionally, generate a list of potential object identifiers for brute-force. For example, if an API is retrieving a purchase order from an authenticated user, generate various purchase order IDs for testing.

    ### Manipulate Object Identifiers in API Requests

    With the goal to determine if users can access or modify objects they do not own by altering object identifiers in API request, change the object identifier (e.g., user ID, order ID) in the URL or request body.
      
    Example: Modify a request like `GET /api/users/123/profile` (where 123 is the current user ID) to `GET /api/users/124/profile` (where 124 is another user's ID).

    Depending on the application context, utilize two different accounts to perform the tests. With an account A, create resources that exclusively belongs to that account (e.g. purchase order) and with an account B, try to access the resource from account A (e.g. purchase order).

    ### Test Object-Level Access with Different HTTP Methods

    Test various **HTTP methods** for BOLA vulnerabilities:

    - **GET**: Try accessing unauthorized objects by manipulating the object ID in the request.
    - **POST/PUT/PATCH**: Attempt to create or modify objects that belong to other users.
    - **DELETE**: Try to delete an object owned by another user.

    ### Test BOLA in GraphQL APIs

    For **GraphQL APIs**, send a query with a modified object ID in the query parameters (see [Testing GraphQL](https://owasp.org/www-project-web-security-testing-guide/stable/4-Web_Application_Security_Testing/12-API_Testing/01-Testing_GraphQL)):

    Example: `query { user(id: "124") { name, email } }`.

    ### Test for Bulk Object Access

    Test if the API allows unauthorized **bulk access** to objects. This could happen in endpoints that return lists of objects.

    Example: `GET /api/users` returns data for all users instead of only the authenticated user’s data.
- title: WSTG-APIT-03 Testing for Excessive Data Exposure
  service: http
  tech: api
  doc_kind: wstg
  content: |-
    ## WSTG-APIT-03 — Testing for Excessive Data Exposure

    Category: 12-API_Testing  
    Source: OWASP WSTG (WSTG-APIT-03) — CC BY-SA 4.0

    Excessive data exposure occurs when an API returns more information in its responses than the client needs to display or function. This commonly happens when developers implement API endpoints by serializing entire backend objects (such as database models or internal data structures) directly into API responses, relying on the client-side code to filter out sensitive fields before presenting them to the user.

    ### Test Objectives

    - Identify API responses that contain more data than what the client application displays or requires.
    - Detect sensitive fields returned in API responses such as password hashes, authentication tokens, internal object IDs, PII, or infrastructure details.
    - Determine whether the API relies on client-side filtering rather than server-side field selection to control data exposure.

    ### How to Test

    ### Compare API Responses Against Displayed Data

    The most direct test is to compare what the user interface shows with what the API actually returns.

    1. Open the application in a browser and navigate to a page that displays user or object data (e.g., a profile page, an order summary, or a dashboard).
    2. Open the browser's developer tools (Network tab) or configure an intercepting proxy such as Burp Suite or ZAP.
    3. Identify the API requests that populate the page content.
    4. Compare the fields displayed in the UI against the full set of fields in the API response.

    For example, a user profile page might display only a name and email, but the underlying API response might return:

    ```json
    {
      "id": 12045,
      "name": "Alice Johnson",
      "email": "alice@example.com",
      "password_hash": "$2b$12$LJ3m4ys5qGn...",
      "role": "admin",
      "internal_account_id": "ACC-2024-88421",
      "ssn": "123-45-6789",
      "api_key": "REDACTED_EXAMPLE_KEY_12345",
      "created_by": "system_migration_v2",
      "last_login_ip": "10.0.3.47"
    }
    ```

    In this case, the API returns password hashes, social security numbers, API keys, internal identifiers, and internal IP addresses that the UI never displays.

    ### Inspect Responses Across Different API Endpoints

    Do not limit testing to a single endpoint. Check responses from multiple endpoint types:

    - **User and account endpoints:** `GET /api/users/{id}`, `GET /api/me`, `GET /api/account`
    - **List and search endpoints:** `GET /api/users`, `GET /api/orders?status=completed` (list endpoints frequently return the same full object for every item in the list, amplifying the exposure)
    - **Related object endpoints:** `GET /api/orders/{id}` may embed full user objects, payment details, or shipping addresses within the order response
    - **Error responses:** Failed requests may return verbose error messages containing stack traces, internal file paths, database query details, or configuration values
    - **Administrative or internal endpoints:** Check if endpoints intended for internal use are accessible externally and return elevated data

    ### Test with Different User Privilege Levels

    The same endpoint may return different amounts of data depending on the requesting user's role. Test whether:

    - A low-privilege user receives the same fields as an administrator when requesting the same resource.
    - An unauthenticated request returns data that should require authentication.
    - Requesting another user's data (IDOR) returns the same rich object as requesting your own.

    For example, `GET /api/users/124` might return the full object including sensitive fields regardless of whether the requester is user 124, another user, or unauthenticated.

    ### Analyze Nested and Embedded Objects

    Modern APIs frequently embed related objects within responses. A single API call may return deeply nested structures that expose data from multiple backend systems.

    Example: An order endpoint returning an embedded customer object, a payment object, and a shipping object:

    ```json
    {
      "order_id": "ORD-9923",
      "items": [...],
      "customer": {
        "id": 5001,
        "name": "Bob Smith",
        "email": "bob@example.com",
        "phone": "+1-555-0199",
        "date_of_birth": "1985-03-14",
        "loyalty_tier": "gold"
      },
      "payment": {
        "method": "card",
        "card_last_four": "4242",
        "card_brand": "Visa",
        "card_fingerprint": "fp_abc123xyz",
        "billing_address": {...}
      },
      "internal_notes": "Customer flagged for manual review - suspected fraud"
    }
    ```

    Each nested object should be reviewed for fields that exceed what the consuming client needs.

    ### Test for Mass Assignment

    For endpoints that accept a JSON or XML body, test for mass assignment vulnerabilities by adding extra fields to the request body beyond those displayed in the application interface. Fields such as role identifiers, privilege flags, or account status attributes are high-value targets.

    ### Check for Sensitive Data in GraphQL Responses

    GraphQL APIs present a specific form of this issue. While GraphQL allows clients to select which fields they want, the schema may expose sensitive fields that the default UI queries do not request but that an attacker can add to a custom query.

    1. If introspection is enabled, retrieve the schema and review available fields on each type (see [Testing GraphQL](99-Testing_GraphQL.md)):

        ```graphql
        {
          __type(name: "User") {
            fields {
              name
              type { name }
            }
          }
        }
        ```

    2. Look for fields such as `passwordHash`, `apiKey`, `ssn`, `internalId`, `role`, or `isAdmin` that are queryable but not used by the frontend.
    3. Attempt to query these fields directly:

        ```graphql
        {
          user(id: "123") {
            name
            email
            passwordHash
            apiKey
            role
          }
        }
        ```

    ### Examine JavaScript Source Maps and Client-Side Bundles

    Frontend JavaScript bundles and source maps can inadvertently reveal the expected API response structure, including fields the UI intentionally hides. If source maps are publicly accessible (e.g., at `main.js.map`), they can expose:

    - The full list of fields the frontend expects from API responses
    - Internal API endpoint paths
    - Authentication and authorization flow logic
    - Hardcoded API keys, tokens, or configuration values

    Test for source map availability:

    ```http
    GET /static/js/main.js.map
    GET /assets/app.js.map
    ```

    If the source map is accessible and contains `sourcesContent`, the original source code can be reconstructed and analyzed for expected API response structures and hidden fields.

    ### Check Error Responses and Debug Output

    APIs may leak sensitive information through error responses, particularly when running in development or debug mode:

    - **Stack traces** revealing internal file paths, framework versions, and code structure
    - **Database error messages** exposing table names, column names, or query syntax
    - **Verbose validation errors** listing all expected fields, including those not documented in the

    _(truncated — see the full WSTG test)_
- title: WSTG-APIT-04 API Broken Function Level Authorization
  service: http
  tech: api
  doc_kind: wstg
  content: |-
    ## WSTG-APIT-04 — API Broken Function Level Authorization

    Category: 12-API_Testing  
    Source: OWASP WSTG (WSTG-APIT-04) — CC BY-SA 4.0

    Broken Function Level Authorization (BFLA) occurs when an API improperly enforces restrictions on users accessing certain functions or operations. This vulnerability allows attackers to invoke sensitive functions they are not authorized to execute, such as administrative functions or other high-privilege operations.

    ### Test Objectives

    - The goal of this test is to determine if the API enforces **role or privilege-based access control** to restrict users from accessing or executing functions they are not authorized to use. This ensures that function-level security boundaries are properly enforced.

    ### How to Test

    ### Identify Function-Level Endpoints

    Review API documentation (e.g. OpenAPI specification), traffic, or use an interception proxy (e.g., **Burp Suite**, **ZAP**) to identify different function-level endpoints. These might include:
      
    - **Administrative functions** (e.g., `/api/admin/deleteUser`, `/api/admin/getAllUsers`)
    - **Role-based operations** (e.g., `/api/admin/promoteUser`, `/api/user/createOrder`)
    - **Critical functions** for users (e.g., `/api/user/withdrawFunds`)

    Focus on **functionality differences** between different user roles (e.g., regular user, admin, partner, guest) and endpoints that offer more sensitive capabilities.

    ### Manipulate Role-Based Access Controls

    Try to access or perform sensitive operations exposed in API endpoints that should be restricted based on user roles.

    Log in as a lower-privilege user (e.g., guest or regular user) and send requests to endpoints that perform sensitive actions reserved for higher-privilege roles (e.g., admin).

    Example: as a **regular user**, send a request to the following administrative endpoint to delete a random user:

    ```http
    POST /api/admin/deleteUser
    Authorization: Bearer <regular_user_token>

    { "userId": "12345" }
    ```

    ### Test Function-Level Access with Different HTTP Methods

    Test various **HTTP methods** for BFLA vulnerabilities. Test each identified resource with alternative HTTP methods. Issue requests using methods other than those documented (such as `PUT`, `DELETE`, or `PATCH`) against endpoints that normally accept only `GET` or `POST`. Record any difference in response behavior or authorization outcome.

    - **GET**: Attempt to access information available only to high-privilege users, such as administrators.
        - Example: `GET /api/admin/getAllUsers`
    - **POST/PUT/PATCH**: Attempt to modify or create sensitive resources, such as changing user roles or system-critical data.
        - Example: `POST /api/admin/promoteUser { "userId": "12345", "newRole": "admin" }`
    - **DELETE**: Attempt to delete sensitive resources, such as removing user accounts or data.
        - Example: `DELETE /api/admin/deleteUser/12345`

    ### Test for BFLA in GraphQL APIs

    In **GraphQL APIs**, test if a user can invoke functions restricted to higher-privilege roles by modifying GraphQL queries.

    Example: `mutation { deleteUser(id: "12345") { success } }`.
- title: WSTG-APIT-99 Testing GraphQL
  service: http
  tech: api
  doc_kind: wstg
  content: |-
    ## WSTG-APIT-99 — Testing GraphQL

    Category: 12-API_Testing  
    Source: OWASP WSTG (WSTG-APIT-99) — CC BY-SA 4.0

    GraphQL has become very popular in modern APIs. It provides simplicity and nested objects, which facilitate faster development. While every technology has advantages, it can also expose the application to new attack surfaces. The purpose of this scenario is to provide some common misconfigurations and attack vectors on applications that utilize GraphQL. Some vectors are unique to GraphQL (e.g. [Introspection Query](#introspection-queries)) and some are generic to APIs (e.g. [SQL injection](#sql-injection)).

    ### Test Objectives

    - Assess that a secure and production-ready configuration is deployed.
    - Validate all input fields against generic attacks.
    - Ensure that proper access controls are applied.

    ### How to Test

    Testing GraphQL nodes is not very different than testing other API technologies. Consider the following steps:

    ### Introspection Queries

    Introspection queries are the method by which GraphQL lets you ask what queries are supported, which data types are available, and many more details you will need when approaching a test of a GraphQL deployment.

    The [GraphQL website describes Introspection](https://graphql.org/learn/introspection/):

    > "It's often useful to ask a GraphQL schema for information about what queries it supports. GraphQL allows us to do so using the introspection system!"

    There are a couple of ways to extract this information and visualize the output, as follows.

    #### Using Native GraphQL Introspection

    The most straightforward way is to send an HTTP request (using a personal proxy) with the following payload, taken from an article on [Medium](https://medium.com/@the.bilal.rizwan/graphql-common-vulnerabilities-how-to-exploit-them-464f9fdce696):

    ```graphql
    query IntrospectionQuery {
      __schema {
        queryType {
          name
        }
        mutationType {
          name
        }
        subscriptionType {
          name
        }
        types {
          ...FullType
        }
        directives {
          name
          description
          locations
          args {
            ...InputValue
          }
        }
      }
    }
    fragment FullType on __Type {
      kind
      name
      description
      fields(includeDeprecated: true) {
        name
        description
        args {
          ...InputValue
        }
        type {
          ...TypeRef
        }
        isDeprecated
        deprecationReason
      }
      inputFields {
        ...InputValue
      }
      interfaces {
        ...TypeRef
      }
      enumValues(includeDeprecated: true) {
        name
        description
        isDeprecated
        deprecationReason
      }
      possibleTypes {
        ...TypeRef
      }
    }
    fragment InputValue on __InputValue {
      name
      description
      type {
        ...TypeRef
      }
      defaultValue
    }
    fragment TypeRef on __Type {
      kind
      name
      ofType {
        kind
        name
        ofType {
          kind
          name
          ofType {
            kind
            name
            ofType {
              kind
              name
              ofType {
                kind
                name
                ofType {
                  kind
                  name
                  ofType {
                    kind
                    name
                  }
                }
              }
            }
          }
        }
      }
    }
    ```

    The result will usually be very long (and hence has been shortened here), and it will contain the entire schema of the GraphQL deployment.

    Response:

    ```json
    {
      "data": {
        "__schema": {
          "queryType": {
            "name": "Query"
          },
          "mutationType": {
            "name": "Mutation"
          },
          "subscriptionType": {
            "name": "Subscription"
          },
          "types": [
            {
              "kind": "ENUM",
              "name": "__TypeKind",
              "description": "An enum describing what kind of type a given __Type is",
              "fields": null,
              "inputFields": null,
              "interfaces": null,
              "enumValues": [
                {
                  "name": "SCALAR",
                  "description": "Indicates this type is a scalar.",
                  "isDeprecated": false,
                  "deprecationReason": null
                },
                {
                  "name": "OBJECT",
                  "description": "Indicates this type is an object. `fields` and `interfaces` are valid fields.",
                  "isDeprecated": false,
                  "deprecationReason": null
                },
                {
                  "name": "INTERFACE",
                  "description": "Indicates this type is an interface. `fields` and `possibleTypes` are valid fields.",
                  "isDeprecated": false,
                  "deprecationReason": null
                },
                {
                  "name": "UNION",
                  "description": "Indicates this type is a union. `possibleTypes` is a valid field.",
                  "isDeprecated": false,
                  "deprecationReason": null
                },
              ],
              "possibleTypes": null
            }
          ]
        }
      }
    }
    ```

    A tool such as [GraphQL Voyager](https://apis.guru/graphql-voyager/) can be used to get a better understanding of the GraphQL endpoint:

    ![GraphQL Voyager](images/Voyager.png)\
    *Figure 12.1-1: GraphQL Voyager*

    This tool creates an Entity Relationship Diagram (ERD) representation of the GraphQL schema, allowing you to get a better look into the moving parts of the system you're testing. Extracting information from the drawing allows you to see you can query the Dog table for example. It also shows which properties a Dog has:

    - ID
    - name
    - veterinary (ID)

    There is one downside to using this method: GraphQL Voyager does not display everything that can be done with GraphQL. For example, the mutations available are not listed in the drawing above. A better strategy would be to use both Voyager and one of the methods listed below.

    #### Using GraphiQL

    [GraphiQL](https://github.com/graphql/graphiql) is a web-based IDE for GraphQL. It is part of the GraphQL project, and it is mainly used for debugging or development purposes. The best practice is to not allow users to access it on production deployments. If you are testing a staging environment, you might have access to it and can thus save some time when working with introspection queries (although you can, of course, use introspection in the GraphiQL interface).

    GraphiQL has a documentation section, which uses the data from the schema in order to create a document of the GraphQL instance that is being used. This document contains the data types, mutations, and basically every piece of information that can be extracted using introspection.

    #### Using GraphQL Playground

    [GraphQL Playground](https://github.com/graphql/graphql-playground) is a GraphQL client. It can be used to test different queries, as well as divide GraphQL IDEs into different playgrounds, and group them by theme or by assigning a name to them. Much like GraphiQL, Playground can create documentation for you without the need for manually sending introspection queries and proces

