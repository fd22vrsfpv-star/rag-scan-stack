    ```
    _contexts: sudo, suid_
    The command is executed by `root` in the background when a core dump occurs.

    To trigger a core dump, send the `SIGQUIT` signal to a process, for example:

    ```
    sleep infinity &
    kill -QUIT $!
    ```

    ### file-read
