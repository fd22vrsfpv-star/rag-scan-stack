# Exported from the live knowledge base — 21 rule(s), all engagements.
#
# These were already reviewed when accepted, so nothing here is commented out.
#
#   ./scripts/import-knowledge.sh --file <this file> --dry-run
#   ./scripts/import-knowledge.sh --file <this file>

prompts:
- selector_type: port
  port: 161
  title: Unidentified 161
  prompt: Port 161 responded but the service was not fingerprinted. UDP scans lose probes
    under rate limiting — re-probe with an SNMP-specific tool before assuming it is not SNMP.
  priority: 80
  enabled: true
- selector_type: port_service
  service: ajp13
  port: 8009
  title: AJP connector — Ghostcat file read
  prompt: 'AJP is Tomcat''s binary connector and is routinely exposed without authentication.
    Enumerate with `nmap -p8009 --script=ajp-auth,ajp-headers,ajp-methods {target}`. The significant
    issue is Ghostcat (CVE-2020-1938): a reachable AJP connector allows reading files under
    the web root, including `WEB-INF/web.xml`, which typically contains database credentials
    and internal endpoints. If file upload is possible anywhere on the host it escalates to
    code execution. Always check the paired HTTP connector (commonly 8080 or 8180) with any
    credentials recovered.'
  training_notes: AJP is a Tomcat indicator even when the HTTP port is filtered. ajp-brute
    exists but Ghostcat needs no credentials — check the file read first.
  tags:
  - tomcat
  - ajp
  - ghostcat
  - file-read
  priority: 10
  enabled: true
- selector_type: port_service
  service: bindshell
  port: 1524
  title: bindshell on 1524 — connect before scanning further
  prompt: 'Port 1524 answering is the classic ingreslock backdoor: a root shell bound to a
    port with no authentication. Connect directly with `nc {target} 1524` and issue `id` —
    if it answers, the host is already compromised and you have root without exploiting anything.
    Verify before reporting: the port is also legitimately used by Ingres, so confirm you
    have an interactive shell rather than a database banner. Treat a live bindshell as a finding
    about the host''s existing compromise, not only as your access route.'
  training_notes: '`socat - TCP:{target}:1524` is an alternative when nc''s flavour behaves
    oddly. Preserve evidence of the pre-existing backdoor: someone else put it there.'
  tags:
  - backdoor
  - unauthenticated
  - root
  priority: 5
  enabled: true
- selector_type: port_service
  service: exec
  port: 512
  title: rexec — remote execution service
  prompt: 'Berkeley rexec accepts a username and password over cleartext and runs a command.
    Enumerate with `nmap -p512 --script=rexec-brute {target}` to test credentials; any success
    is direct command execution, not just an information leak. Capture traffic if possible
    — credentials cross the wire in the clear, so a single observed login yields reusable
    credentials for the whole r-services family (512/513/514) and often for SSH on the same
    host. Do not assume the service is unused because it is obsolete: on legacy and lab hosts
    it is frequently left with weak or shared credentials.'
  training_notes: Paired with login/513 and shell/514. If any one of the three authenticates,
    try the same credentials against the others immediately — they usually share an account
    database (~/.rhosts or hosts.equiv).
  tags:
  - r-services
  - cleartext
  - legacy
  priority: 20
  enabled: true
- selector_type: port_service
  service: irc
  port: 6667
  title: IRC on 6667
  prompt: Enumerate the IRC server for version information. If it is UnrealIRCd, check for
    known backdoors such as the one triggered by 'AB' prefixing a system command.
  tags:
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 100
  enabled: true
- selector_type: port_service
  service: java-rmi
  port: 1099
  title: Java RMI registry — enumerate bound objects
  prompt: 'Dump the registry with `nmap -p1099 --script=rmi-dumpregistry {target}` to list
    bound objects and their classes; the names alone often reveal the application and its
    internals. Then check `rmi-vuln-classloader`, which reports whether the registry permits
    remote class loading — that is remote code execution as the service account. Note the
    JDK version from the banner: default-allow class loading is a property of older JDKs.'
  training_notes: Frequently paired with an application server on another port. Object names
    in the registry are useful pivots for finding the app's own endpoints.
  tags:
  - java
  - rmi
  - rce
  priority: 20
  enabled: true
- selector_type: port_service
  service: login
  port: 513
  title: rlogin — trust-based remote login
  prompt: 'rlogin authenticates by host trust as well as password, so a permissive `~/.rhosts`
    or `/etc/hosts.equiv` grants a shell with NO credentials at all. Probe with `nmap -p513
    --script=rlogin-brute {target}`. Try `root` and common service accounts first: the classic
    misconfiguration is `+ +` in .rhosts, which trusts every host and user. Check 512 and
    514 on the same target — the three r-services are installed together and share trust configuration.'
  training_notes: A trust-based success needs no password, so an empty-credential result is
    a finding rather than a failed brute force. Note which source host was trusted; that is
    the pivot for reaching it again.
  tags:
  - r-services
  - trust
  - legacy
  priority: 20
  enabled: true
- selector_type: port_service
  service: nfs
  port: 2049
  title: NFS — exports and no_root_squash
  prompt: 'List exports with `showmount -e {target}`, and check what is actually readable
    with `nmap -p2049 --script=nfs-showmount,nfs-ls,nfs-statfs {target}`. A world-readable
    export is a file-disclosure finding on its own. The higher-value case is an export with
    `no_root_squash`: mount it and write a setuid binary, or drop a key into a user''s `~/.ssh/authorized_keys`,
    for a direct path to that account. Always note the export options, not just the paths
    — the options are what determine exploitability.'
  training_notes: Cross-reference with rpcbind/111, which announces mountd. Home directories
    exported read-write are the usual route to SSH access.
  tags:
  - nfs
  - file-disclosure
  - privesc
  priority: 20
  enabled: true
- selector_type: port_service
  service: postgresql
  port: 5432
  title: PostgreSQL Default Credentials
  prompt: Attempt authentication using the default administrative account 'postgres' with
    the password 'postgres'. Many legacy or lab-configured installations of PostgreSQL may
    use these identical credentials for the initial setup.
  training_notes: '## Default Credentials

    - Username: postgres

    - Password: postgres'
  tags:
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 100
  enabled: true
- selector_type: port_service
  service: rpcbind
  port: 111
  title: rpcbind — enumerate RPC programs before anything else
  prompt: 'rpcbind is a directory, not a target: it tells you which RPC services exist and
    on which ports, several of which will be on high ports the port scan may have missed.
    Run `rpcinfo -p {target}` first, then `nmap -p111 --script=rpcinfo {target}`. Look for
    nfs and mountd (leads to 2049 — see the nfs rule), ypserv/NIS (password map disclosure),
    and rquotad/statd. Feed any newly revealed high ports back into a targeted scan; that
    is the whole point of enumerating it early.'
  training_notes: rpc-grind fingerprints programs whose version is unclear. rpcbind is the
    cheapest way to discover services that a top-1000 port scan does not reach.
  tags:
  - rpc
  - enumeration
  - pivot
  priority: 10
  enabled: true
- selector_type: port_service
  service: snmp
  port: 161
  title: SNMP on 161
  prompt: Open SNMP is usually an information-disclosure win before it is an exploit. Try
    the default community strings first (public, private, community) with onesixtyone, then
    walk the tree with snmpwalk -v2c. Pull the interface table, running processes, installed
    software and the ARP cache — those map internal hosts you cannot otherwise see. Only consider
    write access (snmpset) after confirming a writable community, and never without authorisation
    to change device state.
  training_notes: '## SNMP (161/udp)


    ### Community strings worth trying first

    `public`, `private`, `community`, `manager`, `admin`, plus the vendor

    defaults (`cisco`, `ILMI`). SNMPv1/v2c send these in cleartext.


    ### High-value OIDs

    - `1.3.6.1.2.1.1.1.0` — sysDescr: OS and exact version

    - `1.3.6.1.2.1.25.4.2.1.2` — running processes

    - `1.3.6.1.2.1.25.6.3.1.2` — installed software

    - `1.3.6.1.2.1.4.22.1.2` — ARP cache: internal neighbours

    - `1.3.6.1.2.1.2.2.1.2` — interfaces, including non-routable segments


    ### Why it matters

    A read-only community on a router or switch commonly leaks the internal

    topology, hostnames and software inventory in one pass — reconnaissance

    that would otherwise need credentialed access.


    ### Version notes

    v3 is authenticated; if the host speaks v3 only, enumerate usernames

    rather than community strings and do not burn time on onesixtyone.

    '
  tags:
  - snmp
  - network
  - default-login
  priority: 10
  enabled: true
- selector_type: port_service
  service: x11
  port: 6000
  title: X11 — unauthenticated display access
  prompt: An X server with access control disabled hands over the interactive session. Test
    with `nmap -p6000 --script=x11-access {target}`; if it reports access granted, confirm
    with `xdpyinfo -display {target}:0` and enumerate windows with `xwininfo -root -tree -display
    {target}:0`. This yields keystroke capture and screenshots of whatever the logged-in user
    is doing — treat a positive result as session compromise, not an information leak.
  training_notes: Caused by `xhost +` or a display manager started without authentication.
    Ports 6000-6005 map to displays :0-:5, so probe the range rather than 6000 alone.
  tags:
  - x11
  - unauthenticated
  - session
  priority: 20
  enabled: true
- selector_type: service
  service: distccd
  title: Distcc Command Execution
  prompt: Check for command execution vulnerabilities in distccd. This service is often designed
    to scale compiler jobs and can be abused to execute arbitrary commands if misconfigured.
  training_notes: '## Metasploit Module

    - `exploit/unix/misc/distcc_exec`'
  tags:
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 10
  enabled: true
- selector_type: service
  service: mysql
  title: MySQL Root Empty Password
  prompt: Attempt to login as root with an empty password. MySQL installations frequently
    leave the root account unsecured in default configurations.
  training_notes: '## Default Credentials

    - Username: `root`

    - Password: (empty)'
  tags:
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 100
  enabled: true
- selector_type: service
  service: samba
  title: Samba Symlink Traversal
  prompt: Check for Samba symlink traversal vulnerabilities. If a writeable share exists and
    'wide links' are enabled (a common default), it may be allowed to access the root filesystem.
  training_notes: '## Metasploit Module

    - `auxiliary/admin/smb/samba_symlink_traversal`'
  tags:
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 20
  enabled: true
- selector_type: service
  service: snmp
  title: SNMP anywhere
  prompt: 'Treat SNMP as a read-first target: enumerate community strings, then walk for system,
    process and network-neighbour data before any write attempt.'
  tags:
  - snmp
  priority: 50
  enabled: true
- selector_type: service
  service: vnc
  title: VNC Default Password
  prompt: Attempt to login with common default passwords for VNC servers. Some distributions
    ship with a very simple password.
  training_notes: '## Common Defaults

    - Password: `password`'
  tags:
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 100
  enabled: true
- selector_type: tech
  tech: dvwa
  title: DVWA Default Credentials
  prompt: Attempt authentication using the default credentials for DVWA. These are often left
    unchanged in labs or training environments.
  training_notes: "| \n## Default Credentials\n- Username: admin\n- Password: password"
  tags:
  - default-login
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 10
  enabled: true
- selector_type: tech
  tech: mutillidae
  title: Mutillidae Enumeration
  prompt: Check for the existence of Mutillidae by looking for specific pages like `add-to-your-blog.php`
    or `phpinfo.php`. If found, target the following endpoints for SQL injection and XSS,
    as they are characteristically vulnerable in this application. Prioritize testing the
    `UID` cookie and the `username` fields across various registration and login forms.
  training_notes: "| \n## Vulnerable Endpoints\n- `add-to-your-blog.php`: SQLi and XSS on\
    \ blog entry, username\n- `browser-info.php`: XSS/JS Injection via Referer/User-Agent\
    \ headers\n- `dns-lookup.php`: OS Command injection on host/ip field; SQLi/XSS on logs\n\
    - `login.php` & `process-login-attempt.php`: Auth bypass and SQLi in username/password\
    \ fields\n- `user-info.php`: SQLi to dump usernames/passwords via username/password fields\n\
    - `source-viewer.php` / `text-file-viewer.php`: Arbitrary file inclusion (LFI)\n- `index.php`:\
    \ SQLi in the UID cookie; HTTP Response Splitting via username\n- `log-visit.php`: `Referer`\
    \ and `User-Agent` headers are targets for SQLi/XSS\n- `register.php`: SQLi/XSS on username,\
    \ signature, password fields\n- `robots.txt`: May reveal private directories\n- `config.inc*`:\
    \ may contain unencrypted DB credentials"
  tags:
  - mutillidae
  - sqli
  - xss
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 100
  enabled: true
- selector_type: tech
  tech: unrealircd
  title: UnrealIRCd Backdoor Check
  prompt: Check for the UnrealIRCd backdoor. Send 'AB' followed by a system command to the
    server to verify if it is vulnerable. This specific backdoor allows for remote code execution
    without authentication.
  tags:
  - source:walkthrough:metasploitable-2-exploitability-guide
  priority: 10
  enabled: true
- selector_type: tech
  tech: wordpress
  title: WordPress hosts
  prompt: Enumerate plugins and users before running generic web templates — the vulnerable
    surface is almost always a plugin, not core. Check /wp-json/wp/v2/users and xmlrpc.php.
  training_notes: '## WordPress

    - `/wp-json/wp/v2/users` enumerates usernames without auth on many installs

    - `xmlrpc.php` allows password-guess amplification via `system.multicall`

    - Plugin paths under `/wp-content/plugins/` reveal versions in readme.txt

    '
  tags:
  - wordpress
  - wp-plugin
  - cve
  priority: 100
  enabled: true

