[pytest]
# Confine collection to tests/.
#
# Two files named `test_tools.py` live outside it (downloads/ and
# open-webui/tools/). With no __init__.py between them pytest resolves both to
# the module name `test_tools` and aborts the ENTIRE session with "import file
# mismatch" — so a bare `pytest` ran zero of the 1000+ real tests.
#
# norecursedirs rather than a conftest collect_ignore_glob because it applies
# during directory recursion even when an explicit path is passed, so `pytest .`
# behaves the same as `pytest`.
testpaths = tests
norecursedirs =
    downloads
    open-webui
    mcp/third_party
    node_modules
    .git
    *.egg
    build
    dist
    venv
    .venv

# Markers used across tests/ but registered nowhere, so every run emitted
# PytestUnknownMarkWarning (119 for `unit` alone) and `-m unit` was an
# undocumented convention rather than a supported selection. A genuinely new
# warning is invisible in a wall of known ones.
markers =
    unit: pure-function test, no database, container or network
    integration: crosses a service or process boundary
    database: needs a reachable Postgres; must skip cleanly without one
    e2e: end-to-end, may dispatch real work
    scan_recommender: scoped to the scan_recommender service
    playwright: needs the Playwright browser stack
