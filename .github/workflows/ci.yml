name: CI

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      # Two passes, deliberately split.
      #
      # BLOCKING: syntax errors and undefined names only (E9, F63, F7, F82). An
      # undefined name is always a bug — it crash-loops a container on import,
      # and `ast.parse` accepts it. This used to be `flake8 … || true`, which
      # discarded the result entirely, and the service directories that actually
      # run in containers were not even in the list.
      #
      # F821 specifically, NOT the F82 prefix: that also selects F824 ("global X
      # is unused"), which is a style nit and would make this pass fail on
      # pre-existing code for no safety gain.
      #
      # `scanner` is deliberately absent from this list — that directory does not
      # exist. The advisory pass below still names it, and flake8 answers
      # `E902 FileNotFoundError`, which `|| true` has been swallowing.
      #
      # The two excluded files are ORPHANED FRAGMENTS, not modules: app/old_rag-api.py
      # is 52 lines beginning mid-file with a bare `@app.post(...)` and no imports,
      # and app/scan_recommender.py is a 24-line function body. Neither is imported
      # by anything. They are excluded rather than deleted because removing files is
      # a separate decision from turning the lint on.
      - name: Lint python (errors only — blocking)
        run: |
          flake8 --select=E9,F63,F7,F821 --show-source \
            --exclude app/old_rag-api.py,app/scan_recommender.py \
            etl app nuclei web_scanner dashboard/bff scan_recommender \
            kali_listener playwright_scanner nmap_scanner autogen_agents
      # NON-BLOCKING: style. Kept advisory on purpose — a large existing codebase
      # would fail on formatting alone, and that noise is what made the whole step
      # `|| true` in the first place.
      - name: Lint python (style — advisory)
        run: |
          flake8 etl app scanner nuclei || true
      - name: Byte-compile python
        run: |
          python -m compileall -q etl app scanner nuclei
      - name: Check shared module drift
        run: |
          python3 scripts/check_shared_code.py --list
      - name: Run test suite
        run: |
          pip install -r tests/requirements.txt
          # DB-backed and service-backed tests skip cleanly without them.
          pytest tests/ -q
      - name: Check shell script syntax
        run: |
          # scripts/cleanup-old-files.sh sat unparseable at HEAD — a stray
          # 'fi' — so scheduled cleanup could never have run. Nothing
          # checked, because the script is only invoked from cron.
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done
          exit $fail

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: vitest 4 declares ^20 || ^22 || >=24 and development
          # here runs on 26, so pinning the oldest supported line maximises the
          # local/CI gap for no benefit. 22 is LTS and explicitly supported by
          # both vite and vitest.
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      # Was NOT run here, which is why 19 failing tests sat unnoticed on a clean
      # tree: zustand's persist middleware died because jsdom exposes no
      # localStorage, so every store test failed before asserting anything.
      # Fixed in src/test/setup.ts; wiring the suite in is what keeps it fixed.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
