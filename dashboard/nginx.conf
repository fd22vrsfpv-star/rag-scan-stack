# HTTP — serve normally (for internal container-to-container health checks)
# External access should use HTTPS on port 443
server {
    listen 80;
    server_name _;

    # Health check (no redirect)
    location = /api/health {
        proxy_pass http://127.0.0.1:8050;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/dashboard.crt;
    ssl_certificate_key /etc/nginx/ssl/dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /app/frontend/dist;
    index index.html;

    # Allow large uploads (ZIP imports with screenshots/scan results)
    client_max_body_size 600m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Knowledge conversion: fetch/crawl a guide, then one LLM pass per chunk plus
    # a gap pass per missed service. On a local model that runs well past the 300s
    # the rest of /api/ gets, and a 504 here discards the whole run — so these two
    # routes get their own timeout rather than lengthening it for every endpoint.
    #
    # Longest-prefix wins between ^~ blocks, so these take precedence over /api/.
    # They must stay ^~: a ^~ match on /api/ would suppress a regex location.
    # Keep in sync with the BFF's own timeouts in dashboard/bff/routers/kb.py
    # (url/convert 1200s, walkthrough/convert 900s) — nginx must be the looser of
    # the two, or the BFF's specific error message never reaches the browser.
    # WireGuard peer creation installs packages on the remote node over SSH, so
    # it runs for minutes. The install step alone allows 420s (it waits up to
    # 120s for the dpkg lock), and the generic /api/ 300s cap cut it off with a
    # 504 while the install was still succeeding on the node — leaving the peer
    # half-configured and the operator with no result.
    location ^~ /api/wg/peers {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location ^~ /api/kb/url/convert {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location ^~ /api/kb/walkthrough/convert {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
    }

    # API proxy to BFF
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # SARIF export and other non-/api/ BFF routes
    location ^~ /sarif-export {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Never cache index.html so browsers always get fresh asset hashes
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # Static asset caching — short TTL so rebuilds take effect quickly
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
